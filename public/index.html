<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СПН Игры - Кейс с АК-47</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Модальное окно авторизации -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2>Авторизация</h2>
            <p style="color: #aaa; font-size: 14px; margin-bottom: 25px;">Войдите через Telegram, чтобы начать игру и получить 1000 монет!</p>
            
            <!-- Надежная кнопка-ссылка для авторизации -->
            <a href="https://t.me/spngame_auth_bot?start=auth" id="telegramLoginBtn" class="btn telegram-btn" target="_blank">
                💬 Войти через Telegram
            </a>
            
            <p id="authError" class="error"></p>
        </div>
    </div>

    <!-- Основной игровой интерфейс -->
    <div class="container" id="gameContainer" style="display: none;">
        <div class="header">
            <div>Игрок: <span id="userNameDisplay"></span></div>
            <div>Баланс: <span id="userBalance">1000</span> 🪙</div>
        </div>

        <h1>Коллекция АК-47</h1>
        
        <div class="roulette-container">
            <div class="selector-line"></div>
            <div class="roulette-strip" id="rouletteStrip"></div>
        </div>

        <button id="openCaseBtn" class="btn">Открыть кейс (100 🪙)</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
