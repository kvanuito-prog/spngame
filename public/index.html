<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СПН Проект - Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Форма регистрации -->
    <div id="authContainer" class="card">
        <h2>Регистрация</h2>
        <input type="text" id="usernameInput" placeholder="Псевдоним">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <input type="email" id="emailInput" placeholder="Почтовый ящик">
        <button id="registerBtn" class="btn">Зарегистрироваться</button>
        <p id="errorMsg" class="error"></p>
    </div>

    <!-- Личный кабинет (появляется после входа) -->
    <div id="profileContainer" class="card" style="display: none;">
        <h2>Добро пожаловать!</h2>
        <p>Псевдоним: <span id="displayUsername" style="color: #00ffcc; font-weight: bold;"></span></p>
        <p>Почта: <span id="displayEmail" style="color: #aaa;"></span></p>
        <button id="logoutBtn" class="btn secondary">Выйти</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
