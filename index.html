<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD 10×10 — Земля</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: #05070b;
    color: #f3f7fb;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
}

.game {
    width: 100%;
    max-width: 1200px;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    font-size: clamp(25px, 5vw, 44px);
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 7px;
    color: #8d9aaa;
    font-size: 14px;
}

/* PANEL */

.panel {
    background: #0b1018;
    border: 1px solid #182433;
    border-radius: 16px;
    padding: 15px;
}

/* EARTH */

.earth-area {
    height: min(72vw, 650px);
    min-height: 390px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    position: relative;

    background:
        radial-gradient(
            circle at center,
            #101d2b 0%,
            #071019 45%,
            #030509 100%
        );

    border-radius: 16px;
}

.earth {
    width: min(78vw, 520px);
    height: min(78vw, 520px);

    max-width: 520px;
    max-height: 520px;

    position: relative;

    border-radius: 50%;

    overflow: hidden;

    cursor: grab;

    background:
        radial-gradient(
            circle at 35% 30%,
            #4e9bc0 0%,
            #17617e 35%,
            #0b354c 68%,
            #031522 100%
        );

    box-shadow:
        inset -45px -30px 80px rgba(0,0,0,.65),
        inset 25px 15px 50px rgba(255,255,255,.08),
        0 0 70px rgba(0,150,255,.20);
}

.earth:active {
    cursor: grabbing;
}

/*
    Условительные материки.
    Позже сюда подключим настоящие геоданные.
*/

.land {
    position: absolute;
    inset: 8%;

    background:
        linear-gradient(
            125deg,
            transparent 0% 10%,
            #657653 11% 23%,
            transparent 24% 32%,
            #8b875e 33% 43%,
            transparent 44% 51%,
            #56734e 52% 64%,
            transparent 65% 72%,
            #71815b 73% 82%,
            transparent 83%
        );

    clip-path: polygon(
        4% 30%,
        15% 18%,
        27% 21%,
        35% 10%,
        49% 16%,
        58% 29%,
        72% 25%,
        86% 35%,
        96% 49%,
        82% 57%,
        88% 70%,
        70% 74%,
        58% 91%,
        43% 77%,
        29% 84%,
        20% 67%,
        7% 57%
    );

    opacity: .95;
}

/* GRID */

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.18) 1px,
            transparent 1px
        );

    background-size: 16px 16px;

    opacity: .42;

    pointer-events: none;
}

/* ATMOSPHERE */

.atmosphere {
    position: absolute;
    inset: -1px;

    border-radius: 50%;

    pointer-events: none;

    box-shadow:
        inset 0 0 35px rgba(80,190,255,.25),
        inset -35px -15px 65px rgba(0,0,0,.55);

    z-index: 20;
}

/* CELLS */

.cell {
    position: absolute;

    width: 34px;
    height: 34px;

    border: 1px solid rgba(255,255,255,.25);

    background: rgba(255,255,255,.025);

    border-radius: 3px;

    cursor: pointer;

    z-index: 10;

    transition:
        background .12s,
        border-color .12s,
        transform .12s;
}

.cell:hover {
    background: rgba(0,168,255,.35);
    border-color: #24d8ff;
    transform: scale(1.08);
}

.cell.selected {
    background: rgba(0,168,255,.65);
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(36,216,255,.8);
}

/* INFO */

.info {
    margin-top: 15px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}

.info-box {
    background: #0e141e;

    border: 1px solid #182433;

    border-radius: 12px;

    padding: 13px;
}

.label {
    color: #758397;
    font-size: 12px;
}

.value {
    margin-top: 5px;

    font-size: 18px;

    font-weight: bold;

    color: #24d8ff;
}

.selection {
    margin-top: 12px;

    padding: 14px;

    background: #080d14;

    border: 1px solid #1a2c3c;

    border-radius: 12px;

    text-align: center;

    font-size: 14px;
}

.selection span {
    color: #24d8ff;
    font-weight: bold;
}

/* MOBILE */

@media (max-width: 700px) {

    .game {
        padding: 10px;
    }

    .earth-area {
        min-height: 340px;
    }

    .info {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .cell {
        width: 27px;
        height: 27px;
    }

}

@media (max-width: 400px) {

    .earth-area {
        min-height: 300px;
    }

    .info {
        grid-template-columns: 1fr 1fr;
    }

}
</style>
</head>

<body>

<div class="game">

<header>
    <h1>🌍 WORLD 10×10</h1>

    <div class="subtitle">
        Глобальная игровая карта Земли
    </div>
</header>


<div class="panel">

    <div class="earth-area">

        <div class="earth" id="earth">

            <div class="land"></div>

            <div class="grid"></div>

            <!--
                Временные клетки.
                Позже система будет создавать реальные
                клетки по координатам Земли.
            -->

            <div id="cells"></div>

            <div class="atmosphere"></div>

        </div>

    </div>


    <div class="info">

        <div class="info-box">
            <div class="label">
                РАЗМЕР КЛЕТКИ
            </div>

            <div class="value">
                10 × 10 м
            </div>
        </div>


        <div class="info-box">
            <div class="label">
                ПЛОЩАДЬ
            </div>

            <div class="value">
                100 м²
            </div>
        </div>


        <div class="info-box">
            <div class="label">
                СУША
            </div>

            <div class="value">
                ≈ 1,49 трлн
            </div>
        </div>


        <div class="info-box">
            <div class="label">
                ВЫБРАНО
            </div>

            <div class="value" id="selectedNumber">
                0
            </div>
        </div>

    </div>


    <div class="selection" id="selection">
        Нажми на квадрат Земли, чтобы выбрать территорию.
    </div>

</div>

</div>


<script>

/*
====================================================
WORLD 10×10
====================================================

Каждая игровая клетка:

10 × 10 метров
100 квадратных метров

В дальнейшем каждая клетка получит:

ID
X
Y
широту
долготу
владельца
статус
цвет
====================================================
*/


const earth = document.getElementById("earth");
const cellsContainer = document.getElementById("cells");

const selection = document.getElementById("selection");
const selectedNumber =
    document.getElementById("selectedNumber");


let selectedCell = null;


/*
====================================================
СОЗДАЁМ ТЕСТОВУЮ СЕТКУ
====================================================

Это НЕ вся Земля.

Это только визуальная демонстрация.

В настоящей версии клетки не будут
создаваться все одновременно.
====================================================
*/


const GRID_SIZE = 7;

let cellNumber = 0;


for (let y = 0; y < GRID_SIZE; y++) {

    for (let x = 0; x < GRID_SIZE; x++) {

        cellNumber++;

        const cell =
            document.createElement("button");

        cell.className = "cell";

        cell.type = "button";


        /*
            Расположение клетки
        */

        const left =
            25 + x * 7.5;

        const top =
            25 + y * 7.5;


        cell.style.left = left + "%";
        cell.style.top = top + "%";


        /*
            Уникальный ID клетки
        */

        const cellId =
            "CELL-" +
            String(cellNumber)
                .padStart(6, "0");


        cell.dataset.id = cellId;

        cell.dataset.x = x;
        cell.dataset.y = y;


        cell.setAttribute(
            "aria-label",
            "Клетка " + cellId
        );


        /*
            Клик по клетке
        */

        cell.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                /*
                    Снимаем предыдущий выбор
                */

                document
                    .querySelectorAll(".cell.selected")
                    .forEach(function (item) {

                        item.classList.remove(
                            "selected"
                        );

                    });


                /*
                    Выбираем новую
                */

                cell.classList.add("selected");

                selectedCell = cell;


                /*
                    Показываем информацию
                */

                selection.innerHTML =
                    "Выбрана территория: " +

                    "<span>" +
                    cellId +
                    "</span>" +

                    " • X: " +
                    x +

                    " • Y: " +
                    y +

                    " • 10×10 м";


                selectedNumber.textContent =
                    cellNumber;

            }
        );


        cellsContainer.appendChild(cell);

    }

}


/*
====================================================
ВРАЩЕНИЕ ЗЕМЛИ
====================================================
*/


let dragging = false;

let lastX = 0;
let rotation = 0;


earth.addEventListener(
    "pointerdown",
    function (event) {

        /*
            Если нажали на клетку,
            не начинаем вращение.
        */

        if (
            event.target.classList.contains(
                "cell"
            )
        ) {
            return;
        }


        dragging = true;

        lastX = event.clientX;

        earth.setPointerCapture(
            event.pointerId
        );

    }
);


earth.addEventListener(
    "pointermove",
    function (event) {

        if (!dragging) return;


        const difference =
            event.clientX - lastX;


        rotation += difference * 0.35;


        lastX = event.clientX;


        earth.style.transform =
            "rotateY(" +
            rotation +
            "deg)";

    }
);


earth.addEventListener(
    "pointerup",
    function () {

        dragging = false;

    }
);


earth.addEventListener(
    "pointercancel",
    function () {

        dragging = false;

    }
);


</script>

</body>
</html>
