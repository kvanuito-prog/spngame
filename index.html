<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Battle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #20283a 0%, #0b0f17 45%, #05070b 100%);
    color: #f3f7fb;
    font-family: Arial, Helvetica, sans-serif;
}

.game {
    width: min(1100px, 94%);
    margin: 0 auto;
    padding: 25px 0 40px;
}

.title {
    text-align: center;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.battle {
    display: grid;
    grid-template-columns: 1fr 300px 1fr;
    gap: 20px;
    align-items: center;
}

.player {
    background: rgba(14, 20, 30, 0.95);
    border: 1px solid #293448;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

.player-name {
    font-size: 24px;
    font-weight: 900;
}

.player-class {
    color: #9daabd;
    margin-top: 5px;
    font-size: 16px;
}

.hp-text {
    margin-top: 20px;
    font-size: 28px;
    font-weight: 900;
}

.hp-bar {
    height: 14px;
    background: #252d3a;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}

.hp-fill {
    height: 100%;
    width: 100%;
    background: #29d17d;
    transition: width .35s ease;
}

.status {
    min-height: 28px;
    margin-top: 15px;
    font-weight: 800;
    color: #ffca4b;
}

.arena {
    text-align: center;
}

.turn {
    font-size: 15px;
    color: #aeb9c9;
    min-height: 22px;
    margin-bottom: 12px;
}

.dice {
    display: flex;
    justify-content: center;
    gap: 14px;
}

.die {
    width: 95px;
    height: 95px;
    background: #f5f5f5;
    color: #111;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
    font-weight: 900;
    box-shadow:
        inset 0 -7px 0 #c8c8c8,
        0 12px 25px rgba(0,0,0,.35);
    transition: transform .15s ease;
}

.die.rolling {
    transform: rotate(8deg) scale(1.08);
}

.result {
    margin-top: 15px;
    font-size: 48px;
    font-weight: 1000;
    min-height: 58px;
}

.roll-button,
.coin-button,
.restart-button {
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    color: white;
    transition: transform .15s ease, opacity .15s ease;
}

.roll-button {
    width: 100%;
    background: #168cff;
    margin-top: 10px;
}

.roll-button:hover,
.coin-button:hover,
.restart-button:hover {
    transform: translateY(-2px);
}

.roll-button:disabled,
.coin-button:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
}

.coin-area {
    text-align: center;
    margin: 25px auto;
    padding: 20px;
    background: rgba(14,20,30,.9);
    border: 1px solid #293448;
    border-radius: 18px;
}

.coin-title {
    font-weight: 900;
    font-size: 18px;
    margin-bottom: 12px;
}

.coin {
    font-size: 60px;
    min-height: 75px;
}

.coin-result {
    min-height: 25px;
    color: #aeb9c9;
    margin-bottom: 12px;
}

.coin-button {
    background: #8a5cff;
}

.log-container {
    margin-top: 25px;
    background: rgba(11,16,24,.95);
    border: 1px solid #293448;
    border-radius: 18px;
    padding: 18px;
}

.log-title {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 12px;
}

.log {
    max-height: 300px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.log-entry {
    background: #151d29;
    border-left: 3px solid #168cff;
    border-radius: 8px;
    padding: 10px 12px;
    color: #dce4ef;
    font-size: 14px;
}

.log-entry.special {
    border-left-color: #ffca4b;
}

.log-entry.win {
    border-left-color: #29d17d;
}

.restart {
    text-align: center;
    margin-top: 20px;
}

.restart-button {
    background: #303b4d;
}

@media (max-width: 800px) {
    .battle {
        grid-template-columns: 1fr;
    }

    .arena {
        order: 2;
    }

    .player:first-child {
        order: 1;
    }

    .player:last-child {
        order: 3;
    }

    .die {
        width: 80px;
        height: 80px;
        font-size: 45px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="title">⚔️ DICE BATTLE</div>

    <div class="coin-area">
        <div class="coin-title">🪙 ОПРЕДЕЛЕНИЕ ПЕРВОГО ХОДА</div>
        <div class="coin" id="coin">🪙</div>
        <div class="coin-result" id="coinResult">
            Нажмите кнопку, чтобы определить право первого броска
        </div>
        <button class="coin-button" id="coinButton">
            ОРЕЛ / РЕШКА
        </button>
    </div>

    <div class="battle">

        <div class="player">
            <div class="player-name">ИГРОК 1</div>
            <div class="player-class">🪓 Варвар</div>

            <div class="hp-text" id="hp1Text">1000 / 1000 HP</div>

            <div class="hp-bar">
                <div class="hp-fill" id="hp1Fill"></div>
            </div>

            <div class="status" id="status1"></div>
        </div>

        <div class="arena">

            <div class="turn" id="turnText">
                Сначала определите первый ход
            </div>

            <div class="dice">
                <div class="die" id="die1">⚄</div>
                <div class="die" id="die2">⚄</div>
            </div>

            <div class="result" id="result">—</div>

            <button class="roll-button" id="rollButton" disabled>
                🎲 БРОСИТЬ КУБИКИ
            </button>

        </div>

        <div class="player">
            <div class="player-name">ИГРОК 2</div>
            <div class="player-class">🪓 Варвар</div>

            <div class="hp-text" id="hp2Text">1000 / 1000 HP</div>

            <div class="hp-bar">
                <div class="hp-fill" id="hp2Fill"></div>
            </div>

            <div class="status" id="status2"></div>
        </div>

    </div>

    <div class="log-container">
        <div class="log-title">📜 ИГРОВОЙ ЛОГ</div>

        <div class="log" id="gameLog">
            <div class="log-entry">
                Бой готов. Определите право первого броска.
            </div>
        </div>
    </div>

    <div class="restart">
        <button class="restart-button" id="restartButton">
            🔄 НАЧАТЬ ЗАНОВО
        </button>
    </div>

</div>

<script>
const maxHp = 1000;

let hp1 = maxHp;
let hp2 = maxHp;

let currentPlayer = null;

let stunned1 = false;
let stunned2 = false;

let gameStarted = false;
let gameOver = false;

const diceSymbols = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];

const coin = document.getElementById("coin");
const coinResult = document.getElementById("coinResult");
const coinButton = document.getElementById("coinButton");

const die1 = document.getElementById("die1");
const die2 = document.getElementById("die2");

const result = document.getElementById("result");
const rollButton = document.getElementById("rollButton");

const turnText = document.getElementById("turnText");

const hp1Text = document.getElementById("hp1Text");
const hp2Text = document.getElementById("hp2Text");

const hp1Fill = document.getElementById("hp1Fill");
const hp2Fill = document.getElementById("hp2Fill");

const status1 = document.getElementById("status1");
const status2 = document.getElementById("status2");

const gameLog = document.getElementById("gameLog");

const restartButton = document.getElementById("restartButton");


function addLog(message, type = "") {
    const entry = document.createElement("div");

    entry.className = "log-entry " + type;
    entry.textContent = message;

    gameLog.prepend(entry);
}


function updateUI() {

    hp1Text.textContent = `${hp1} / ${maxHp} HP`;
    hp2Text.textContent = `${hp2} / ${maxHp} HP`;

    hp1Fill.style.width = `${Math.max(0, hp1) / 10}%`;
    hp2Fill.style.width = `${Math.max(0, hp2) / 10}%`;

    status1.textContent = stunned1 ? "😵 ОГЛУШЕН — ХОД ПРОПУЩЕН" : "";
    status2.textContent = stunned2 ? "😵 ОГЛУШЕН — ХОД ПРОПУЩЕН" : "";

    if (!gameStarted) {
        turnText.textContent = "Сначала определите первый ход";
    } else if (gameOver) {
        turnText.textContent = "🏆 БОЙ ОКОНЧЕН";
    } else {
        turnText.textContent = `Ход игрока ${currentPlayer}`;
    }
}


function randomDice() {
    return Math.floor(Math.random() * 6) + 1;
}


function determineFirstPlayer() {

    coinButton.disabled = true;

    const resultCoin = Math.random() < 0.5 ? "ОРЕЛ" : "РЕШКА";

    coin.textContent = "🪙";

    setTimeout(() => {

        coin.textContent = resultCoin === "ОРЕЛ" ? "🦅" : "🪙";

        if (resultCoin === "ОРЕЛ") {
            currentPlayer = 1;
        } else {
            currentPlayer = 2;
        }

        coinResult.textContent =
            `${resultCoin}! Первый бросок получает игрок ${currentPlayer}.`;

        addLog(
            `Выпало ${resultCoin}. Игрок ${currentPlayer} получает право первого броска.`,
            "special"
        );

        gameStarted = true;

        rollButton.disabled = false;

        updateUI();

    }, 600);
}


function rollDice() {

    if (!gameStarted || gameOver) {
        return;
    }

    /*
     * Если текущий игрок был оглушён,
     * он пропускает ход.
     */

    if (currentPlayer === 1 && stunned1) {

        stunned1 = false;

        addLog(
            "Игрок 1 был оглушён и пропускает свой ход.",
            "special"
        );

        currentPlayer = 2;

        updateUI();

        return;
    }

    if (currentPlayer === 2 && stunned2) {

        stunned2 = false;

        addLog(
            "Игрок 2 был оглушён и пропускает свой ход.",
            "special"
        );

        currentPlayer = 1;

        updateUI();

        return;
    }

    rollButton.disabled = true;

    die1.classList.add("rolling");
    die2.classList.add("rolling");

    setTimeout(() => {

        die1.classList.remove("rolling");
        die2.classList.remove("rolling");

        const dice1 = randomDice();
        const dice2 = randomDice();

        const total = dice1 * 10 + dice2;

        die1.textContent = diceSymbols[dice1 - 1];
        die2.textContent = diceSymbols[dice2 - 1];

        result.textContent = total;

        const attacker = currentPlayer;
        const defender = attacker === 1 ? 2 : 1;

        if (defender === 1) {
            hp1 = Math.max(0, hp1 - total);
        } else {
            hp2 = Math.max(0, hp2 - total);
        }

        addLog(
            `Игрок ${attacker} выбросил ${total} и нанёс ${total} урона игроку ${defender}.`
        );

        /*
         * Варвар получает особый эффект
         * при любом дубле:
         * 11, 22, 33, 44, 55, 66.
         */

        if (dice1 === dice2) {

            if (defender === 1) {
                stunned1 = true;
            } else {
                stunned2 = true;
            }

            addLog(
                `🔥 ДУБЛЬ ${total}! Варвар оглушил игрока ${defender}. Следующий ход игрок ${defender} будет пропущен.`,
                "special"
            );
        }

        updateUI();

        /*
         * Проверяем победителя.
         */

        if (hp1 <= 0 || hp2 <= 0) {

            gameOver = true;

            rollButton.disabled = true;

            const winner = hp1 <= 0 ? 2 : 1;

            addLog(
                `🏆 ИГРОК ${winner} ПОБЕДИЛ!`,
                "win"
            );

            updateUI();

            return;
        }

        /*
         * Передача хода.
         */

        currentPlayer = defender;

        /*
         * Если следующий игрок оглушён,
         * его ход автоматически пропускается.
         */

        if (
            (currentPlayer === 1 && stunned1) ||
            (currentPlayer === 2 && stunned2)
        ) {

            const skippedPlayer = currentPlayer;

            addLog(
                `😵 Игрок ${skippedPlayer} оглушён и пропускает следующий ход.`,
                "special"
            );

            if (currentPlayer === 1) {
                stunned1 = false;
                currentPlayer = 2;
            } else {
                stunned2 = false;
                currentPlayer = 1;
            }
        }

        rollButton.disabled = false;

        updateUI();

    }, 350);
}


function restartGame() {

    hp1 = maxHp;
    hp2 = maxHp;

    currentPlayer = null;

    stunned1 = false;
    stunned2 = false;

    gameStarted = false;
    gameOver = false;

    die1.textContent = "⚄";
    die2.textContent = "⚄";

    result.textContent = "—";

    coin.textContent = "🪙";

    coinResult.textContent =
        "Нажмите кнопку, чтобы определить право первого броска";

    coinButton.disabled = false;

    rollButton.disabled = true;

    gameLog.innerHTML = "";

    addLog("Бой готов. Определите право первого броска.");

    updateUI();
}


coinButton.addEventListener("click", determineFirstPlayer);

rollButton.addEventListener("click", rollDice);

restartButton.addEventListener("click", restartGame);

updateUI();
</script>

</body>
</html>
