<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Кубики — Битва</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-gradient"></div>
<div class="version-badge" id="versionBadge">v—</div>

<!-- ЭКРАН ВЫБОРА КЛАССОВ -->
<div class="overlay show" id="selectOverlay">
  <div class="overlay-card">
    <div class="select-title">Выбор классов</div>
    <div class="select-subtitle">Тапни по классу для каждого игрока</div>
    <div class="select-row">
      <div class="select-pname p1">Игрок 1</div>
      <div class="select-list" data-player="1"></div>
    </div>
    <div class="select-row">
      <div class="select-pname p2">Игрок 2</div>
      <div class="select-list" data-player="2"></div>
    </div>
    <button class="btn" id="startGameBtn">НАЧАТЬ БОЙ</button>
    <button class="btn-test" id="testBtn">📊 Тест баланса · 1 500 000 боёв</button>
  </div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="app">
  <div class="players">
    <div class="player" id="p1">
      <div class="weak-badge" id="weak1">💜 −20%</div>
      <div class="buff-badge" id="buff1">🎲 x3</div>
      <div class="rage-badge" id="rage1">🩸 +0</div>
      <div class="stun-badge">⚡ СТАН</div>
      <div class="pname">Игрок 1</div>
      <div class="pclass" id="pclass1">—</div>
      <div class="hp-bar"><div class="hp-fill" id="hpFill1"></div></div>
      <div class="hp-val" id="hpVal1">1000</div>
      <div class="summon-line" id="summon1">
        <span class="summon-icon" id="summonIcon1">🐗</span>
        <span class="summon-name" id="summonName1">Кабан</span>
        <span class="summon-hp" id="summonHp1">33/33</span>
      </div>
    </div>
    <div class="player" id="p2">
      <div class="weak-badge" id="weak2">💜 −20%</div>
      <div class="buff-badge" id="buff2">🎲 x3</div>
      <div class="rage-badge" id="rage2">🩸 +0</div>
      <div class="stun-badge">⚡ СТАН</div>
      <div class="pname">Игрок 2</div>
      <div class="pclass" id="pclass2">—</div>
      <div class="hp-bar"><div class="hp-fill" id="hpFill2"></div></div>
      <div class="hp-val" id="hpVal2">1000</div>
      <div class="summon-line" id="summon2">
        <span class="summon-icon" id="summonIcon2">🐗</span>
        <span class="summon-name" id="summonName2">Кабан</span>
        <span class="summon-hp" id="summonHp2">33/33</span>
      </div>
    </div>
  </div>

  <div class="dice-row">
    <div class="die" id="die1"></div>
    <div class="die" id="die2"></div>
  </div>

  <div class="result" id="result">— —</div>

  <div class="log-wrap">
    <div class="log-title">История</div>
    <div class="log-list" id="logList"></div>
  </div>

  <div class="speed-box">
    <div class="speed-header">
      <span class="speed-label">Скорость</span>
      <span class="speed-value" id="speedValue">4</span>
    </div>
    <input type="range" min="1" max="20" value="4" step="1" class="speed-slider" id="speedSlider">
  </div>

  <div class="controls">
    <button class="control-btn start" id="battleBtn">▶ НАЧАТЬ БОЙ</button>
  </div>

  <div class="hint" id="hint">Выбери классы и начни бой</div>
</div>

<!-- ОКНО ПОБЕДЫ -->
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-title" id="overlayTitle">Победа!</div>
    <div class="overlay-sub" id="overlaySub"></div>
    <button class="btn" id="restartBtn">Играть снова</button>
    <button class="btn btn-secondary" id="changeClassesBtn">Сменить классы</button>
  </div>
</div>

<!-- ОКНО ТЕСТА -->
<div class="overlay" id="testOverlay">
  <div class="test-result-card">
    <div class="test-title">📊 Результаты баланса</div>
    <div class="test-sub" id="testSub">100 000 боёв на каждую пару</div>
    <div id="testResultBody"></div>
    <button class="btn btn-secondary" id="testCloseBtn" style="margin-top:16px;">Закрыть</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
