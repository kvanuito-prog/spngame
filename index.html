<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер цен UC (PUBG Mobile)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .table-wrapper {
            overflow-x: auto;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            white-space: nowrap;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        th:first-child, td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background-color: #1e293b;
            z-index: 1;
        }
        th:first-child {
            z-index: 2;
            background-color: #0f172a;
        }
        tr:hover td {
            background-color: #334155;
        }
        .best-price {
            color: #4ade80;
            font-weight: bold;
            background-color: rgba(74, 222, 128, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Мониторинг цен UC</h1>
    <p class="subtitle">Сравнение стоимости игровой валюты в Telegram-магазинах</p>

    <div class="table-wrapper">
        <table id="priceTable">
            <thead>
                <tr id="headerRow">
                    <th>Магазин</th>
                </tr>
            </thead>
            <tbody id="bodyRows">
                <!-- Данные подгружаются через JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    fetch('data.json')
        .then(response => response.json())
        .then(storesData => {
            if (storesData.length === 0) return;

            // Собираем все уникальные номиналы UC со всех магазинов
            let allKeysSet = new Set();
            storesData.forEach(store => {
                Object.keys(store.prices).forEach(key => allKeysSet.add(key));
            });
            
            // Сортируем номиналы (попробуем отталкиваться от числового значения)
            let ucKeys = Array.from(allKeysSet).sort((a, b) => {
                return parseInt(a) - parseInt(b);
            });

            // Заполняем шапку таблицы номиналами
            const headerRow = document.getElementById('headerRow');
            ucKeys.forEach(key => {
                const th = document.createElement('th');
                th.textContent = key;
                headerRow.appendChild(th);
            });

            // Находим минимальные цены для каждого номинала (для подсветки выгоды)
            let minPrices = {};
            ucKeys.forEach(key => {
                let min = Infinity;
                storesData.forEach(store => {
                    if (store.prices[key] && store.prices[key] < min) {
                        min = store.prices[key];
                    }
                });
                minPrices[key] = min;
            });

            // Заполняем тело таблицы данными магазинов
            const bodyRows = document.getElementById('bodyRows');
            storesData.forEach(store => {
                const tr = document.createElement('tr');
                
                // Название магазина
                const tdStore = document.createElement('td');
                tdStore.textContent = store.store;
                tr.appendChild(tdStore);

                // Цены для каждого номинала
                ucKeys.forEach(key => {
                    const tdPrice = document.createElement('td');
                    const price = store.prices[key];
                    
                    if (price !== undefined) {
                        tdPrice.textContent = price + ' ₽';
                        // Подсвечиваем зеленым самую низкую цену
                        if (price === minPrices[key]) {
                            tdPrice.classList.add('best-price');
                        }
                    } else {
                        tdPrice.textContent = '—';
                        tdPrice.style.color = '#64748b';
                    }
                    tr.appendChild(tdPrice);
                });

                bodyRows.appendChild(tr);
            });
        })
        .catch(error => console.error('Ошибка загрузки данных:', error));
</script>

</body>
</html>
