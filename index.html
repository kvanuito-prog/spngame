<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPN BATTLE — TOURNAMENT</title>

<style>
:root{
  --bg:#05070b;
  --panel:#0b1018;
  --panel2:#0e141e;
  --border:#1c2a3b;
  --blue:#00a8ff;
  --cyan:#24d8ff;
  --green:#27e38b;
  --red:#ff3d58;
  --yellow:#ffd447;
  --purple:#b86cff;
  --blood:#d93652;
  --text:#f3f7fb;
  --muted:#718096;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#101b2a 0,#05070b 45%,#030408 100%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:min(1500px,100%);
  margin:auto;
  padding:18px;
}

header{
  text-align:center;
  margin-bottom:18px;
}

.logo{
  font-size:clamp(30px,6vw,64px);
  font-weight:1000;
  letter-spacing:4px;
  color:#fff;
  text-shadow:0 0 25px rgba(0,168,255,.3);
}

.subtitle{
  color:var(--cyan);
  font-weight:800;
  letter-spacing:3px;
  font-size:12px;
  margin-top:5px;
}

.panel{
  background:linear-gradient(145deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.setup{
  max-width:1100px;
  margin:auto;
}

.setup-title{
  font-size:20px;
  font-weight:1000;
  margin-bottom:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field label{
  font-size:11px;
  color:var(--muted);
  font-weight:900;
  text-transform:uppercase;
}

input,
select{
  width:100%;
  min-height:46px;
  padding:10px 13px;
  border-radius:10px;
  border:1px solid #26384e;
  background:#070b11;
  color:#fff;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 2px rgba(0,168,255,.12);
}

.count-row{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:12px;
  align-items:end;
}

.primary{
  min-height:46px;
  border:0;
  border-radius:10px;
  padding:10px 20px;
  color:#001018;
  font-weight:1000;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
}

.secondary{
  min-height:44px;
  border:1px solid #284158;
  border-radius:10px;
  padding:9px 18px;
  color:#fff;
  background:#101923;
  font-weight:900;
}

.danger{
  border-color:#57202b;
  background:#1c0d12;
  color:#ff7184;
}

.players-editor{
  margin-top:18px;
  max-height:500px;
  overflow:auto;
  padding-right:4px;
}

.player-row{
  display:grid;
  grid-template-columns:60px minmax(150px,1fr) 180px;
  gap:10px;
  align-items:center;
  padding:9px;
  margin-bottom:7px;
  background:#080d14;
  border:1px solid #162435;
  border-radius:10px;
}

.player-number{
  font-weight:1000;
  color:var(--cyan);
  text-align:center;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.message{
  margin-top:12px;
  color:#ffb9c2;
  font-size:13px;
  min-height:18px;
}

.tournament{
  margin-top:18px;
}

.topbar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:12px;
  align-items:center;
  margin-bottom:15px;
}

.stat{
  background:#080d14;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 14px;
}

.stat-label{
  font-size:10px;
  color:var(--muted);
  font-weight:900;
}

.stat-value{
  font-size:20px;
  font-weight:1000;
  margin-top:3px;
}

.stage{
  text-align:center;
  font-size:20px;
  font-weight:1000;
}

.battle{
  display:grid;
  grid-template-columns:1fr minmax(260px,380px) 1fr;
  gap:14px;
  align-items:stretch;
}

.fighter{
  position:relative;
  border:1px solid var(--border);
  border-radius:16px;
  background:#080d14;
  padding:18px;
  overflow:hidden;
}

.fighter.active{
  border-color:var(--cyan);
  box-shadow:0 0 30px rgba(0,168,255,.12);
}

.fighter.dead{
  opacity:.55;
}

.fighter-name{
  font-size:clamp(18px,3vw,30px);
  font-weight:1000;
  word-break:break-word;
}

.class-name{
  display:inline-block;
  margin-top:5px;
  padding:4px 8px;
  border-radius:6px;
  background:#18222f;
  color:#b9c8d8;
  font-size:10px;
  font-weight:1000;
}

.class-name.assassin{
  color:#d19aff;
  background:#261538;
}

.class-name.vampire{
  color:#ff7b91;
  background:#35121a;
}

.class-name.joker{
  color:#ffe26a;
  background:#352d0b;
}

.hp-text{
  margin-top:22px;
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.hp{
  font-size:34px;
  font-weight:1000;
}

.hp-label{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
}

.hp-bar{
  height:12px;
  background:#171d25;
  border-radius:20px;
  overflow:hidden;
  margin-top:7px;
}

.hp-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,var(--green),#a8ffca);
  transition:width .25s ease;
}

.turn{
  margin-top:15px;
  min-height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:#0d141e;
  color:var(--muted);
  font-size:11px;
  font-weight:1000;
}

.fighter.active .turn{
  background:rgba(0,168,255,.12);
  color:var(--cyan);
}

.special-status{
  margin-top:8px;
  min-height:24px;
  text-align:center;
  font-size:12px;
  font-weight:1000;
  color:var(--yellow);
}

.arena{
  border:1px solid var(--border);
  border-radius:16px;
  background:#060a10;
  padding:15px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.round{
  font-size:11px;
  color:var(--muted);
  font-weight:1000;
  letter-spacing:2px;
}

.score{
  font-size:26px;
  font-weight:1000;
  margin:5px 0 12px;
}

.dice{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:8px 0;
}

.die{
  width:72px;
  height:72px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#07101a;
  font-size:40px;
  font-weight:1000;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.die.rolling{
  animation:diceShake .08s linear infinite alternate;
}

@keyframes diceShake{
  from{transform:rotate(-5deg) translateY(-2px)}
  to{transform:rotate(5deg) translateY(2px)}
}

.result{
  font-size:52px;
  line-height:1;
  font-weight:1000;
  color:var(--cyan);
  margin:8px 0;
}

.special{
  min-height:40px;
  font-size:17px;
  font-weight:1000;
  color:var(--yellow);
}

.damage{
  min-height:28px;
  font-size:15px;
  font-weight:1000;
}

.log{
  margin-top:12px;
  height:150px;
  overflow:auto;
  text-align:left;
  padding:10px;
  background:#03060a;
  border:1px solid #131f2d;
  border-radius:9px;
  font-size:11px;
  line-height:1.55;
}

.log-line{
  padding:3px 0;
  border-bottom:1px solid rgba(255,255,255,.035);
}

.joker-charge{
  color:#ffe26a;
  font-weight:1000;
}

.bracket{
  margin-top:18px;
}

.bracket-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.bracket-title{
  font-size:20px;
  font-weight:1000;
}

.bracket-scroll{
  overflow:auto;
  padding-bottom:8px;
}

.bracket-grid{
  display:flex;
  gap:12px;
  min-width:max-content;
}

.bracket-column{
  width:220px;
}

.column-title{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  font-weight:1000;
  margin-bottom:7px;
}

.match{
  border:1px solid #1a2939;
  border-radius:10px;
  background:#080d14;
  padding:8px;
  margin-bottom:8px;
  font-size:11px;
}

.match.current{
  border-color:var(--cyan);
}

.match.finished{
  opacity:.7;
}

.match-player{
  display:flex;
  justify-content:space-between;
  gap:6px;
  padding:4px 5px;
  border-radius:5px;
}

.match-player.winner{
  background:rgba(39,227,139,.09);
  color:var(--green);
}

.match-player.loser{
  color:#687789;
}

.match-player.empty{
  color:#3e4c5d;
}

.match-status{
  margin-top:5px;
  color:#536477;
  font-size:9px;
  text-align:center;
}

.winner-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(7px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.winner-box{
  width:min(600px,100%);
  background:#0a1018;
  border:1px solid var(--cyan);
  border-radius:20px;
  padding:35px;
  text-align:center;
  box-shadow:0 0 80px rgba(0,168,255,.2);
}

.winner-small{
  color:var(--cyan);
  font-weight:1000;
  letter-spacing:3px;
}

.winner-name{
  font-size:clamp(32px,8vw,64px);
  font-weight:1000;
  margin:12px 0;
}

.winner-class{
  color:var(--yellow);
  font-weight:1000;
}

@media(max-width:850px){
  .battle{
    grid-template-columns:1fr;
  }

  .arena{
    order:-1;
  }

  .topbar{
    grid-template-columns:1fr 1fr;
  }

  .stage{
    grid-column:1/-1;
    grid-row:1;
  }

  .count-row{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .app{padding:10px}

  .player-row{
    grid-template-columns:40px 1fr;
  }

  .player-row select{
    grid-column:2;
  }

  .die{
    width:60px;
    height:60px;
    font-size:32px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">SPN BATTLE</div>
  <div class="subtitle">AUTOMATIC DOUBLE ELIMINATION</div>
</header>

<section id="setupPanel" class="panel setup">
  <div class="setup-title">НАСТРОЙКА ТУРНИРА</div>

  <div class="count-row">
    <div class="field">
      <label>Количество игроков</label>
      <input id="playerCount" type="number" min="2" max="100" value="8">
    </div>

    <button id="createPlayersButton" class="primary">
      СОЗДАТЬ ИГРОКОВ
    </button>
  </div>

  <div id="playersEditor" class="players-editor hidden"></div>

  <div id="setupActions" class="actions hidden">
    <button id="startTournamentButton" class="primary">
      НАЧАТЬ ТУРНИР
    </button>

    <button id="clearPlayersButton" class="secondary">
      ОЧИСТИТЬ
    </button>
  </div>

  <div id="setupMessage" class="message"></div>
</section>

<section id="tournamentPanel" class="tournament hidden">

  <div class="topbar">
    <div class="stat">
      <div class="stat-label">МАТЧЕЙ ЗАВЕРШЕНО</div>
      <div id="completedMatches" class="stat-value">0</div>
    </div>

    <div id="stageTitle" class="stage">ЖЕРЕБЬЁВКА</div>

    <div class="stat">
      <div class="stat-label">ОСТАЛОСЬ ИГРОКОВ</div>
      <div id="alivePlayers" class="stat-value">0</div>
    </div>
  </div>

  <div class="panel battle">

    <div id="fighter1" class="fighter">
      <div id="fighter1Name" class="fighter-name">—</div>
      <div id="fighter1Class" class="class-name">—</div>

      <div class="hp-text">
        <div id="hp1" class="hp">1000</div>
        <div class="hp-label">HP</div>
      </div>

      <div class="hp-bar">
        <div id="hp1Bar" class="hp-fill"></div>
      </div>

      <div id="turn1" class="turn">ОЖИДАНИЕ</div>
      <div id="status1" class="special-status"></div>
    </div>

    <div class="arena">

      <div id="roundText" class="round">РАУНД 1 / 3</div>
      <div id="scoreText" class="score">0 : 0</div>

      <div class="dice">
        <div id="die1" class="die">?</div>
        <div id="die2" class="die">?</div>
      </div>

      <div id="resultText" class="result">—</div>
      <div id="specialText" class="special"></div>
      <div id="damageText" class="damage"></div>

      <div id="battleLog" class="log"></div>
    </div>

    <div id="fighter2" class="fighter">
      <div id="fighter2Name" class="fighter-name">—</div>
      <div id="fighter2Class" class="class-name">—</div>

      <div class="hp-text">
        <div id="hp2" class="hp">1000</div>
        <div class="hp-label">HP</div>
      </div>

      <div class="hp-bar">
        <div id="hp2Bar" class="hp-fill"></div>
      </div>

      <div id="turn2" class="turn">ОЖИДАНИЕ</div>
      <div id="status2" class="special-status"></div>
    </div>

  </div>

  <section class="panel bracket">
    <div class="bracket-head">
      <div class="bracket-title">СЕТКА DOUBLE ELIMINATION</div>
      <button id="newTournamentButton" class="secondary">
        НОВЫЙ ТУРНИР
      </button>
    </div>

    <div class="bracket-scroll">
      <div id="bracketGrid" class="bracket-grid"></div>
    </div>
  </section>

</section>

</div>

<div id="winnerOverlay" class="winner-overlay hidden">
  <div class="winner-box">
    <div class="winner-small">ПОБЕДИТЕЛЬ ТУРНИРА</div>
    <div id="winnerName" class="winner-name">—</div>
    <div id="winnerClass" class="winner-class">—</div>

    <div class="actions" style="justify-content:center">
      <button id="winnerRestartButton" class="primary">
        НОВЫЙ ТУРНИР
      </button>
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================
   НАСТРОЙКИ
========================= */

const MAX_HP = 1000;
const TURN_DELAY = 700;
const DICE_ANIMATION_TIME = 480;
const NEXT_ROUND_DELAY = 1100;

const CLASS_NAMES = {
  barbar: "ВАРВАР",
  assassin: "АССАСИН",
  vampire: "ВАМПИР",
  joker: "ДЖОКЕР"
};

const BEAUTIFUL_HP = new Set([
  11,22,33,44,55,66,77,88,99,
  111,222,333,444,555,666,777,888,999
]);

/* =========================
   DOM
========================= */

const setupPanel = document.getElementById("setupPanel");
const tournamentPanel = document.getElementById("tournamentPanel");

const playerCountInput = document.getElementById("playerCount");
const createPlayersButton = document.getElementById("createPlayersButton");
const playersEditor = document.getElementById("playersEditor");
const setupActions = document.getElementById("setupActions");
const startTournamentButton = document.getElementById("startTournamentButton");
const clearPlayersButton = document.getElementById("clearPlayersButton");
const setupMessage = document.getElementById("setupMessage");

const completedMatchesEl = document.getElementById("completedMatches");
const alivePlayersEl = document.getElementById("alivePlayers");
const stageTitle = document.getElementById("stageTitle");

const fighter1 = document.getElementById("fighter1");
const fighter2 = document.getElementById("fighter2");

const fighter1Name = document.getElementById("fighter1Name");
const fighter2Name = document.getElementById("fighter2Name");

const fighter1Class = document.getElementById("fighter1Class");
const fighter2Class = document.getElementById("fighter2Class");

const hp1El = document.getElementById("hp1");
const hp2El = document.getElementById("hp2");

const hp1Bar = document.getElementById("hp1Bar");
const hp2Bar = document.getElementById("hp2Bar");

const turn1 = document.getElementById("turn1");
const turn2 = document.getElementById("turn2");

const status1 = document.getElementById("status1");
const status2 = document.getElementById("status2");

const roundText = document.getElementById("roundText");
const scoreText = document.getElementById("scoreText");

const die1El = document.getElementById("die1");
const die2El = document.getElementById("die2");

const resultText = document.getElementById("resultText");
const specialText = document.getElementById("specialText");
const damageText = document.getElementById("damageText");

const battleLog = document.getElementById("battleLog");
const bracketGrid = document.getElementById("bracketGrid");

const winnerOverlay = document.getElementById("winnerOverlay");
const winnerName = document.getElementById("winnerName");
const winnerClass = document.getElementById("winnerClass");

const newTournamentButton = document.getElementById("newTournamentButton");
const winnerRestartButton = document.getElementById("winnerRestartButton");

/* =========================
   STATE
========================= */

let players = [];

let tournament = {
  active: false,
  finished: false,

  completedMatches: 0,

  winnersQueue: [],
  losersQueue: [],

  currentStage: "",
  currentMatch: null,

  winner: null,

  history: []
};

let battle = {
  p1: null,
  p2: null,

  hp1: MAX_HP,
  hp2: MAX_HP,

  score1: 0,
  score2: 0,

  round: 1,

  currentPlayer: 1,

  stunned1: false,
  stunned2: false,

  jokerCharge1: 0,
  jokerCharge2: 0,

  finished: false
};

let timers = [];

/* =========================
   HELPERS
========================= */

function schedule(fn, delay){
  const timer = setTimeout(() => {
    timers = timers.filter(t => t !== timer);
    fn();
  }, delay);

  timers.push(timer);
  return timer;
}

function clearAllTimers(){
  timers.forEach(clearTimeout);
  timers = [];
}

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function randomInt(min,max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(array){
  const copy = [...array];

  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }

  return copy;
}

function getClassName(player){
  return CLASS_NAMES[player.class] || "ВАРВАР";
}

function beautifulHp(value){
  return BEAUTIFUL_HP.has(value);
}

function getClassCss(playerClass){
  if(playerClass === "assassin") return "assassin";
  if(playerClass === "vampire") return "vampire";
  if(playerClass === "joker") return "joker";
  return "";
}

function addLog(text){
  const line = document.createElement("div");
  line.className = "log-line";
  line.textContent = text;

  battleLog.appendChild(line);
  battleLog.scrollTop = battleLog.scrollHeight;
}

/* =========================
   PLAYER CREATION
========================= */

function createPlayerEditor(){
  let count = Number(playerCountInput.value);

  if(!Number.isFinite(count)){
    count = 8;
  }

  count = clamp(Math.floor(count),2,100);
  playerCountInput.value = count;

  playersEditor.innerHTML = "";

  for(let i = 1; i <= count; i++){
    const row = document.createElement("div");
    row.className = "player-row";

    row.innerHTML = `
      <div class="player-number">#${i}</div>

      <input
        class="player-name-input"
        maxlength="24"
        placeholder="Ник игрока ${i}"
        value="ИГРОК ${i}"
      >

      <select class="player-class-input">
        <option value="barbar">ВАРВАР</option>
        <option value="assassin">АССАСИН</option>
        <option value="vampire">ВАМПИР</option>
        <option value="joker">ДЖОКЕР</option>
      </select>
    `;

    playersEditor.appendChild(row);
  }

  playersEditor.classList.remove("hidden");
  setupActions.classList.remove("hidden");
  setupMessage.textContent = "";
}

function collectPlayers(){
  const names = [...document.querySelectorAll(".player-name-input")];
  const classes = [...document.querySelectorAll(".player-class-input")];

  if(names.length < 2){
    setupMessage.textContent = "Нужно минимум 2 игрока.";
    return false;
  }

  const result = [];

  for(let i = 0; i < names.length; i++){
    const name = names[i].value.trim() || `ИГРОК ${i + 1}`;

    result.push({
      id: i + 1,
      name,
      class: classes[i].value,
      losses: 0,
      eliminated: false,
      wins: 0
    });
  }

  players = result;

  return true;
}

/* =========================
   TOURNAMENT
========================= */

/*
  Турнир работает как double elimination:
  - игрок начинает в Winners;
  - первое поражение отправляет его в Losers;
  - второе поражение = вылет;
  - победитель Winners встречается с победителем Losers;
  - если победитель Losers выигрывает финал,
    проводится reset-финал.
*/

function startTournament(){

  if(!collectPlayers()){
    return;
  }

  clearAllTimers();

  tournament = {
    active:true,
    finished:false,
    completedMatches:0,

    winnersQueue:shuffle(players),
    losersQueue:[],

    currentStage:"ЖЕРЕБЬЁВКА",
    currentMatch:null,

    winner:null,

    history:[]
  };

  players.forEach(player => {
    player.losses = 0;
    player.eliminated = false;
    player.wins = 0;
  });

  setupPanel.classList.add("hidden");
  tournamentPanel.classList.remove("hidden");

  alivePlayersEl.textContent = players.length;
  completedMatchesEl.textContent = "0";

  renderBracket();

  stageTitle.textContent = "ЖЕРЕБЬЁВКА";

  battleLog.innerHTML = "";
  addLog(`🎲 Участников: ${players.length}`);
  addLog("🎲 Игроки перемешиваются...");
  
  schedule(() => {
    addLog("🎯 Жеребьёвка завершена.");
    startNextTournamentMatch();
  },1200);
}

function getAlivePlayers(){
  return players.filter(player => !player.eliminated);
}

function prepareNextMatch(){

  /*
    Сначала Winners.
    В Winners могут быть игроки, которые ещё не проигрывали.
  */

  if(tournament.winnersQueue.length >= 2){

    const p1 = tournament.winnersQueue.shift();
    const p2 = tournament.winnersQueue.shift();

    return {
      type:"winners",
      p1,
      p2
    };
  }

  /*
    Один игрок в Winners ждёт.
  */

  if(tournament.winnersQueue.length === 1){

    /*
      Если есть Losers, проводим бой там,
      чтобы не оставлять турнир без движения.
    */
    if(tournament.losersQueue.length >= 2){

      const p1 = tournament.losersQueue.shift();
      const p2 = tournament.losersQueue.shift();

      return {
        type:"losers",
        p1,
        p2
      };
    }

    /*
      Один Winners остаётся до следующего раунда.
    */
  }

  /*
    Losers.
    Здесь любое поражение = вылет.
  */

  if(tournament.losersQueue.length >= 2){

    const p1 = tournament.losersQueue.shift();
    const p2 = tournament.losersQueue.shift();

    return {
      type:"losers",
      p1,
      p2
    };
  }

  /*
    Если остался один Winners и один Losers,
    можно провести матч между ними как
    переходный бой.
  */

  if(
    tournament.winnersQueue.length === 1 &&
    tournament.losersQueue.length === 1
  ){

    const p1 = tournament.winnersQueue.shift();
    const p2 = tournament.losersQueue.shift();

    return {
      type:"winners",
      p1,
      p2
    };
  }

  return null;
}

function startNextTournamentMatch(){

  if(tournament.finished){
    return;
  }

  const alive = getAlivePlayers();

  if(alive.length <= 1){
    finishTournament(alive[0]);
    return;
  }

  const match = prepareNextMatch();

  if(!match){

    /*
      Если стандартные очереди временно пусты,
      берём двух ещё не выбывших участников,
      сохраняя их количество поражений.
    */

    const available = alive.filter(player =>
      tournament.winnersQueue.includes(player) ||
      tournament.losersQueue.includes(player)
    );

    if(available.length >= 2){

      const p1 = available[0];
      const p2 = available[1];

      tournament.winnersQueue =
        tournament.winnersQueue.filter(p => p !== p1 && p !== p2);

      tournament.losersQueue =
        tournament.losersQueue.filter(p => p !== p1 && p !== p2);

      startTournamentMatch({
        type: p1.losses === 0 && p2.losses === 0 ? "winners" : "losers",
        p1,
        p2
      });

      return;
    }

    /*
      Теоретически сюда можно попасть только при
      нечётном количестве участников.
      Переносим игрока дальше без поражения.
    */

    if(tournament.winnersQueue.length === 1){

      const waiting = tournament.winnersQueue.shift();

      addLog(`⏭ ${waiting.name} получает BYE.`);

      schedule(startNextTournamentMatch,500);
      return;
    }

    finishTournament(alive[0]);
    return;
  }

  startTournamentMatch(match);
}

function startTournamentMatch(match){

  tournament.currentMatch = match;
  tournament.currentStage =
    match.type === "winners"
      ? "WINNERS BRACKET"
      : "LOSERS BRACKET";

  stageTitle.textContent = tournament.currentStage;

  battleLog.innerHTML = "";

  addLog(`⚔️ НОВЫЙ БОЙ: ${match.p1.name} VS ${match.p2.name}`);
  addLog(`🏆 ${tournament.currentStage}`);

  renderBracket();

  schedule(() => {
    startBattle(match.p1,match.p2);
  },700);
}

/* =========================
   BATTLE
========================= */

function startBattle(p1,p2){

  battle = {
    p1,
    p2,

    hp1:MAX_HP,
    hp2:MAX_HP,

    score1:0,
    score2:0,

    round:1,

    currentPlayer:Math.random() < .5 ? 1 : 2,

    stunned1:false,
    stunned2:false,

    jokerCharge1:0,
    jokerCharge2:0,

    finished:false
  };

  clearBattleVisuals();

  addLog(`🥊 ${p1.name} (${getClassName(p1)}) VS ${p2.name} (${getClassName(p2)})`);
  addLog(`🎲 Первый ход: ${getBattlePlayer(battle.currentPlayer).name}`);

  updateBattleUI();

  schedule(startBattleTurn,900);
}

function clearBattleVisuals(){

  die1El.textContent = "?";
  die2El.textContent = "?";

  resultText.textContent = "—";
  specialText.textContent = "";
  damageText.textContent = "";

  battleLog.innerHTML = "";

  status1.textContent = "";
  status2.textContent = "";

  fighter1.classList.remove("active","dead");
  fighter2.classList.remove("active","dead");
}

function getBattlePlayer(side){
  return side === 1 ? battle.p1 : battle.p2;
}

function getBattleHp(side){
  return side === 1 ? battle.hp1 : battle.hp2;
}

function setBattleHp(side,value){
  if(side === 1){
    battle.hp1 = value;
  }else{
    battle.hp2 = value;
  }
}

function getOpponentSide(side){
  return side === 1 ? 2 : 1;
}

function startBattleTurn(){

  if(battle.finished){
    return;
  }

  const side = battle.currentPlayer;
  const player = getBattlePlayer(side);

  /*
    Оглушение Варвара.
  */

  if(side === 1 && battle.stunned1){
    battle.stunned1 = false;

    addLog(`💫 ${player.name} оглушён и пропускает ход.`);

    updateBattleUI();

    battle.currentPlayer = 2;

    schedule(startBattleTurn,TURN_DELAY);
    return;
  }

  if(side === 2 && battle.stunned2){
    battle.stunned2 = false;

    addLog(`💫 ${player.name} оглушён и пропускает ход.`);

    updateBattleUI();

    battle.currentPlayer = 1;

    schedule(startBattleTurn,TURN_DELAY);
    return;
  }

  updateBattleUI();

  rollDice(side,"normal");
}

function drawDiceAnimated(){

  die1El.classList.add("rolling");
  die2El.classList.add("rolling");

  const frames = 7;

  for(let i = 0; i < frames; i++){

    schedule(() => {

      die1El.textContent = randomInt(1,6);
      die2El.textContent = randomInt(1,6);

    },i * (DICE_ANIMATION_TIME / frames));
  }

  schedule(() => {

    die1El.classList.remove("rolling");
    die2El.classList.remove("rolling");

  },DICE_ANIMATION_TIME);
}

function rollDice(side,rollType){

  drawDiceAnimated();

  schedule(() => {

    finishDiceRoll(side,rollType);

  },DICE_ANIMATION_TIME + 80);
}

function finishDiceRoll(side,rollType){

  if(battle.finished){
    return;
  }

  const player = getBattlePlayer(side);
  const opponentSide = getOpponentSide(side);

  const dieA = randomInt(1,6);
  const dieB = randomInt(1,6);

  const result = dieA * 10 + dieB;

  die1El.textContent = dieA;
  die2El.textContent = dieB;

  resultText.textContent = result;

  const isDouble = dieA === dieB;

  specialText.textContent = "";
  damageText.textContent = "";

  /*
    ASSASSIN
    Дубль превращается в критический новый бросок.
  */

  if(
    rollType === "normal" &&
    isDouble &&
    player.class === "assassin"
  ){

    specialText.textContent = "⚡ КРИТИЧЕСКИЙ УРОН!";

    addLog(
      `⚡ ${player.name} выбросил дубль ${result}. ` +
      `Обычный урон отменён. Следующий бросок будет ×2.`
    );

    schedule(() => {
      rollDice(side,"critical");
    },650);

    return;
  }

  /*
    VAMPIRE
    Дубль превращается в укус.
  */

  if(
    rollType === "normal" &&
    isDouble &&
    player.class === "vampire"
  ){

    specialText.textContent = "🩸 УКУС!";

    addLog(
      `🩸 ${player.name} выбросил дубль ${result}. ` +
      `Дубль не наносит урон. Следующий бросок станет укусом.`
    );

    schedule(() => {
      rollDice(side,"vampire");
    },650);

    return;
  }

  /*
    JOKER
    Если заряд есть — следующий удар ×3.
  */

  let damage = result;

  if(
    player.class === "joker" &&
    (
      side === 1
        ? battle.jokerCharge1 > 0
        : battle.jokerCharge2 > 0
    )
  ){

    damage = result * 3;

    specialText.textContent = "🃏 ТРОЙНОЙ УДАР ×3!";

    if(side === 1){
      battle.jokerCharge1--;
    }else{
      battle.jokerCharge2--;
    }

    addLog(
      `🃏 ${player.name} использует усиление: ` +
      `${result} × 3 = ${damage} урона!`
    );
  }

  /*
    ASSASSIN critical.
  */

  if(rollType === "critical"){

    damage = result * 2;

    specialText.textContent = "⚡ КРИТИЧЕСКИЙ УДАР ×2!";

    addLog(
      `💥 ${player.name}: ${result} × 2 = ${damage} урона!`
    );
  }

  /*
    VAMPIRE bite.
  */

  if(rollType === "vampire"){

    damage = result;

    specialText.textContent = "🩸 УКУС!";

    addLog(
      `🩸 ${player.name} наносит ${damage} урона и восстанавливает столько же HP.`
    );
  }

  /*
    Нанесение урона.
  */

  const oldOpponentHp = getBattleHp(opponentSide);

  const newOpponentHp = Math.max(
    0,
    oldOpponentHp - damage
  );

  setBattleHp(opponentSide,newOpponentHp);

  damageText.textContent = `-${damage} HP`;

  addLog(
    `🎲 ${player.name} выбросил ${result}. ` +
    `Урон: ${damage}.`
  );

  /*
    VAMPIRE HEAL.
  */

  if(rollType === "vampire"){

    const oldHp = getBattleHp(side);

    const newHp = Math.min(
      MAX_HP,
      oldHp + damage
    );

    const healed = newHp - oldHp;

    setBattleHp(side,newHp);

    if(healed > 0){
      addLog(`❤️‍🩹 ${player.name} восстановил ${healed} HP.`);
    }
  }

  /*
    BARBARIAN STUN.
  */

  if(
    rollType === "normal" &&
    isDouble &&
    player.class === "barbar"
  ){

    if(opponentSide === 1){
      battle.stunned1 = true;
    }else{
      battle.stunned2 = true;
    }

    addLog(
      `💫 ${player.name} выбросил дубль ${result}. ` +
      `${getBattlePlayer(opponentSide).name} пропустит следующий ход.`
    );
  }

  /*
    JOKER PASSIVE.
    ВАЖНО: проверяем HP обоих игроков ПОСЛЕ урона.
  */

  checkJokerTrigger(1);
  checkJokerTrigger(2);

  updateBattleUI();

  /*
    Победа в раунде.
  */

  if(newOpponentHp <= 0){

    finishRound(side);
    return;
  }

  /*
    Следующий ход.
  */

  battle.currentPlayer = opponentSide;

  schedule(startBattleTurn,TURN_DELAY);
}

function checkJokerTrigger(side){

  const player = getBattlePlayer(side);

  if(player.class !== "joker"){
    return;
  }

  const hpSelf = getBattleHp(side);
  const hpOpponent = getBattleHp(getOpponentSide(side));

  let triggered = false;

  if(beautifulHp(hpSelf)){
    triggered = true;

    addLog(
      `🃏 ${player.name}: его HP стало ${hpSelf}. ` +
      `Получено усиление ×3!`
    );
  }

  if(beautifulHp(hpOpponent)){
    triggered = true;

    addLog(
      `🃏 ${player.name}: HP противника стало ${hpOpponent}. ` +
      `Получено усиление ×3!`
    );
  }

  if(triggered){

    if(side === 1){
      battle.jokerCharge1++;
    }else{
      battle.jokerCharge2++;
    }
  }
}

/* =========================
   ROUND SYSTEM
========================= */

function finishRound(winnerSide){

  if(battle.finished){
    return;
  }

  battle.finished = true;

  const winner = getBattlePlayer(winnerSide);
  const loser = getBattlePlayer(getOpponentSide(winnerSide));

  if(winnerSide === 1){
    battle.score1++;
  }else{
    battle.score2++;
  }

  addLog(
    `🏆 РАУНД ${battle.round}: ${winner.name} победил!`
  );

  updateBattleUI();

  if(battle.score1 >= 2 || battle.score2 >= 2){

    schedule(() => {
      finishBattle(winner,loser);
    },NEXT_ROUND_DELAY);

    return;
  }

  battle.round++;

  /*
    Round 2:
    проигравший прошлого раунда получает первый ход.
  */

  if(battle.round === 2){

    schedule(() => {

      resetRound(loserSide(winnerSide));

      addLog(
        `⚖️ ПРАВО НЕУДАЧНИКА: ${loser.name} начинает следующий раунд.`
      );

      schedule(startBattleTurn,850);

    },NEXT_ROUND_DELAY);

    return;
  }

  /*
    Round 3:
    автоматическая жеребьёвка первого хода.
  */

  schedule(() => {

    const first = Math.random() < .5 ? 1 : 2;

    resetRound(first);

    addLog(
      `🎲 РЕШАЮЩИЙ РАУНД: первый ход получает ` +
      `${getBattlePlayer(first).name}.`
    );

    schedule(startBattleTurn,850);

  },NEXT_ROUND_DELAY);
}

function loserSide(winnerSide){
  return winnerSide === 1 ? 2 : 1;
}

function resetRound(firstPlayer){

  battle.hp1 = MAX_HP;
  battle.hp2 = MAX_HP;

  battle.currentPlayer = firstPlayer;

  battle.stunned1 = false;
  battle.stunned2 = false;

  battle.jokerCharge1 = 0;
  battle.jokerCharge2 = 0;

  battle.finished = false;

  die1El.textContent = "?";
  die2El.textContent = "?";

  resultText.textContent = "—";
  specialText.textContent = "";
  damageText.textContent = "";

  addLog(
    `🔄 НАЧАЛО РАУНДА ${battle.round}: ` +
    `${getBattlePlayer(firstPlayer).name} ходит первым.`
  );

  updateBattleUI();
}

function finishBattle(winner,loser){

  winner.wins++;

  loser.losses++;

  tournament.completedMatches++;

  tournament.history.push({
    stage:tournament.currentStage,
    winner:winner.id,
    loser:loser.id
  });

  /*
    Первое поражение -> Losers.
    Второе -> вылет.
  */

  if(loser.losses >= 2){

    loser.eliminated = true;

    addLog(
      `❌ ${loser.name} получает второе поражение и выбывает.`
    );

  }else{

    /*
      Если проиграл в Winners — отправляем в Losers.
      Если проиграл в Losers — остаётся выбывшим.
    */

    if(tournament.currentStage === "WINNERS BRACKET"){

      tournament.losersQueue.push(loser);

      addLog(
        `⬇️ ${loser.name} переходит в LOSERS BRACKET.`
      );

    }else{

      loser.eliminated = true;

      addLog(
        `❌ ${loser.name} выбывает из турнира.`
      );
    }
  }

  /*
    Победитель Winners остаётся в Winners.
    Победитель Losers остаётся в Losers.
  */

  if(tournament.currentStage === "WINNERS BRACKET"){

    tournament.winnersQueue.push(winner);

  }else{

    tournament.losersQueue.push(winner);
  }

  tournament.currentMatch = null;

  updateTournamentCounters();
  renderBracket();

  const alive = getAlivePlayers();

  if(alive.length <= 1){

    finishTournament(alive[0]);
    return;
  }

  /*
    Специально оставляем небольшую паузу,
    чтобы зритель видел результат боя.
  */

  schedule(startNextTournamentMatch,1500);
}

/* =========================
   UI
========================= */

function updateBattleUI(){

  if(!battle.p1 || !battle.p2){
    return;
  }

  fighter1Name.textContent = battle.p1.name;
  fighter2Name.textContent = battle.p2.name;

  fighter1Class.textContent = getClassName(battle.p1);
  fighter2Class.textContent = getClassName(battle.p2);

  fighter1Class.className =
    `class-name ${getClassCss(battle.p1.class)}`;

  fighter2Class.className =
    `class-name ${getClassCss(battle.p2.class)}`;

  hp1El.textContent = battle.hp1;
  hp2El.textContent = battle.hp2;

  hp1Bar.style.width = `${battle.hp1 / MAX_HP * 100}%`;
  hp2Bar.style.width = `${battle.hp2 / MAX_HP * 100}%`;

  scoreText.textContent =
    `${battle.score1} : ${battle.score2}`;

  roundText.textContent =
    `РАУНД ${battle.round} / 3`;

  fighter1.classList.toggle(
    "active",
    !battle.finished && battle.currentPlayer === 1
  );

  fighter2.classList.toggle(
    "active",
    !battle.finished && battle.currentPlayer === 2
  );

  fighter1.classList.toggle("dead",battle.hp1 <= 0);
  fighter2.classList.toggle("dead",battle.hp2 <= 0);

  turn1.textContent =
    battle.currentPlayer === 1 && !battle.finished
      ? `ХОД: ${battle.p1.name}`
      : "ОЖИДАНИЕ";

  turn2.textContent =
    battle.currentPlayer === 2 && !battle.finished
      ? `ХОД: ${battle.p2.name}`
      : "ОЖИДАНИЕ";

  status1.textContent = getStatusText(1);
  status2.textContent = getStatusText(2);
}

function getStatusText(side){

  const player = getBattlePlayer(side);

  const result = [];

  if(side === 1 && battle.stunned1){
    result.push("💫 ОГЛУШЁН");
  }

  if(side === 2 && battle.stunned2){
    result.push("💫 ОГЛУШЁН");
  }

  if(player.class === "joker"){

    const charges =
      side === 1
        ? battle.jokerCharge1
        : battle.jokerCharge2;

    if(charges > 0){
      result.push(`🃏 ×3 ЗАРЯДОВ: ${charges}`);
    }
  }

  return result.join(" • ");
}

function updateTournamentCounters(){

  completedMatchesEl.textContent =
    tournament.completedMatches;

  alivePlayersEl.textContent =
    getAlivePlayers().length;
}

/* =========================
   BRACKET
========================= */

function renderBracket(){

  bracketGrid.innerHTML = "";

  const winners = tournament.winnersQueue;
  const losers = tournament.losersQueue;

  /*
    Winners column.
  */

  const winnersColumn = document.createElement("div");
  winnersColumn.className = "bracket-column";

  winnersColumn.innerHTML =
    `<div class="column-title">WINNERS BRACKET</div>`;

  if(winners.length === 0){

    const empty = document.createElement("div");
    empty.className = "match";
    empty.innerHTML = `
      <div class="match-player empty">ПУСТО</div>
    `;

    winnersColumn.appendChild(empty);

  }else{

    winners.forEach(player => {

      const match = document.createElement("div");
      match.className = "match";

      match.innerHTML = `
        <div class="match-player winner">
          <span>${escapeHtml(player.name)}</span>
          <span>0L</span>
        </div>
        <div class="match-status">ОЖИДАЕТ</div>
      `;

      winnersColumn.appendChild(match);
    });
  }

  bracketGrid.appendChild(winnersColumn);

  /*
    Losers column.
  */

  const losersColumn = document.createElement("div");
  losersColumn.className = "bracket-column";

  losersColumn.innerHTML =
    `<div class="column-title">LOSERS BRACKET</div>`;

  if(losers.length === 0){

    const empty = document.createElement("div");
    empty.className = "match";
    empty.innerHTML = `
      <div class="match-player empty">ПОКА НЕТ</div>
    `;

    losersColumn.appendChild(empty);

  }else{

    losers.forEach(player => {

      const match = document.createElement("div");
      match.className = "match";

      match.innerHTML = `
        <div class="match-player">
          <span>${escapeHtml(player.name)}</span>
          <span>${player.losses}L</span>
        </div>
        <div class="match-status">ВТОРОЙ ШАНС</div>
      `;

      losersColumn.appendChild(match);
    });
  }

  bracketGrid.appendChild(losersColumn);

  /*
    Current match.
  */

  if(tournament.currentMatch){

    const currentColumn = document.createElement("div");
    currentColumn.className = "bracket-column";

    currentColumn.innerHTML =
      `<div class="column-title">ТЕКУЩИЙ БОЙ</div>`;

    const match = document.createElement("div");
    match.className = "match current";

    match.innerHTML = `
      <div class="match-player">
        <span>${escapeHtml(tournament.currentMatch.p1.name)}</span>
      </div>

      <div style="text-align:center;color:#24d8ff;font-weight:1000;padding:3px">
        VS
      </div>

      <div class="match-player">
        <span>${escapeHtml(tournament.currentMatch.p2.name)}</span>
      </div>

      <div class="match-status">
        ${escapeHtml(tournament.currentStage)}
      </div>
    `;

    currentColumn.appendChild(match);
    bracketGrid.appendChild(currentColumn);
  }
}

/* =========================
   FINISH TOURNAMENT
========================= */

function finishTournament(winner){

  if(tournament.finished){
    return;
  }

  tournament.finished = true;
  tournament.active = false;
  tournament.winner = winner;

  clearAllTimers();

  if(!winner){
    return;
  }

  stageTitle.textContent = "ТУРНИР ЗАВЕРШЁН";

  winnerName.textContent = winner.name;
  winnerClass.textContent =
    `${getClassName(winner)} • ПОБЕДИТЕЛЬ`;

  winnerOverlay.classList.remove("hidden");

  addLog(
    `🏆🏆🏆 ${winner.name} ПОБЕДИЛ ВО ВСЁМ ТУРНИРЕ!`
  );

  updateTournamentCounters();
  renderBracket();
}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================
   RESET
========================= */

function resetApplication(){

  clearAllTimers();

  players = [];

  tournament = {
    active:false,
    finished:false,
    completedMatches:0,
    winnersQueue:[],
    losersQueue:[],
    currentStage:"",
    currentMatch:null,
    winner:null,
    history:[]
  };

  winnerOverlay.classList.add("hidden");
  tournamentPanel.classList.add("hidden");
  setupPanel.classList.remove("hidden");

  playersEditor.innerHTML = "";
  playersEditor.classList.add("hidden");

  setupActions.classList.add("hidden");

  setupMessage.textContent = "";

  playerCountInput.value = 8;
}

/* =========================
   EVENTS
========================= */

createPlayersButton.addEventListener(
  "click",
  createPlayerEditor
);

playerCountInput.addEventListener(
  "change",
  () => {

    let value = Number(playerCountInput.value);

    if(!Number.isFinite(value)){
      value = 8;
    }

    playerCountInput.value =
      clamp(Math.floor(value),2,100);
  }
);

startTournamentButton.addEventListener(
  "click",
  startTournament
);

clearPlayersButton.addEventListener(
  "click",
  () => {

    playersEditor.innerHTML = "";
    playersEditor.classList.add("hidden");

    setupActions.classList.add("hidden");

    setupMessage.textContent = "";
  }
);

newTournamentButton.addEventListener(
  "click",
  resetApplication
);

winnerRestartButton.addEventListener(
  "click",
  resetApplication
);

/* =========================
   INITIAL
========================= */

createPlayerEditor();
</script>

</body>
</html>
