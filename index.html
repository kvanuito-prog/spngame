<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ядерный Шторм: Баллистический Симулятор</title>
<style>
body {
font-family: 'Courier New', Courier, monospace;
background-color: #0d1117;
color: #c9d1d9;
margin: 0;
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
}
h1 { color: #58a6ff; text-shadow: 0 0 10px rgba(88, 166, 255, 0.3); }
.container {
display: flex;
gap: 20px;
max-width: 900px;
width: 100%;
flex-wrap: wrap;
}
.panel {
background-color: #161b22;
border: 1px solid #30363d;
border-radius: 6px;
padding: 20px;
flex: 1;
min-width: 300px;
}
.form-group {
margin-bottom: 15px;
}
label {
display: block;
margin-bottom: 5px;
font-size: 14px;
color: #8b949e;
}
input {
width: 100%;
padding: 8px;
background-color: #0d1117;
border: 1px solid #30363d;
border-radius: 4px;
color: #c9d1d9;
box-sizing: border-box;
}
button {
background-color: #238636;
color: white;
border: none;
padding: 10px 15px;
border-radius: 4px;
cursor: pointer;
width: 100%;
font-weight: bold;
font-size: 16px;
}
button:hover { background-color: #2ea043; }
.log-box {
background-color: #010409;
border: 1px solid #30363d;
border-radius: 4px;
padding: 15px;
height: 250px;
overflow-y: auto;
font-size: 13px;
line-height: 1.4;
}
.target-info {
border-left: 3px solid #f85149;
padding-left: 10px;
margin-bottom: 15px;
}
</style>
</head>
<body>

<h1>🚀 БАЛЛИСТИЧЕСКАЯ ШАХТА</h1>

<div class="container">
<!— Панель управления —>
<div class="panel">
<h3>Параметры пуска</h3>
<div class="target-info">
<strong>Цель:</strong> Вражеская шахта

<strong>Расстояние:</strong> ~7 500 км

<strong>Требуемый азимут:</strong> ~74.5°

<strong>Оптимальное топливо:</strong> ~42 000 кг (при боеголовке 1000 кг)
</div>

<div class="form-group">
<label for="warhead">Масса боеголовки (кг):</label>
<input type="number" id="warhead" value="1000" min="100" max="10000">
</div>

<div class="form-group">
<label for="fuel">Масса твердого топлива (кг):</label>
<input type="number" id="fuel" value="40000" min="1000" max="100000">
</div>

<div class="form-group">
<label for="azimuth">Азимут запуска (градусы 0–360):</label>
<input type="number" id="azimuth" value="74.0" step="0.1" min="0" max="360">
</div>

<button onclick="launchMissile()">ЗАПУСК РАКЕТЫ</button>
</div>

<!— Лог полета —>
<div class="panel">
<h3>Телеметрия и лог полета</h3>
<div id="log" class="log-box">
Система инициализирована. Ожидание параметров пуска...

</div>
</div>
</div>

<script>
function log(message) {
const logBox = document.getElementById('log');
logBox.innerHTML += message + '
';
logBox.scrollTop = logBox.scrollHeight;
}

function launchMissile() {
const warhead = parseFloat(document.getElementById('warhead').value);
const fuel = parseFloat(document.getElementById('fuel').value);
const azimuth = parseFloat(document.getElementById('azimuth').value);

log('-----------------------------------');
log('⚡ Произведено зажигание двигателей!');

// 1. Расчет массы и уравнения Циолковского
const dryMass = 3000; // масса пустого корпуса ракеты
const totalMass = dryMass + warhead + fuel;
const Isp = 280; // удельный импульс твердого топлива (с)
const g0 = 9.81;

// Идеальная скорость по Циолковскому: v = Isp * g0 * ln(m0 / m1)
const burnoutMass = dryMass + warhead;
const deltaV = Isp * g0 * Math.log(totalMass / burnoutMass);

log(`> Стартовая масса: ${totalMass} кг`);
log(`> Конечная скорость (Δv): ${deltaV.toFixed(1)} м/с`);

// 2. Расчет дальности полета на основе энергии/скорости
// Для упрощения симуляции: переводим deltaV в дальность полета по дуге Земли
// 7500 км требуют определенной скорости (примерно 5500-5800 м/с суборбитальной скорости)
const calculatedDistance = (deltaV * deltaV) / 6000; // условный коэффициент масштаба физики
const targetDistance = 7500; // км
const distanceError = calculatedDistance - targetDistance;

log(`> Расчетная дальность: ${calculatedDistance.toFixed(1)} км (Цель: ${targetDistance} км)`);

// 3. Расчет ошибки по азимуту (с учетом вращения Земли / Кориолиса)
// Время полета для 7500 км составляет примерно 1200 секунд (20 минут)
const flightTime = (targetDistance / 7500) * 1200;
const earthRotationDrift = (flightTime * 465 * Math.sin(Math.PI / 4)) / 1000; // снос из-за вращения Земли в км

const optimalAzimuth = 74.5;
const azimuthError = Math.abs(azimuth - optimalAzimuth);

// Переводим отклонение по азимуту в линейное отклонение на дальности 7500 км
const lateralError = azimuthError * 111; // примерно 111 км на 1 градус на экваторе/средних широтах

log(`> Полетное время: ${(flightTime / 60).toFixed(1)} мин.`);
log(`> Учет вращения Земли (Кориолис): учтен.`);

// 4. Оценка результатов падения
setTimeout(() => {
log('🎯 РАКЕТА ПОДХОДИТ К ЦЕЛИ...');

setTimeout(() => {
const totalMissDistance = Math.sqrt((distanceError * distanceError) + (lateralError * lateralError));

log(`> Ошибка по дальности: ${Math.abs(distanceError).toFixed(2)} км`);
log(`> Боковое отклонение: ${lateralError.toFixed(2)} км`);
log(`> Общее отклонение от центра шахты: ${(totalMissDistance * 1000).meters || (totalMissDistance).toFixed(2)} км`);

// Проверка попадания в клетку 100x100 метров (0.1 км)
if (totalMissDistance <= 0.1) {
log('🎉 <strong>ПРЯМОЕ ПОПАДАНИЕ!</strong> Шахта противника уничтожена!');
} else if (totalMissDistance <= 2.0 && warhead >= 5000) {
log('💥 <strong>УСПЕХ БОЕГОЛОВКИ!</strong> Близкий разрыв мощного заряда уничтожной ударной волной!');
} else {
log('❌ <strong>ПРОМАХ!</strong> Ракета упала в пустом поле. Шахта врага цеста.');
}
log('-----------------------------------');
}, 1000);
}, 1000);
}
</script>
</body>
</html>
