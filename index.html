<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPN BATTLE</title>

<style>
:root{
    --bg:#05070b;
    --panel:#0b1018;
    --blue:#00a8ff;
    --cyan:#24d8ff;
    --text:#f3f7fb;
    --muted:#8793a3;
    --danger:#ff3d58;
    --green:#36e28c;
    --yellow:#ffd34d;
    --purple:#b66cff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 20%,rgba(0,168,255,.08),transparent 35%),
        linear-gradient(135deg,#03050a,#07101a 50%,#03050a);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,input,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.page{
    width:100%;
    height:100vh;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

/* HEADER */

.header{
    min-height:52px;
    background:linear-gradient(135deg,#0b111b,#101925);
    border:1px solid rgba(0,168,255,.22);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 15px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:var(--cyan);
}

.header-center{
    text-align:center;
}

.round-title{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
    letter-spacing:1px;
}

.score{
    font-size:22px;
    font-weight:900;
    color:var(--cyan);
    line-height:23px;
}

.status{
    min-width:190px;
    text-align:right;
    font-size:11px;
    color:var(--green);
    font-weight:900;
    letter-spacing:.7px;
}

/* SETUP */

.names-panel{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.07);
    border-radius:11px;
    padding:6px 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.setup-box{
    display:flex;
    align-items:center;
    gap:6px;
}

.name-input{
    width:175px;
    height:34px;
    background:#060a10;
    border:1px solid rgba(0,168,255,.25);
    border-radius:7px;
    outline:none;
    color:white;
    padding:0 10px;
    font-size:12px;
    font-weight:800;
    text-align:center;
}

.name-input:focus{
    border-color:var(--cyan);
}

.class-select{
    width:125px;
    height:34px;
    background:#060a10;
    border:1px solid rgba(0,168,255,.25);
    border-radius:7px;
    color:white;
    padding:0 7px;
    font-size:11px;
    font-weight:800;
    outline:none;
}

.start-button{
    height:34px;
    padding:0 16px;
    border:0;
    border-radius:7px;
    color:white;
    font-size:11px;
    font-weight:900;
    background:linear-gradient(135deg,#087cb5,#00a8ff);
}

/* COIN */

.coin-panel{
    min-height:43px;
    background:var(--panel);
    border:1px solid rgba(255,255,255,.07);
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.coin-button{
    border:1px solid rgba(0,168,255,.45);
    background:linear-gradient(135deg,#087cb5,#00a8ff);
    color:white;
    font-weight:900;
    font-size:11px;
    padding:7px 18px;
    border-radius:8px;
}

.coin-button:disabled{
    opacity:.3;
    cursor:not-allowed;
}

.coin-result{
    min-width:220px;
    text-align:center;
    font-size:11px;
    font-weight:900;
    color:var(--yellow);
    letter-spacing:1px;
}

/* BATTLE */

.battle{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(240px,1fr) minmax(310px,1.15fr) minmax(240px,1fr);
    gap:8px;
}

.player-card,
.arena{
    min-height:0;
    background:linear-gradient(160deg,#0b1018,#080d14);
    border:1px solid rgba(255,255,255,.07);

}

.player-card{

    padding:12px;

}

.player-card.active{

.player-top{

}

.player-number{
    font-size:10px;

}

.player-name{
    font-size:21px;

}

.class-name{

}

.class-name.assassin{
    color:var(--purple);
}

.hp-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
}

.hp-label{
    font-size:10px;
    color:var(--muted);
    font-weight:800;
}

.hp-value{
    font-size:17px;
    font-weight:900;
}

.hp-bar{
    height:12px;
    background:#1b222c;
    border-radius:20px;
    overflow:hidden;
}

.hp-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#20d27b,#63f1ad);
    transition:width .35s ease;
}

.turn-label,
.stun-label{
    min-height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:7px;
    font-size:10px;
    font-weight:900;
    letter-spacing:.5px;
}

.turn-label{
    margin-top:auto;
    background:rgba(0,168,255,.08);
    color:#6b7a8b;
}

.player-card.active .turn-label{
    background:rgba(0,168,255,.16);
    color:var(--cyan);
}

.stun-label{
    margin-top:5px;
    background:rgba(255,211,77,.08);
    color:#69717d;
}

.stun-label.visible{
    color:var(--yellow);
    background:rgba(255,211,77,.14);
}

.controls{
    margin-top:5px;
}

.kick-button{
    width:100%;
    padding:6px;
    border-radius:7px;
    border:1px solid rgba(255,61,88,.3);
    background:rgba(255,61,88,.07);
    color:#ff6b7d;
    font-size:9px;
    font-weight:900;
}

/* ARENA */

.arena{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:9px;
}

.arena-turn{
    height:29px;
    display:flex;
    align-items:center;
    justify-content:center;

}

.dice-area{
    display:flex;

}

.dice{

    height:70px;

    box-shadow:

}

.dot{

.pos1{grid-area:1/1}

    height:23px;

}

.critical-text{
    height:22px;

.critical-text.visible{

}

.log{
    width:100%;

    background:#060a10;
    border:1px solid rgba(255,255,255,.06);

    padding:6px;

    display:flex;
    flex-direction:column;
    gap:4px;
}

.log-entry{
    font-size:9px;
    line-height:12px;

/* WINNER */

.overlay{

    background:rgba(0,0,0,.72);

    justify-content:center;

.winner-box{

.winner-title{

.winner-score{

.restart{
    border:0;

}

@media (orientation:portrait){
    html,body{

    }

    }

    }
}
</style>

<body>

<script>

/* =========================
   CONSTANTS
========================= */

const MAX_HP = 1000;

const TURN_DELAY = 900;

const DICE_ANIMATION_TIME = 550;

const NEXT_ROUND_DELAY = 1800;


/* =========================
   STATE
========================= */

let hp1 = MAX_HP;
let hp2 = MAX_HP;

let score1 = 0;
let score2 = 0;

let currentRound = 1;

let currentPlayer = 1;

let stunned1 = false;
let stunned2 = false;

let gameStarted = false;
let battleFinished = false;
let roundFinished = false;

let previousRoundWinner = null;
let previousRoundLoser = null;

let playerName1 = "ИГРОК 1";
let playerName2 = "ИГРОК 2";

let playerClass1 = "barbar";
let playerClass2 = "barbar";

let battleTimer = null;
let diceTimer = null;
let nextRoundTimer = null;
let coinTimer = null;

let audioContext = null;

let soundEnabled = true;


/* =========================
   ELEMENTS
========================= */

const namesPanel =
    document.getElementById("namesPanel");

const name1Input =
    document.getElementById("name1Input");

const name2Input =
    document.getElementById("name2Input");

const class1Select =
    document.getElementById("class1Select");

const class2Select =
    document.getElementById("class2Select");

const startGameButton =
    document.getElementById("startGameButton");

const coinButton =
    document.getElementById("coinButton");

const coinResult =
    document.getElementById("coinResult");

const roundTitle =
    document.getElementById("roundTitle");

const score =
    document.getElementById("score");

const status =
    document.getElementById("status");

const arenaTurn =
    document.getElementById("arenaTurn");

const hp1Text =
    document.getElementById("hp1Text");

const hp2Text =
    document.getElementById("hp2Text");

const hp1Bar =
    document.getElementById("hp1Bar");

const hp2Bar =
    document.getElementById("hp2Bar");

const player1 =
    document.getElementById("player1");

const player2 =
    document.getElementById("player2");

const player1Name =
    document.getElementById("player1Name");

const player2Name =
    document.getElementById("player2Name");

const class1Name =
    document.getElementById("class1Name");

const class2Name =
    document.getElementById("class2Name");

const turn1 =
    document.getElementById("turn1");

const turn2 =
    document.getElementById("turn2");

const stun1 =
    document.getElementById("stun1");

const stun2 =
    document.getElementById("stun2");

const dice1 =
    document.getElementById("dice1");

const dice2 =
    document.getElementById("dice2");

const resultNumber =
    document.getElementById("resultNumber");

const damageText =
    document.getElementById("damageText");

const criticalText =
    document.getElementById("criticalText");

const log =
    document.getElementById("log");

const winnerOverlay =
    document.getElementById("winnerOverlay");

const winnerTitle =
    document.getElementById("winnerTitle");

const winnerScore =
    document.getElementById("winnerScore");

const winnerClose =
    document.getElementById("winnerClose");


/* =========================
   DICE
========================= */

const dicePatterns = {

    1:[5],

    2:[1,9],

    3:[1,5,9],

    4:[1,3,7,9],

    5:[1,3,5,7,9],

    6:[1,3,4,6,7,9]

};


function drawDice(element,number){

    element.innerHTML = "";

    if(!number) return;

    dicePatterns[number].forEach(position => {

        const dot =
            document.createElement("span");

        dot.className =
            `dot pos${position}`;

        element.appendChild(dot);

    });
}


/* =========================
   PLAYER INFO
========================= */

function getPlayerName(player){

    return player === 1
        ? playerName1
        : playerName2;
}


function getPlayerClass(player){

    return player === 1
        ? playerClass1
        : playerClass2;
}


function getClassName(player){

    return getPlayerClass(player) === "assassin"
        ? "АССАСИН"
        : "ВАРВАР";
}


/* =========================
   SOUND
========================= */

function initAudio(){

    if(!soundEnabled) return;

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }
}


function playClick(
    frequency=520,
    duration=.045,
    volume=.035
){

    if(!soundEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.frequency.value =
        frequency;

    oscillator.type =
        "sine";

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );
}


function playButtonSound(){

    playClick(
        520,
        .045,
        .035
    );

}


function playHoverSound(){

    playClick(
        720,
        .025,
        .012
    );

}


function playOpenSound(){

    if(!soundEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        420,
        audioContext.currentTime
    );

    oscillator.frequency.linearRampToValueAtTime(
        760,
        audioContext.currentTime + .15
    );

    gain.gain.setValueAtTime(
        .025,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .18
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + .18
    );
}


function playCriticalSound(){

    if(!soundEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "triangle";

    oscillator.frequency.setValueAtTime(
        500,
        audioContext.currentTime
    );

    oscillator.frequency.linearRampToValueAtTime(
        1100,
        audioContext.currentTime + .18
    );

    gain.gain.setValueAtTime(
        .045,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .25
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + .25
    );
}


function playCloseSound(){

    playClick(
        330,
        .06,
        .025
    );

}


/* =========================
   LOG
========================= */

function addLog(message){

    const entry =
        document.createElement("div");

    entry.className =
        "log-entry";

    entry.textContent =
        message;

    log.prepend(entry);

    while(log.children.length > 9){

        log.removeChild(
            log.lastChild
        );

    }
}


/* =========================
   TIMERS
========================= */

function clearTimers(){

    clearTimeout(battleTimer);

    clearTimeout(diceTimer);

    clearTimeout(nextRoundTimer);

    clearInterval(coinTimer);

    battleTimer = null;
    diceTimer = null;
    nextRoundTimer = null;
    coinTimer = null;
}


/* =========================
   UI
========================= */

function updateUI(){

    hp1Text.textContent =
        Math.max(0,hp1);

    hp2Text.textContent =
        Math.max(0,hp2);


    hp1Bar.style.width =
        `${Math.max(0,hp1 / MAX_HP * 100)}%`;

    hp2Bar.style.width =
        `${Math.max(0,hp2 / MAX_HP * 100)}%`;


    score.textContent =
        `${score1} : ${score2}`;


    roundTitle.textContent =
        `РАУНД ${currentRound} / 3`;


    player1.classList.toggle(
        "active",
        gameStarted && currentPlayer === 1
    );

    player2.classList.toggle(
        "active",
        gameStarted && currentPlayer === 2
    );


    turn1.textContent =
        gameStarted && currentPlayer === 1
            ? `ХОД: ${playerName1}`
            : "НЕ В ХОДУ";

    turn2.textContent =
        gameStarted && currentPlayer === 2
            ? `ХОД: ${playerName2}`
            : "НЕ В ХОДУ";


    stun1.textContent =
        stunned1
            ? "ОГЛУШЁН • ХОД ПРОПУСКАЕТ"
            : "НЕ ОГЛУШЁН";

    stun2.textContent =
        stunned2
            ? "ОГЛУШЁН • ХОД ПРОПУСКАЕТ"
            : "НЕ ОГЛУШЁН";


    stun1.classList.toggle(
        "visible",
        stunned1
    );

    stun2.classList.toggle(
        "visible",
        stunned2
    );


    if(gameStarted){

        status.textContent =
            `ХОД: ${getPlayerName(currentPlayer)}`;

        arenaTurn.textContent =
            `ХОД: ${getPlayerName(currentPlayer)}`;

    }
}


/* =========================
   RESET ROUND
========================= */

function resetRoundState(){

    hp1 = MAX_HP;
    hp2 = MAX_HP;

    stunned1 = false;
    stunned2 = false;

    gameStarted = false;
    roundFinished = false;

    currentPlayer = 1;

    criticalText.classList.remove(
        "visible"
    );

    drawDice(dice1,0);
    drawDice(dice2,0);

    resultNumber.textContent =
        "—";

    damageText.textContent =
        "ОЖИДАНИЕ БРОСКА";
}


/* =========================
   START ROUND
========================= */

function startRound(mode="manual"){

    clearTimers();

    resetRoundState();

    updateUI();


    addLog(
        `⚔️ Начинается раунд ${currentRound}. HP восстановлены до 1000.`
    );


    /* ROUND 1 */

    if(mode === "manual"){

        coinButton.disabled = false;

        coinResult.textContent =
            "ОРЕЛ / РЕШКА";

        status.textContent =
            "ВЫБЕРИТЕ ПЕРВОГО";

        arenaTurn.textContent =
            "ОЖИДАНИЕ";

        addLog(
            "🪙 Нажмите «ОРЕЛ / РЕШКА», чтобы определить первого игрока."
        );

        return;
    }


    /* ROUND 2 */

    if(mode === "loser"){

        coinButton.disabled = true;

        currentPlayer =
            previousRoundLoser;

        coinResult.textContent =
            "ПРАВО НЕУДАЧНИКА";

        status.textContent =
            `ПЕРВЫМ ХОДИТ ${getPlayerName(currentPlayer)}`;

        arenaTurn.textContent =
            "ПРАВО НЕУДАЧНИКА";

        addLog(
            `⚔️ Право неудачника: ${getPlayerName(currentPlayer)} проиграл прошлый раунд и начинает этот раунд.`
        );

        gameStarted = true;

        updateUI();


        battleTimer = setTimeout(() => {

            coinResult.textContent =
                "БОЙ ПРОДОЛЖАЕТСЯ";

            damageText.textContent =
                `Первым бросает ${getPlayerName(currentPlayer)}`;

            updateUI();


            battleTimer = setTimeout(() => {

                automaticTurn();

            },450);

        },1100);

        return;
    }


    /* ROUND 3 */

    if(mode === "autoCoin"){

        coinButton.disabled = true;

        coinResult.textContent =
            "КРУТИМ...";

        status.textContent =
            "ЖЕРЕБЬЁВКА";

        arenaTurn.textContent =
            "АВТОМАТИЧЕСКАЯ ЖЕРЕБЬЁВКА";

        addLog(
            "🎲 Счёт 1 : 1. Автоматическая жеребьёвка решит, кто начнёт третий раунд."
        );

        runAutomaticCoinToss();

    }
}


/* =========================
   ROUND 1 COIN
========================= */

function determineFirstPlayer(){

    if(gameStarted ||
       battleFinished ||
       roundFinished) return;

    if(currentRound !== 1) return;

    initAudio();

    playButtonSound();


    const result =
        Math.random() < .5
            ? "ОРЕЛ"
            : "РЕШКА";


    currentPlayer =
        result === "ОРЕЛ"
            ? 1
            : 2;


    coinResult.textContent =
        result;

    gameStarted = true;

    coinButton.disabled = true;


    addLog(
        `🪙 Выпало ${result}. ${getPlayerName(currentPlayer)} получает право первого броска.`
    );


    updateUI();


    battleTimer = setTimeout(() => {

        automaticTurn();

    },TURN_DELAY);
}


/* =========================
   ROUND 3 AUTO COIN
========================= */

function runAutomaticCoinToss(){

    let flips = 0;

    const totalFlips = 12;


    coinTimer = setInterval(() => {

        const visualResult =
            flips % 2 === 0
                ? "ОРЕЛ"
                : "РЕШКА";


        coinResult.textContent =
            visualResult;


        playClick(
            visualResult === "ОРЕЛ"
                ? 620
                : 470,
            .035,
            .018
        );


        flips++;


        if(flips >= totalFlips){

            clearInterval(
                coinTimer
            );

            coinTimer = null;


            const result =
                Math.random() < .5
                    ? "ОРЕЛ"
                    : "РЕШКА";


            currentPlayer =
                result === "ОРЕЛ"
                    ? 1
                    : 2;


            coinResult.textContent =
                result;

            gameStarted = true;

            playOpenSound();


            addLog(
                `🎲 Автоматическая жеребьёвка: выпало ${result}. ${getPlayerName(currentPlayer)} начинает решающий раунд.`
            );


            updateUI();


            battleTimer = setTimeout(() => {

                automaticTurn();

            },TURN_DELAY);

        }

    },120);
}


/* =========================
   AUTOMATIC TURN
========================= */

function automaticTurn(){

    if(!gameStarted ||
       battleFinished ||
       roundFinished) return;


    const stunned =
        currentPlayer === 1
            ? stunned1
            : stunned2;


    if(stunned){

        addLog(
            `💫 ${getPlayerName(currentPlayer)} оглушён и пропускает ход.`
        );


        if(currentPlayer === 1){

            stunned1 = false;

        }else{

            stunned2 = false;

        }


        updateUI();


        battleTimer = setTimeout(() => {

            currentPlayer =
                currentPlayer === 1
                    ? 2
                    : 1;


            updateUI();


            battleTimer = setTimeout(() => {

                automaticTurn();

            },450);

        },650);


        return;
    }


    rollDiceAutomatically();
}


/* =========================
   DICE ROLL
========================= */

function rollDiceAutomatically(){

    if(!gameStarted ||
       battleFinished ||
       roundFinished) return;


    const rollingPlayer =
        currentPlayer;


    let elapsed = 0;


    diceTimer = setInterval(() => {

        if(!gameStarted ||
           battleFinished ||
           roundFinished){

            clearInterval(
                diceTimer
            );

            diceTimer = null;

            return;
        }


        const temp1 =
            Math.floor(Math.random()*6)+1;

        const temp2 =
            Math.floor(Math.random()*6)+1;


        drawDice(
            dice1,
            temp1
        );

        drawDice(
            dice2,
            temp2
        );


        resultNumber.textContent =
            `${temp1}${temp2}`;


        elapsed += 90;


        if(elapsed >= DICE_ANIMATION_TIME){

            clearInterval(
                diceTimer
            );

            diceTimer = null;


            finishDiceRoll(
                rollingPlayer,
                false
            );

        }

    },90);
}


/* =========================
   FINISH NORMAL ROLL
========================= */

function finishDiceRoll(
    rollingPlayer,
    criticalRoll
){

    if(!gameStarted ||
       battleFinished ||
       roundFinished) return;


    const die1 =
        Math.floor(Math.random()*6)+1;

    const die2 =
        Math.floor(Math.random()*6)+1;


    drawDice(
        dice1,
        die1
    );

    drawDice(
        dice2,
        die2
    );


    const result =
        die1 * 10 + die2;


    resultNumber.textContent =
        result;


    const isDouble =
        die1 === die2;


    /*
       АССАСИН + ДУБЛЬ
       Дубль НЕ наносит обычный урон.
       Вместо этого запускается критический
       дополнительный бросок.
    */

    if(
        isDouble &&
        getPlayerClass(rollingPlayer) === "assassin" &&
        !criticalRoll
    ){

        criticalText.classList.add(
            "visible"
        );

        damageText.textContent =
            "⚡ КРИТ! НОВЫЙ БРОСОК ×2";

        playCriticalSound();


        addLog(
            `⚡ КРИТИЧЕСКИЙ УРОН! ${getPlayerName(rollingPlayer)} выбросил дубль ${result}. Этот бросок не наносит урон — следующий бросок будет удвоен.`
        );


        updateUI();


        /*
           Дополнительный бросок.
           Он является частью текущего хода.
        */

        battleTimer = setTimeout(() => {

            criticalRollDice(
                rollingPlayer
            );

        },750);


        return;
    }


    /*
       ОБЫЧНЫЙ УРОН
       Для варвара дубль наносит урон
       и дополнительно оглушает.
       Для критического броска ассасина
       итог уже умножен заранее.
    */

    let damage =
        result;


    if(
        criticalRoll
    ){

        damage =
            result * 2;

        addLog(
            `💥 КРИТИЧЕСКИЙ БРОСОК: ${result} × 2 = ${damage} урона!`
        );

    }


    damageText.textContent =
        `УРОН: ${damage}`;


    playClick(
        criticalRoll
            ? 780
            : 560,
        .06,
        .03
    );


    const targetPlayer =
        rollingPlayer === 1
            ? 2
            : 1;


    if(targetPlayer === 1){

        hp1 =
            Math.max(
                0,
                hp1 - damage
            );

    }else{

        hp2 =
            Math.max(
                0,
                hp2 - damage
            );

    }


    addLog(
        `${getPlayerName(rollingPlayer)} выбросил ${result}${criticalRoll ? ` × 2 = ${damage}` : ""} и нанёс ${damage} урона ${getPlayerName(targetPlayer)}.`
    );


    /*
       Варварский дубль.
       Критический бросок ассасина сюда
       не попадает, потому что он уже был
       обработан отдельно.
    */

    if(
        isDouble &&
        getPlayerClass(rollingPlayer) === "barbar"
    ){

        if(targetPlayer === 1){

            stunned1 = true;

        }else{

            stunned2 = true;

        }


        addLog(
            `🔥 ДУБЛЬ ${result}! ${getPlayerName(rollingPlayer)} оглушил ${getPlayerName(targetPlayer)}. Следующий ход будет пропущен.`
        );
    }


    criticalText.classList.remove(
        "visible"
    );


    updateUI();


    if(
        hp1 <= 0 ||
        hp2 <= 0
    ){

        const winner =
            hp1 <= 0
                ? 2
                : 1;


        battleTimer = setTimeout(() => {

            finishRound(
                winner
            );

        },700);


        return;
    }


    currentPlayer =
        currentPlayer === 1
            ? 2
            : 1;


    updateUI();


    battleTimer = setTimeout(() => {

        automaticTurn();

    },TURN_DELAY);
}


/* =========================
   CRITICAL DICE
========================= */

function criticalRollDice(
    rollingPlayer
){

    if(!gameStarted ||
       battleFinished ||
       roundFinished) return;


    let elapsed = 0;


    criticalText.classList.add(
        "visible"
    );


    damageText.textContent =
        "КРИТИЧЕСКИЙ БРОСОК...";


    /*
       Показываем анимацию нового
       набора костей.
    */

    diceTimer = setInterval(() => {

        if(!gameStarted ||
           battleFinished ||
           roundFinished){

            clearInterval(
                diceTimer
            );

            diceTimer = null;

            return;
        }


        const temp1 =
            Math.floor(Math.random()*6)+1;

        const temp2 =
            Math.floor(Math.random()*6)+1;


        drawDice(
            dice1,
            temp1
        );

        drawDice(
            dice2,
            temp2
        );


        resultNumber.textContent =
            `${temp1}${temp2}`;


        elapsed += 90;


        if(elapsed >= DICE_ANIMATION_TIME){

            clearInterval(
                diceTimer
            );

            diceTimer = null;


            /*
               ВАЖНО:
               второй бросок не может снова
               активировать крит.
            */

            finishDiceRoll(
                rollingPlayer,
                true
            );

        }

    },90);
}


/* =========================
   FINISH ROUND
========================= */

function finishRound(
    roundWinner
){

    if(
        roundFinished ||
        battleFinished
    ) return;


    roundFinished = true;

    gameStarted = false;


    previousRoundWinner =
        roundWinner;


    previousRoundLoser =
        roundWinner === 1
            ? 2
            : 1;


    if(roundWinner === 1){

        score1++;

    }else{

        score2++;

    }


    addLog(
        `🏆 Раунд ${currentRound} завершён. Победил ${getPlayerName(roundWinner)}. Счёт серии: ${score1} : ${score2}.`
    );


    updateUI();


    /*
       ПОБЕДА В СЕРИИ
    */

    if(
        score1 >= 2 ||
        score2 >= 2
    ){

        battleFinished = true;


        winnerTitle.textContent =
            `ПОБЕДИТЕЛЬ: ${getPlayerName(roundWinner)}`;


        winnerScore.textContent =
            `СЧЁТ СЕРИИ ${score1} : ${score2}`;


        nextRoundTimer = setTimeout(() => {

            winnerOverlay.classList.add(
                "visible"
            );

        },800);


        return;
    }


    currentRound++;


    /*
       РАУНД 2
       НАЧИНАЕТ ПРОИГРАВШИЙ
    */

    if(currentRound === 2){

        addLog(
            `⚔️ Следующий раунд начнётся с права неудачника — ${getPlayerName(previousRoundLoser)} начнёт первым.`
        );


        nextRoundTimer = setTimeout(() => {

            startRound(
                "loser"
            );

        },NEXT_ROUND_DELAY);


        return;
    }


    /*
       РАУНД 3
       АВТОМАТИЧЕСКАЯ ЖЕРЕБЬЁВКА
    */

    if(currentRound === 3){

        addLog(
            "🎲 Счёт 1 : 1. Начинается решающий третий раунд."
        );


        nextRoundTimer = setTimeout(() => {

            startRound(
                "autoCoin"
            );

        },NEXT_ROUND_DELAY);
    }
}
