
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPN BATTLE</title>

<style>
:root{
    --bg:#05070b;
    --panel:#0b1018;
    --panel2:#0e141e;
    --blue:#00a8ff;
    --cyan:#24d8ff;
    --text:#f3f7fb;
    --muted:#8793a3;
    --danger:#ff3d58;
    --green:#36e28c;
    --yellow:#ffd34d;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 20%, rgba(0,168,255,.08), transparent 35%),
        linear-gradient(135deg,#03050a,#07101a 50%,#03050a);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font-family:inherit;
}

.page{
    width:100%;
    height:100vh;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.header{
    min-height:58px;
    background:linear-gradient(135deg,#0b111b,#101925);
    border:1px solid rgba(0,168,255,.22);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 16px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:var(--cyan);
}

.header-center{
    text-align:center;
}

.round-title{
    font-size:12px;
    color:var(--muted);
    font-weight:800;
    letter-spacing:1px;
}

.score{
    font-size:23px;
    font-weight:900;
    color:var(--cyan);
    line-height:24px;
}

.status{
    min-width:150px;
    text-align:right;
    font-size:12px;
    color:var(--green);
    font-weight:900;
    letter-spacing:.8px;
}

.coin-panel{
    min-height:54px;
    background:var(--panel);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.coin-button{
    border:1px solid rgba(0,168,255,.45);
    background:linear-gradient(135deg,#087cb5,#00a8ff);
    color:white;
    font-weight:900;
    padding:10px 20px;
    border-radius:9px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 5px 18px rgba(0,168,255,.18);
}

.coin-button:hover:not(:disabled){
    transform:translateY(-1px);
    filter:brightness(1.12);
}

.coin-button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.coin-result{
    min-width:170px;
    text-align:center;
    font-size:13px;
    font-weight:900;
    color:var(--yellow);
    letter-spacing:1px;
}

.battle{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(240px,1fr) minmax(300px,1.15fr) minmax(240px,1fr);
    gap:10px;
}

.player-card,
.arena{
    min-height:0;
    background:linear-gradient(160deg,#0b1018,#080d14);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;
    overflow:hidden;
}

.player-card{
    display:flex;
    flex-direction:column;
    padding:14px;
    position:relative;
}

.player-card.active{
    border-color:rgba(0,168,255,.6);
    box-shadow:0 0 28px rgba(0,168,255,.12);
}

.player-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.player-number{
    font-size:12px;
    color:var(--muted);
    font-weight:900;
    letter-spacing:1px;
}

.player-name{
    font-size:23px;
    font-weight:900;
    margin-bottom:4px;
}

.class-name{
    font-size:12px;
    color:var(--cyan);
    font-weight:800;
    margin-bottom:18px;
}

.hp-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
}

.hp-label{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
}

.hp-value{
    font-size:18px;
    font-weight:900;
}

.hp-bar{
    height:13px;
    background:#1b222c;
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.05);
}

.hp-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#20d27b,#63f1ad);
    transition:width .35s ease;
}

.turn-label,
.stun-label{
    margin-top:auto;
    min-height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:7px;
    font-size:11px;
    font-weight:900;
    letter-spacing:.7px;
}

.turn-label{
    background:rgba(0,168,255,.08);
    color:#6b7a8b;
}

.player-card.active .turn-label{
    background:rgba(0,168,255,.16);
    color:var(--cyan);
}

.stun-label{
    margin-top:7px;
    background:rgba(255,211,77,.08);
    color:#69717d;
}

.stun-label.visible{
    color:var(--yellow);
    background:rgba(255,211,77,.14);
}

.arena{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:12px;
}

.arena-turn{
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:900;
    color:var(--cyan);
    letter-spacing:1px;
    text-align:center;
}

.dice-area{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-top:4px;
}

.dice{
    width:74px;
    height:74px;
    background:#fff;
    border-radius:13px;
    box-shadow:
        0 7px 22px rgba(0,0,0,.4),
        inset 0 0 0 2px rgba(0,0,0,.08);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:10px;
}

.dot{
    width:12px;
    height:12px;
    background:#090b0f;
    border-radius:50%;
    align-self:center;
    justify-self:center;
}

.pos1{grid-area:1/1}
.pos2{grid-area:1/2}
.pos3{grid-area:1/3}
.pos4{grid-area:2/1}
.pos5{grid-area:2/2}
.pos6{grid-area:2/3}
.pos7{grid-area:3/1}
.pos8{grid-area:3/2}
.pos9{grid-area:3/3}

.result-number{
    margin-top:8px;
    height:42px;
    font-size:38px;
    line-height:42px;
    font-weight:1000;
    color:white;
    text-shadow:0 0 20px rgba(0,168,255,.25);
}

.damage-text{
    height:25px;
    color:var(--danger);
    font-size:13px;
    font-weight:900;
}

.log{
    width:100%;
    flex:1;
    min-height:80px;
    margin-top:8px;
    background:#060a10;
    border:1px solid rgba(255,255,255,.06);
    border-radius:9px;
    padding:7px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.log-entry{
    font-size:10px;
    line-height:13px;
    color:#aeb8c5;
    padding:4px 6px;
    border-left:2px solid rgba(0,168,255,.45);
    background:rgba(255,255,255,.015);
}

.controls{
    position:absolute;
    bottom:12px;
    left:14px;
    right:14px;
}

.kick-button{
    width:100%;
    padding:8px;
    border-radius:7px;
    border:1px solid rgba(255,61,88,.3);
    background:rgba(255,61,88,.07);
    color:#ff6b7d;
    font-size:10px;
    font-weight:900;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.overlay.visible{
    opacity:1;
    pointer-events:auto;
}

.winner-box{
    width:min(430px,90vw);
    background:linear-gradient(145deg,#0b121d,#101a27);
    border:1px solid rgba(0,168,255,.35);
    border-radius:16px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.winner-title{
    font-size:27px;
    font-weight:1000;
    margin-bottom:8px;
}

.winner-score{
    color:var(--cyan);
    font-size:20px;
    font-weight:900;
    margin-bottom:20px;
}

.restart{
    border:0;
    border-radius:9px;
    padding:11px 25px;
    background:linear-gradient(135deg,#087cb5,#00a8ff);
    color:white;
    font-weight:900;
    cursor:pointer;
}

@media (orientation:portrait){
    html,body{
        overflow:auto;
    }

    .page{
        height:auto;
        min-height:100vh;
    }

    .battle{
        grid-template-columns:1fr;
    }

    .arena{
        min-height:400px;
    }
}

@media (max-height:650px) and (orientation:landscape){
    .page{
        padding:7px;
        gap:6px;
    }

    .header{
        min-height:48px;
        padding:6px 12px;
    }

    .logo{
        font-size:20px;
    }

    .coin-panel{
        min-height:45px;
    }

    .coin-button{
        padding:7px 16px;
    }

    .player-card{
        padding:10px;
    }

    .player-name{
        font-size:19px;
    }

    .class-name{
        margin-bottom:10px;
    }

    .dice{
        width:60px;
        height:60px;
        padding:8px;
    }

    .dot{
        width:10px;
        height:10px;
    }

    .result-number{
        font-size:31px;
        height:34px;
        line-height:34px;
    }

    .log{
        min-height:55px;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="header">
        <div class="logo">SPN <span>BATTLE</span></div>

        <div class="header-center">
            <div class="round-title" id="roundTitle">РАУНД 1 / 3</div>
            <div class="score" id="score">0 : 0</div>
        </div>

        <div class="status" id="status">ОЖИДАНИЕ</div>
    </header>

    <section class="coin-panel">
        <button class="coin-button" id="coinButton">ОРЕЛ / РЕШКА</button>
        <div class="coin-result" id="coinResult">—</div>
    </section>

    <main class="battle">

        <section class="player-card" id="player1">
            <div class="player-top">
                <div class="player-number">ИГРОК 1</div>
            </div>

            <div class="player-name">ИГРОК 1</div>
            <div class="class-name">ВАРВАР</div>

            <div class="hp-row">
                <div class="hp-label">ЗДОРОВЬЕ</div>
                <div class="hp-value" id="hp1Text">1000</div>
            </div>

            <div class="hp-bar">
                <div class="hp-fill" id="hp1Bar"></div>
            </div>

            <div class="turn-label" id="turn1">НЕ В ХОДУ</div>
            <div class="stun-label" id="stun1">НЕ ОГЛУШЁН</div>

            <div class="controls">
                <button class="kick-button" onclick="kickMessage()">КИК / ЗАНЯТЬ СЛОТ</button>
            </div>
        </section>

        <section class="arena">

            <div class="arena-turn" id="arenaTurn">ОЖИДАНИЕ</div>

            <div class="dice-area">
                <div class="dice" id="dice1"></div>
                <div class="dice" id="dice2"></div>
            </div>

            <div class="result-number" id="resultNumber">—</div>
            <div class="damage-text" id="damageText">ОЖИДАНИЕ БРОСКА</div>

            <div class="log" id="log"></div>

        </section>

        <section class="player-card" id="player2">
            <div class="player-top">
                <div class="player-number">ИГРОК 2</div>
            </div>

            <div class="player-name">ИГРОК 2</div>
            <div class="class-name">ВАРВАР</div>

            <div class="hp-row">
                <div class="hp-label">ЗДОРОВЬЕ</div>
                <div class="hp-value" id="hp2Text">1000</div>
            </div>

            <div class="hp-bar">
                <div class="hp-fill" id="hp2Bar"></div>
            </div>

            <div class="turn-label" id="turn2">НЕ В ХОДУ</div>
            <div class="stun-label" id="stun2">НЕ ОГЛУШЁН</div>

            <div class="controls">
                <button class="kick-button" onclick="kickMessage()">КИК / ЗАНЯТЬ СЛОТ</button>
            </div>
        </section>

    </main>
</div>

<div class="overlay" id="winnerOverlay">
    <div class="winner-box">
        <div class="winner-title" id="winnerTitle">ПОБЕДА</div>
        <div class="winner-score" id="winnerScore">2 : 0</div>
        <button class="restart" id="winnerClose">НОВЫЙ БОЙ</button>
    </div>
</div>

<script>
const MAX_HP = 1000;
const TURN_DELAY = 900;
const DICE_ANIMATION_TIME = 550;
const NEXT_ROUND_DELAY = 1800;

let hp1 = MAX_HP;
let hp2 = MAX_HP;

let score1 = 0;
let score2 = 0;

let currentRound = 1;
let currentPlayer = 1;

let stunned1 = false;
let stunned2 = false;

let gameStarted = false;
let battleFinished = false;
let roundFinished = false;

let previousRoundWinner = null;
let previousRoundLoser = null;

let battleTimer = null;
let diceTimer = null;
let nextRoundTimer = null;
let coinTimer = null;

let audioContext = null;
let soundEnabled = true;

const coinButton = document.getElementById("coinButton");
const coinResult = document.getElementById("coinResult");

const roundTitle = document.getElementById("roundTitle");
const score = document.getElementById("score");
const status = document.getElementById("status");

const arenaTurn = document.getElementById("arenaTurn");

const hp1Text = document.getElementById("hp1Text");
const hp2Text = document.getElementById("hp2Text");

const hp1Bar = document.getElementById("hp1Bar");
const hp2Bar = document.getElementById("hp2Bar");

const player1 = document.getElementById("player1");
const player2 = document.getElementById("player2");

const turn1 = document.getElementById("turn1");
const turn2 = document.getElementById("turn2");

const stun1 = document.getElementById("stun1");
const stun2 = document.getElementById("stun2");

const dice1 = document.getElementById("dice1");
const dice2 = document.getElementById("dice2");

const resultNumber = document.getElementById("resultNumber");
const damageText = document.getElementById("damageText");

const log = document.getElementById("log");

const winnerOverlay = document.getElementById("winnerOverlay");
const winnerTitle = document.getElementById("winnerTitle");
const winnerScore = document.getElementById("winnerScore");
const winnerClose = document.getElementById("winnerClose");

const dicePatterns = {
    1:[5],
    2:[1,9],
    3:[1,5,9],
    4:[1,3,7,9],
    5:[1,3,5,7,9],
    6:[1,3,4,6,7,9]
};

function drawDice(element, number){
    element.innerHTML = "";

    if(!number) return;

    dicePatterns[number].forEach(position=>{
        const dot = document.createElement("span");
        dot.className = `dot pos${position}`;
        element.appendChild(dot);
    });
}

function initAudio(){
    if(!soundEnabled) return;

    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}

function playClick(frequency=520,duration=.045,volume=.035){
    if(!soundEnabled) return;

    initAudio();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = frequency;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(volume,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
}

function playButtonSound(){
    playClick(520,.045,.035);
}

function playHoverSound(){
    playClick(720,.025,.012);
}

function playScreenshotSound(){
    if(!soundEnabled) return;

    initAudio();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(650,audioContext.currentTime);
    oscillator.frequency.linearRampToValueAtTime(
        950,
        audioContext.currentTime + .12
    );

    gain.gain.setValueAtTime(.025,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .14
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .14);
}

function playOpenSound(){
    if(!soundEnabled) return;

    initAudio();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(420,audioContext.currentTime);
    oscillator.frequency.linearRampToValueAtTime(
        760,
        audioContext.currentTime + .15
    );

    gain.gain.setValueAtTime(.025,audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .18
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .18);
}

function playCloseSound(){
    playClick(330,.06,.025);
}

function addLog(message){
    const entry = document.createElement("div");
    entry.className = "log-entry";
    entry.textContent = message;

    log.prepend(entry);

    while(log.children.length > 9){
        log.removeChild(log.lastChild);
    }
}

function clearTimers(){
    clearTimeout(battleTimer);
    clearTimeout(diceTimer);
    clearTimeout(nextRoundTimer);
    clearInterval(coinTimer);

    battleTimer = null;
    diceTimer = null;
    nextRoundTimer = null;
    coinTimer = null;
}

function updateUI(){
    hp1Text.textContent = Math.max(0,hp1);
    hp2Text.textContent = Math.max(0,hp2);

    hp1Bar.style.width = `${Math.max(0,hp1 / MAX_HP * 100)}%`;
    hp2Bar.style.width = `${Math.max(0,hp2 / MAX_HP * 100)}%`;

    score.textContent = `${score1} : ${score2}`;
    roundTitle.textContent = `РАУНД ${currentRound} / 3`;

    player1.classList.toggle(
        "active",
        gameStarted && currentPlayer === 1
    );

    player2.classList.toggle(
        "active",
        gameStarted && currentPlayer === 2
    );

    turn1.textContent =
        gameStarted && currentPlayer === 1
        ? "ХОД ИГРОКА 1"
        : "НЕ В ХОДУ";

    turn2.textContent =
        gameStarted && currentPlayer === 2
        ? "ХОД ИГРОКА 2"
        : "НЕ В ХОДУ";

    stun1.textContent = stunned1 ? "ОГЛУШЁН • ХОД ПРОПУСКАЕТ" : "НЕ ОГЛУШЁН";
    stun2.textContent = stunned2 ? "ОГЛУШЁН • ХОД ПРОПУСКАЕТ" : "НЕ ОГЛУШЁН";

    stun1.classList.toggle("visible",stunned1);
    stun2.classList.toggle("visible",stunned2);

    if(gameStarted){
        status.textContent = `ХОД ИГРОКА ${currentPlayer}`;
        arenaTurn.textContent = `ХОД ИГРОКА ${currentPlayer}`;
    }
}

function resetRoundState(){
    hp1 = MAX_HP;
    hp2 = MAX_HP;

    stunned1 = false;
    stunned2 = false;

    gameStarted = false;
    roundFinished = false;

    currentPlayer = 1;

    drawDice(dice1,0);
    drawDice(dice2,0);

    resultNumber.textContent = "—";
    damageText.textContent = "ОЖИДАНИЕ БРОСКА";
}

function startRound(mode="manual"){
    clearTimers();

    resetRoundState();

    updateUI();

    addLog(`⚔️ Начинается раунд ${currentRound}. HP восстановлены до 1000.`);

    if(mode === "manual"){
        coinButton.disabled = false;
        coinResult.textContent = "—";

        status.textContent = "ОЖИДАНИЕ";
        arenaTurn.textContent = "ОЖИДАНИЕ";

        addLog("🪙 Выберите ОРЕЛ / РЕШКА, чтобы определить первого игрока.");
        return;
    }

    if(mode === "loser"){
        coinButton.disabled = true;

        currentPlayer = previousRoundLoser;

        coinResult.textContent = "ПРАВО НЕУДАЧНИКА";

        gameStarted = true;

        status.textContent = `ХОД ИГРОКА ${currentPlayer}`;
        arenaTurn.textContent = `ХОД ИГРОКА ${currentPlayer}`;

        addLog(
            `⚔️ Право неудачника: игрок ${currentPlayer} проиграл прошлый раунд и начинает этот раунд.`
        );

        updateUI();

        battleTimer = setTimeout(()=>{
            automaticTurn();
        },TURN_DELAY);

        return;
    }

    if(mode === "autoCoin"){
        coinButton.disabled = true;

        coinResult.textContent = "КРУТИМ...";
        status.textContent = "ЖЕРЕБЬЁВКА";
        arenaTurn.textContent = "ЖЕРЕБЬЁВКА";

        addLog("🎲 Решающий раунд: автоматическая жеребьёвка определяет первого игрока.");

        runAutomaticCoinToss();

        return;
    }
}

function determineFirstPlayer(){
    if(gameStarted || battleFinished || roundFinished) return;
    if(currentRound !== 1) return;

    initAudio();
    playButtonSound();

    const result = Math.random() < .5 ? "ОРЕЛ" : "РЕШКА";

    currentPlayer = result === "ОРЕЛ" ? 1 : 2;

    coinResult.textContent = result;

    gameStarted = true;

    coinButton.disabled = true;

    status.textContent = `ХОД ИГРОКА ${currentPlayer}`;
    arenaTurn.textContent = `ХОД ИГРОКА ${currentPlayer}`;

    addLog(
        `🪙 Выпало ${result}. Игрок ${currentPlayer} получает право первого броска.`
    );

    updateUI();

    battleTimer = setTimeout(()=>{
        automaticTurn();
    },TURN_DELAY);
}

function runAutomaticCoinToss(){
    let flips = 0;
    const totalFlips = 12;

    coinTimer = setInterval(()=>{
        const visualResult = flips % 2 === 0 ? "ОРЕЛ" : "РЕШКА";

        coinResult.textContent = visualResult;

        playClick(
            visualResult === "ОРЕЛ" ? 620 : 470,
            .035,
            .018
        );

        flips++;

        if(flips >= totalFlips){
            clearInterval(coinTimer);
            coinTimer = null;

            const result = Math.random() < .5 ? "ОРЕЛ" : "РЕШКА";

            currentPlayer = result === "ОРЕЛ" ? 1 : 2;

            coinResult.textContent = result;

            gameStarted = true;

            status.textContent = `ХОД ИГРОКА ${currentPlayer}`;
            arenaTurn.textContent = `ХОД ИГРОКА ${currentPlayer}`;

            playOpenSound();

            addLog(
                `🎲 Автоматическая жеребьёвка: выпало ${result}. Игрок ${currentPlayer} начинает решающий раунд.`
            );

            updateUI();

            battleTimer = setTimeout(()=>{
                automaticTurn();
            },TURN_DELAY);
        }
    },120);
}

function automaticTurn(){
    if(!gameStarted || battleFinished || roundFinished) return;

    const stunned =
        currentPlayer === 1
        ? stunned1
        : stunned2;

    if(stunned){
        addLog(
            `💫 Игрок ${currentPlayer} оглушён и пропускает ход.`
        );

        if(currentPlayer === 1){
            stunned1 = false;
        }else{
            stunned2 = false;
        }

        updateUI();

        battleTimer = setTimeout(()=>{
            currentPlayer = currentPlayer === 1 ? 2 : 1;

            updateUI();

            battleTimer = setTimeout(()=>{
                automaticTurn();
            },450);

        },650);

        return;
    }

    rollDiceAutomatically();
}

function rollDiceAutomatically(){
    if(!gameStarted || battleFinished || roundFinished) return;

    const rollingPlayer = currentPlayer;

    let elapsed = 0;

    diceTimer = setInterval(()=>{
        if(!gameStarted || battleFinished || roundFinished){
            clearInterval(diceTimer);
            diceTimer = null;
            return;
        }

        const temp1 = Math.floor(Math.random()*6)+1;
        const temp2 = Math.floor(Math.random()*6)+1;

        drawDice(dice1,temp1);
        drawDice(dice2,temp2);

        resultNumber.textContent = `${temp1}${temp2}`;

        elapsed += 90;

        if(elapsed >= DICE_ANIMATION_TIME){
            clearInterval(diceTimer);
            diceTimer = null;

            finishDiceRoll(rollingPlayer);
        }
    },90);
}

function finishDiceRoll(rollingPlayer){
    if(!gameStarted || battleFinished || roundFinished) return;

    const die1 = Math.floor(Math.random()*6)+1;
    const die2 = Math.floor(Math.random()*6)+1;

    drawDice(dice1,die1);
    drawDice(dice2,die2);

    const result = die1 * 10 + die2;

    resultNumber.textContent = result;
    damageText.textContent = `УРОН: ${result}`;

    playClick(560,.06,.03);

    const targetPlayer = rollingPlayer === 1 ? 2 : 1;

    if(targetPlayer === 1){
        hp1 = Math.max(0,hp1 - result);
    }else{
        hp2 = Math.max(0,hp2 - result);
    }

    addLog(
        `Игрок ${rollingPlayer} выбросил ${result} и нанёс ${result} урона игроку ${targetPlayer}.`
    );

    const isDouble = die1 === die2;

    if(isDouble){
        if(targetPlayer === 1){
            stunned1 = true;
        }else{
            stunned2 = true;
        }

        addLog(
            `🔥 ДУБЛЬ ${result}! Варвар оглушил игрока ${targetPlayer}. Следующий ход игрока ${targetPlayer} будет пропущен.`
        );
    }

    updateUI();

    if(hp1 <= 0 || hp2 <= 0){
        const winner = hp1 <= 0 ? 2 : 1;

        battleTimer = setTimeout(()=>{
            finishRound(winner);
        },700);

        return;
    }

    currentPlayer = currentPlayer === 1 ? 2 : 1;

    updateUI();

    battleTimer = setTimeout(()=>{
        automaticTurn();
    },TURN_DELAY);
}

function finishRound(roundWinner){
    if(roundFinished || battleFinished) return;

    roundFinished = true;
    gameStarted = false;

    previousRoundWinner = roundWinner;
    previousRoundLoser = roundWinner === 1 ? 2 : 1;

    if(roundWinner === 1){
        score1++;
    }else{
        score2++;
    }

    addLog(
        `🏆 Раунд ${currentRound} завершён. Победил игрок ${roundWinner}. Счёт серии: ${score1} : ${score2}.`
    );

    updateUI();

    if(score1 >= 2 || score2 >= 2){
        battleFinished = true;

        winnerTitle.textContent = `ПОБЕДИТЕЛЬ: ИГРОК ${roundWinner}`;
        winnerScore.textContent = `СЧЁТ СЕРИИ ${score1} : ${score2}`;

        nextRoundTimer = setTimeout(()=>{
            winnerOverlay.classList.add("visible");
        },800);

        return;
    }

    currentRound++;

    if(currentRound === 2){
        addLog(
            `⚔️ Следующий раунд начнётся с права неудачника — игрок ${previousRoundLoser} начинает первым.`
        );

        nextRoundTimer = setTimeout(()=>{
            startRound("loser");
        },NEXT_ROUND_DELAY);

        return;
    }

    if(currentRound === 3){
        addLog(
            "🎲 Счёт 1 : 1. Начинается решающий третий раунд с автоматической жеребьёвкой."
        );

        nextRoundTimer = setTimeout(()=>{
            startRound("autoCoin");
        },NEXT_ROUND_DELAY);
    }
}

function restartGame(){
    clearTimers();

    winnerOverlay.classList.remove("visible");

    score1 = 0;
    score2 = 0;

    currentRound = 1;
    currentPlayer = 1;

    previousRoundWinner = null;
    previousRoundLoser = null;

    gameStarted = false;
    battleFinished = false;
    roundFinished = false;

    log.innerHTML = "";

    coinButton.disabled = false;
    coinResult.textContent = "—";

    status.textContent = "ОЖИДАНИЕ";
    arenaTurn.textContent = "ОЖИДАНИЕ";

    startRound("manual");
}

function kickMessage(){
    initAudio();
    playButtonSound();

    alert(
        "Хотите кикнуть команду и занять этот слот?\n\nОбращайтесь в ТГ @VankKingX\nЦена слота: 100 рублей."
    );
}

coinButton.addEventListener("click",determineFirstPlayer);

winnerClose.addEventListener("click",()=>{
    playCloseSound();
    restartGame();
});

coinButton.addEventListener("mouseenter",()=>{
    if(!coinButton.disabled){
        playHoverSound();
    }
});

startRound("manual");
</script>
