<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дуэль Классов: Битва на Кубиках</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --success-hover: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .game-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        @media (min-width: 768px) {
            .game-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }
        .btn-success:hover {
            background-color: var(--success-hover);
        }
        
        .btn-success:disabled, .btn-primary:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .log-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            height: 320px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-box {
            margin-top: 15px;
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .health-bar-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
            margin-top: 5px;
        }

        .health-bar {
            height: 100%;
            background-color: var(--success);
            width: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <h1>Дуэль Классов</h1>
    <div class="subtitle">Тактическая пошаговая игра на двузначных кубиках (11–66)</div>

    <div class="game-container">
        <!-- Левая колонка: Настройки и Управление -->
        <div class="panel">
            <h2>Настройки боя</h2>
            <div class="form-group">
                <label for="p1-class">Боец 1 (Игрок):</label>
                <select id="p1-class"></select>
            </div>
            <div class="form-group">
                <label for="p2-class">Боец 2 (ИИ / Соперник):</label>
                <select id="p2-class"></select>
            </div>
            
            <button class="btn-primary" id="btn-start" onclick="startBattle()">Начать новую битву</button>
            <button class="btn-success" id="btn-turn" onclick="makeTurn()" disabled>Сделать ход</button>

            <div class="status-box">
                <div class="stats-grid">
                    <span id="p1-name-ui">Игрок 1</span>
                    <span id="p1-hp-text">Здоровье: 1000 / 1000</span>
                </div>
                <div class="health-bar-container">
                    <div class="health-bar" id="p1-hp-bar"></div>
                </div>
            </div>

            <div class="status-box" style="margin-top: 10px;">
                <div class="stats-grid">
                    <span id="p2-name-ui">Игрок 2</span>
                    <span id="p2-hp-text">Здоровье: 1000 / 1000</span>
                </div>
                <div class="health-bar-container">
                    <div class="health-bar" id="p2-hp-bar" style="background-color: #ef4444;"></div>
                </div>
            </div>
        </div>

        <!-- Правая колонка: Лог сражения -->
        <div class="panel">
            <h2>Ход сражения</h2>
            <div class="log-box" id="log-box">
                <span style="color: #fbbf24;">⚡ Выберите бойцов и нажмите «Начать новую битву».</span>
            </div>
        </div>
    </div>

    <script>
        const classesData = {
            warrior: { name: "⚔️ Воин", hp: 1200, def: 5 },
            mage: { name: "🔮 Архимаг", hp: 900, def: 2 },
            rogue: { name: "🗡️ Разбойник", hp: 1000, def: 3 },
            paladin: { name: "🛡️ Паладин", hp: 1300, def: 6 },
            necromancer: { name: "💀 Нежить", hp: 950, def: 2 },
            druid: { name: "🌿 Друид", hp: 1100, def: 4 }
        };

        let p1, p2, turnNumber;
        let isGameOver = false;

        function initSelects() {
            const p1Select = document.getElementById('p1-class');
            const p2Select = document.getElementById('p2-class');
            p1Select.innerHTML = '';
            p2Select.innerHTML = '';

            for (let key in classesData) {
                p1Select.innerHTML += `<option value="${key}">${classesData[key].name}</option>`;
                p2Select.innerHTML += `<option value="${key}">${classesData[key].name}</option>`;
            }
            if (p2Select.options.length > 1) p2Select.selectedIndex = 1;
        }

        function rollDice() {
            const tens = [1, 2, 3, 4, 5, 6][Math.floor(Math.random() * 6)];
            const units = [1, 2, 3, 4, 5, 6][Math.floor(Math.random() * 6)];
            return tens * 10 + units;
        }

        function startBattle() {
            const c1Key = document.getElementById('p1-class').value;
            const c2Key = document.getElementById('p2-class').value;

            p1 = { key: c1Key, name: classesData[c1Key].name, maxHp: classesData[c1Key].hp, hp: classesData[c1Key].hp, def: classesData[c1Key].def, effects: {} };
            p2 = { key: c2Key, name: classesData[c2Key].name, maxHp: classesData[c2Key].hp, hp: classesData[c2Key].hp, def: classesData[c2Key].def, effects: {} };
            
            turnNumber = 1;
            isGameOver = false;

            document.getElementById('log-box').innerHTML = `<span style="color: #38bdf8;">🏁 Битва началась между ${p1.name} и ${p2.name}!</span>`;
            
            updateUI();
            document.getElementById('btn-turn').disabled = false;
        }

        function executeRound(attacker, defender) {
            if (isGameOver) return;

            let logHtml = document.getElementById('log-box').innerHTML;
            logHtml += `<br><b>--- Ход ${turnNumber}: ${attacker.name} атакует ---</b>`;

            // Пассивки и эффекты начала хода
            if (attacker.key === 'necromancer' && attacker.hp < attacker.maxHp) {
                let heal = 30;
                attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
                logHtml += `<br>💀 Нежить регенерирует ${heal} HP за счет темных сил.`;
            }

            const roll = rollDice();
            logHtml += `<br>🎲 Бросок кубика: <b>[${roll}]</b>`;

            let baseDmg = roll + attacker.def - defender.def;
            if (baseDmg < 5) baseDmg = 5;

            // Уникальные механики классов
            if (attacker.key === 'warrior' && roll >= 55) {
                baseDmg *= 1.5;
                logHtml += `<br>💥 Воин совершает сокрушительный удар! Урон увеличен!`;
            } else if (attacker.key === 'rogue' && roll % 2 !== 0) {
                baseDmg *= 1.35;
                logHtml += `<br>🗡️ Разбойник наносит критический удар в тень!`;
            } else if (attacker.key === 'paladin' && roll >= 60) {
                let heal = 40;
                attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);
                logHtml += `<br>🛡️ Паладин укрыт божественным светом и восстанавливает ${heal} HP!`;
            }

            defender.hp -= Math.floor(baseDmg);
            logHtml += `<br>⚔️ ${defender.name} получает урона: <b>${Math.floor(baseDmg)}</b>`;

            if (defender.hp <= 0) {
                defender.hp = 0;
                isGameOver = true;
                logHtml += `<br><span style="color: #22c55e; font-size: 1.1rem;">🏆 Победил ${attacker.name}!</span>`;
                document.getElementById('btn-turn').disabled = true;
            }

            turnNumber++;
            document.getElementById('log-box').innerHTML = logHtml;
            updateUI();
            
            const box = document.getElementById('log-box');
            box.scrollTop = box.scrollHeight;
        }

        function makeTurn() {
            if (isGameOver) return;
            // Ход игрока
            executeRound(p1, p2);
            if (isGameOver) return;
            
            // Ответный ход ИИ с небольшой задержкой для реалистичности
            setTimeout(() => {
                executeRound(p2, p1);
            }, 400);
        }

        function updateUI() {
            document.getElementById('p1-name-ui').innerText = p1.name;
            document.getElementById('p1-hp-text').innerText = `Здоровье: ${p1.hp} / ${p1.maxHp}`;
            document.getElementById('p1-hp-bar').style.width = Math.max(0, (p1.hp / p1.maxHp) * 100) + '%';

            document.getElementById('p2-name-ui').innerText = p2.name;
            document.getElementById('p2-hp-text').innerText = `Здоровье: ${p2.hp} / ${p2.maxHp}`;
            document.getElementById('p2-hp-bar').style.width = Math.max(0, (p2.hp / p2.maxHp) * 100) + '%';
        }

        window.onload = initSelects;
    </script>
</body>
</html>
