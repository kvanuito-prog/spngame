<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Битва на Кубиках</title>
<style>
body {
background-color: #1a1a1a;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}

/* Игровое поле */
.game-field {
width: 600px;
height: 400px;
background-color: #2e7d32; /* Травянисто-зеленый цвет */
border: 8px solid #1b5e20;
border-radius: 20px;
display: flex;
justify-content: center;
align-items: center;
gap: 40px;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* Кубик */
.die {
width: 80px;
height: 80px;
background-color: white;
border-radius: 15px;
display: grid;
grid-template-columns: repeat(3, 1fr);
grid-template-rows: repeat(3, 1fr);
padding: 10px;
box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* Точки на кубике */
.dot {
width: 15px;
height: 15px;
background-color: black;
border-radius: 50%;
align-self: center;
justify-self: center;
}

/* Скрываем точки, если они не нужны для текущего числа */
.hidden { visibility: hidden; }
</style>
</head>
<body>

<div class="game-field">
<!— Первый кубик (число 5) —>
<div class="die" id="die1">
<div class="dot"></div><div class="dot hidden"></div><div class="dot"></div>
<div class="dot hidden"></div><div class="dot"></div><div class="dot hidden"></div>
<div class="dot"></div><div class="dot hidden"></div><div class="dot"></div>
</div>

<!— Второй кубик (число 6) —>
<div class="die" id="die2">
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
</div>
</div>

</body>
</html>
