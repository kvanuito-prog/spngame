```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SPN BATTLE</title>

<style>

:root{
    --bg:#05070b;
    --panel:#0b1018;
    --blue:#00a8ff;
    --cyan:#24d8ff;
    --text:#f3f7fb;
    --muted:#8793a3;
    --danger:#ff3d58;
    --green:#36e28c;
    --yellow:#ffd34d;
    --purple:#b66cff;
    --blood:#e83b5b;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(0,168,255,.08),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #03050a,
            #07101a 50%,
            #03050a
        );

    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   PAGE
========================= */

.page{
    width:100%;
    height:100vh;
    padding:8px;

    display:flex;
    flex-direction:column;
    gap:6px;
}


/* =========================
   HEADER
========================= */

.header{
    min-height:52px;

    background:
        linear-gradient(
            135deg,
            #0b111b,
            #101925
        );

    border:1px solid rgba(0,168,255,.22);

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:7px 15px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:var(--cyan);
}

.header-center{
    text-align:center;
}

.round-title{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
    letter-spacing:1px;
}

.score{
    font-size:22px;
    font-weight:900;
    color:var(--cyan);
    line-height:23px;
}

.status{
    min-width:190px;

    text-align:right;

    font-size:11px;

    color:var(--green);

    font-weight:900;

    letter-spacing:.7px;
}


/* =========================
   SETUP
========================= */

.names-panel{
    background:var(--panel);

    border:1px solid rgba(255,255,255,.07);

    border-radius:11px;

    padding:6px 10px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;
}

.setup-box{
    display:flex;
    align-items:center;
    gap:6px;
}

.name-input{
    width:175px;
    height:34px;

    background:#060a10;

    border:1px solid rgba(0,168,255,.25);

    border-radius:7px;

    outline:none;

    color:white;

    padding:0 10px;

    font-size:12px;
    font-weight:800;

    text-align:center;
}

.name-input:focus{
    border-color:var(--cyan);
}

.class-select{
    width:125px;
    height:34px;

    background:#060a10;

    border:1px solid rgba(0,168,255,.25);

    border-radius:7px;

    color:white;

    padding:0 7px;

    font-size:11px;
    font-weight:800;

    outline:none;
}

.start-button{
    height:34px;

    padding:0 16px;

    border:0;

    border-radius:7px;

    color:white;

    font-size:11px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #087cb5,
            #00a8ff
        );
}


/* =========================
   COIN
========================= */

.coin-panel{
    min-height:43px;

    background:var(--panel);

    border:1px solid rgba(255,255,255,.07);

    border-radius:11px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;
}

.coin-button{
    border:1px solid rgba(0,168,255,.45);

    background:
        linear-gradient(
            135deg,
            #087cb5,
            #00a8ff
        );

    color:white;

    font-weight:900;

    font-size:11px;

    padding:7px 18px;

    border-radius:8px;
}

.coin-button:disabled{
    opacity:.3;
    cursor:not-allowed;
}

.coin-result{
    min-width:220px;

    text-align:center;

    font-size:11px;

    font-weight:900;

    color:var(--yellow);

    letter-spacing:1px;
}


/* =========================
   BATTLE
========================= */

.battle{
    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
        minmax(240px,1fr)
        minmax(310px,1.15fr)
        minmax(240px,1fr);

    gap:8px;
}


/* =========================
   PLAYER CARD
========================= */

.player-card,
.arena{
    min-height:0;

    background:
        linear-gradient(
            160deg,
            #0b1018,
            #080d14
        );

    border:1px solid rgba(255,255,255,.07);

    border-radius:13px;

    overflow:hidden;
}

.player-card{
    display:flex;

    flex-direction:column;

    padding:12px;

    position:relative;
}

.player-card.active{
    border-color:
        rgba(0,168,255,.6);

    box-shadow:
        0 0 28px rgba(0,168,255,.12);
}

.player-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:5px;
}

.player-number{
    font-size:10px;

    color:var(--muted);

    font-weight:900;

    letter-spacing:1px;
}

.player-name{
    font-size:21px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.class-name{
    font-size:11px;

    color:var(--cyan);

    font-weight:900;

    margin-top:3px;

    margin-bottom:13px;
}

.class-name.assassin{
    color:var(--purple);
}

.class-name.vampire{
    color:var(--blood);
}

.hp-row{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:6px;
}

.hp-label{
    font-size:10px;

    color:var(--muted);

    font-weight:800;
}

.hp-value{
    font-size:17px;

    font-weight:900;
}

.hp-bar{
    height:12px;

    background:#1b222c;

    border-radius:20px;

    overflow:hidden;
}

.hp-fill{
    height:100%;

    width:100%;

    background:
        linear-gradient(
            90deg,
            #20d27b,
            #63f1ad
        );

    transition:width .35s ease;
}

.turn-label,
.stun-label{
    min-height:28px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:7px;

    font-size:10px;

    font-weight:900;

    letter-spacing:.5px;
}

.turn-label{
    margin-top:auto;

    background:
        rgba(0,168,255,.08);

    color:#6b7a8b;
}

.player-card.active .turn-label{
    background:
        rgba(0,168,255,.16);

    color:var(--cyan);
}

.stun-label{
    margin-top:5px;

    background:
        rgba(255,211,77,.08);

    color:#69717d;
}

.stun-label.visible{
    color:var(--yellow);

    background:
        rgba(255,211,77,.14);
}

.controls{
    margin-top:5px;
}

.kick-button{
    width:100%;

    padding:6px;

    border-radius:7px;

    border:
        1px solid rgba(255,61,88,.3);

    background:
        rgba(255,61,88,.07);

    color:#ff6b7d;

    font-size:9px;

    font-weight:900;
}


/* =========================
   ARENA
========================= */

.arena{
    display:flex;

    flex-direction:column;

    align-items:center;

    padding:9px;
}

.arena-turn{
    height:29px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

    font-weight:900;

    color:var(--cyan);

    letter-spacing:.8px;

    text-align:center;
}

.dice-area{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:17px;

    margin-top:3px;
}

.dice{
    width:70px;
    height:70px;

    background:#fff;

    border-radius:12px;

    box-shadow:
        0 7px 22px rgba(0,0,0,.4),
        inset 0 0 0 2px rgba(0,0,0,.08);

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    grid-template-rows:
        repeat(3,1fr);

    padding:9px;
}

.dot{
    width:12px;
    height:12px;

    background:#090b0f;

    border-radius:50%;

    align-self:center;

    justify-self:center;
}

.pos1{grid-area:1/1}
.pos2{grid-area:1/2}
.pos3{grid-area:1/3}
.pos4{grid-area:2/1}
.pos5{grid-area:2/2}
.pos6{grid-area:2/3}
.pos7{grid-area:3/1}
.pos8{grid-area:3/2}
.pos9{grid-area:3/3}

.result-number{
    margin-top:6px;

    height:38px;

    font-size:35px;

    line-height:38px;

    font-weight:1000;
}

.damage-text{
    height:23px;

    color:var(--danger);

    font-size:12px;

    font-weight:900;

    text-align:center;
}

.special-text{
    height:22px;

    font-size:14px;

    font-weight:1000;

    letter-spacing:1px;

    opacity:0;

    transition:.2s;

    text-align:center;
}

.special-text.visible{
    opacity:1;
}

.special-text.critical{
    color:var(--purple);

    text-shadow:
        0 0 14px rgba(182,108,255,.7);
}

.special-text.bite{
    color:var(--blood);

    text-shadow:
        0 0 14px rgba(232,59,91,.7);
}

.log{
    width:100%;

    flex:1;

    min-height:65px;

    margin-top:5px;

    background:#060a10;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:8px;

    padding:6px;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    gap:4px;
}

.log-entry{
    font-size:9px;

    line-height:12px;

    color:#aeb8c5;

    padding:3px 5px;

    border-left:
        2px solid rgba(0,168,255,.45);

    background:
        rgba(255,255,255,.015);
}


/* =========================
   WINNER
========================= */

.overlay{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:blur(8px);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.overlay.visible{
    opacity:1;

    pointer-events:auto;
}

.winner-box{
    width:min(430px,90vw);

    background:
        linear-gradient(
            145deg,
            #0b121d,
            #101a27
        );

    border:
        1px solid rgba(0,168,255,.35);

    border-radius:16px;

    padding:25px;

    text-align:center;
}

.winner-title{
    font-size:26px;

    font-weight:1000;

    margin-bottom:8px;
}

.winner-score{
    color:var(--cyan);

    font-size:20px;

    font-weight:900;

    margin-bottom:20px;
}

.restart{
    border:0;

    border-radius:9px;

    padding:11px 25px;

    background:
        linear-gradient(
            135deg,
            #087cb5,
            #00a8ff
        );

    color:white;

    font-weight:900;
}


/* =========================
   PORTRAIT
========================= */

@media (orientation:portrait){

    html,
    body{
        overflow:auto;
    }

    .page{
        height:auto;
        min-height:100vh;
    }

    .battle{
        grid-template-columns:1fr;
    }
}


/* =========================
   SMALL LANDSCAPE
========================= */

@media (max-height:650px) and (orientation:landscape){

    .page{
        padding:6px;
        gap:4px;
    }

    .header{
        min-height:43px;
        padding:5px 10px;
    }

    .logo{
        font-size:19px;
    }

    .names-panel{
        padding:4px 8px;
    }

    .name-input,
    .class-select,
    .start-button{
        height:30px;
    }

    .name-input{
        width:155px;
    }

    .class-select{
        width:112px;
    }

    .coin-panel{
        min-height:37px;
    }

    .coin-button{
        padding:6px 14px;
    }

    .player-card{
        padding:9px;
    }

    .player-name{
        font-size:18px;
    }

    .class-name{
        margin-bottom:8px;
    }

    .dice{
        width:58px;
        height:58px;
        padding:7px;
    }

    .dot{
        width:9px;
        height:9px;
    }

    .result-number{
        font-size:29px;
        height:31px;
        line-height:31px;
    }

    .log{
        min-height:50px;
    }
}

</style>
</head>


<body>


<div class="page">


<!-- HEADER -->

<header class="header">

    <div class="logo">
        SPN <span>BATTLE</span>
    </div>

    <div class="header-center">

        <div
            class="round-title"
            id="roundTitle"
        >
            РАУНД 1 / 3
        </div>

        <div
            class="score"
            id="score"
        >
            0 : 0
        </div>

    </div>

    <div
        class="status"
        id="status"
    >
        ВВЕДИТЕ НИКИ
    </div>

</header>


<!-- SETUP -->

<section
    class="names-panel"
    id="namesPanel"
>


    <div class="setup-box">

        <input
            class="name-input"
            id="name1Input"
            maxlength="20"
            placeholder="НИК ИГРОКА 1"
            autocomplete="off"
        >

        <select
            class="class-select"
            id="class1Select"
        >

            <option value="barbar">
                ВАРВАР
            </option>

            <option value="assassin">

            </option>

            <option value="vampire">
                ВАМПИР
            </option>

        </select>

    </div>


    <button
        class="start-button"
        id="startGameButton"
    >
        НАЧАТЬ БОЙ
    </button>


    <div class="setup-box">

        <input
            class="name-input"
            id="name2Input"
            maxlength="20"
            placeholder="НИК ИГРОКА 2"
            autocomplete="off"
        >

        <select
            class="class-select"
            id="class2Select"
        >

            <option value="barbar">
                ВАРВАР
            </option>

            <option value="assassin">
                АССАСИН
            </option>

            <option value="vampire">
                ВАМПИР
            </option>

        </select>

    </div>


</section>


<!-- COIN -->

<section class="coin-panel">

    <button
        class="coin-button"
        id="coinButton"

    >

    </button>

    <div
        class="coin-result"
        id="coinResult"
    >
        СНАЧАЛА ВВЕДИТЕ НИКИ
    </div>

</section>


<!-- BATTLE -->

<main class="battle">


<!-- PLAYER 1 -->

<section
    class="player-card"
    id="player1"
>

    <div class="player-top">

        <div class="player-number">
            ИГРОК 1
        </div>

    </div>


    <div
        class="player-name"
        id="player1Name"
    >
        ИГРОК 1
    </div>


    <div
        class="class-name"
        id="class1Name"
    >
        ВАРВАР
    </div>


    <div class="hp-row">

        <div class="hp-label">
            ЗДОРОВЬЕ
        </div>

        <div
            class="hp-value"
            id="hp1Text"
        >
            1000
        </div>

    </div>


    <div class="hp-bar">

        <div
            class="hp-fill"
            id="hp1Bar"
        ></div>

    </div>


    <div
        class="turn-label"
        id="turn1"
    >
        НЕ В ХОДУ
    </div>


    <div
        class="stun-label"
        id="stun1"
    >
        НЕ ОГЛУШЁН
    </div>


    <div class="controls">

        <button
            class="kick-button"
            onclick="kickMessage()"
        >
            КИК / ЗАНЯТЬ СЛОТ
        </button>

    </div>

</section>


<!-- ARENA -->

<section class="arena">


    <div
        class="arena-turn"
        id="arenaTurn"
    >
        ОЖИДАНИЕ
    </div>


    <div class="dice-area">

        <div
            class="dice"
            id="dice1"
        ></div>

        <div
            class="dice"
            id="dice2"
        ></div>

    </div>


    <div
        class="result-number"
        id="resultNumber"
    >
        —
    </div>


    <div
        class="special-text"
        id="specialText"
    >
        КРИТИЧЕСКИЙ УРОН!
    </div>


    <div
        class="damage-text"
        id="damageText"
    >
        ОЖИДАНИЕ БРОСКА
    </div>


    <div
        class="log"
        id="log"
    ></div>


</section>


<!-- PLAYER 2 -->

<section
    class="player-card"
    id="player2"
>

    <div class="player-top">

        <div class="player-number">
            ИГРОК 2
        </div>

    </div>


    <div
        class="player-name"
        id="player2Name"
    >
        ИГРОК 2
    </div>


    <div
        class="class-name"
        id="class2Name"
    >
        ВАРВАР
    </div>


    <div class="hp-row">

        <div class="hp-label">
            ЗДОРОВЬЕ
        </div>

        <div
            class="hp-value"
            id="hp2Text"
        >
            1000
        </div>

    </div>


    <div class="hp-bar">

        <div
            class="hp-fill"
            id="hp2Bar"
        ></div>

    </div>


    <div
        class="turn-label"
        id="turn2"
    >
        НЕ В ХОДУ
    </div>


    <div
        class="stun-label"
        id="stun2"
    >
        НЕ ОГЛУШЁН
    </div>


    <div class="controls">

        <button
            class="kick-button"
            onclick="kickMessage()"
        >
            КИК / ЗАНЯТЬ СЛОТ
        </button>

    </div>

</section>


</main>

</div>


<!-- WINNER -->

<div
    class="overlay"
    id="winnerOverlay"
>

    <div class="winner-box">

        <div
            class="winner-title"
            id="winnerTitle"
        >
            ПОБЕДИТЕЛЬ
        </div>

        <div
            class="winner-score"
            id="winnerScore"
        >
            2 : 0
        </div>

        <button
            class="restart"
            id="winnerClose"
        >
            НОВЫЙ БОЙ
        </button>

    </div>

</div>


<script>


/* =========================
   CONSTANTS
========================= */

const MAX_HP = 1000;

const TURN_DELAY = 900;

const DICE_ANIMATION_TIME = 550;

const NEXT_ROUND_DELAY = 1800;


/* =========================
   STATE
========================= */

let hp1 = MAX_HP;

let hp2 = MAX_HP;

let score1 = 0;

let score2 = 0;

let currentRound = 1;

let currentPlayer = 1;

let stunned1 = false;

let stunned2 = false;

let gameStarted = false;

let battleFinished = false;

let roundFinished = false;

let previousRoundWinner = null;

let previousRoundLoser = null;

let playerName1 = "ИГРОК 1";

let playerName2 = "ИГРОК 2";

let playerClass1 = "barbar";

let playerClass2 = "barbar";

let battleTimer = null;

let diceTimer = null;

let nextRoundTimer = null;

let coinTimer = null;

let audioContext = null;

let soundEnabled = true;


/* =========================
   ELEMENTS
========================= */

const namesPanel =
    document.getElementById("namesPanel");

const name1Input =
    document.getElementById("name1Input");

const name2Input =
    document.getElementById("name2Input");

const class1Select =
    document.getElementById("class1Select");

const class2Select =
    document.getElementById("class2Select");

const startGameButton =
    document.getElementById("startGameButton");

const coinButton =
    document.getElementById("coinButton");

const coinResult =
    document.getElementById("coinResult");

const roundTitle =
    document.getElementById("roundTitle");

const score =
    document.getElementById("score");

const status =
    document.getElementById("status");

const arenaTurn =
    document.getElementById("arenaTurn");

const hp1Text =
    document.getElementById("hp1Text");

const hp2Text =
    document.getElementById("hp2Text");

const hp1Bar =
    document.getElementById("hp1Bar");

const hp2Bar =
    document.getElementById("hp2Bar");

const player1 =
    document.getElementById("player1");

const player2 =
    document.getElementById("player2");

const player1Name =
    document.getElementById("player1Name");

const player2Name =
    document.getElementById("player2Name");

const class1Name =
    document.getElementById("class1Name");

const class2Name =
    document.getElementById("class2Name");

const turn1 =
    document.getElementById("turn1");

const turn2 =
    document.getElementById("turn2");

const stun1 =
    document.getElementById("stun1");

const stun2 =
    document.getElementById("stun2");

const dice1 =
    document.getElementById("dice1");

const dice2 =
    document.getElementById("dice2");

const resultNumber =
    document.getElementById("resultNumber");

const specialText =
    document.getElementById("specialText");

const damageText =
    document.getElementById("damageText");

const log =
    document.getElementById("log");

const winnerOverlay =
    document.getElementById("winnerOverlay");

const winnerTitle =
    document.getElementById("winnerTitle");

const winnerScore =
    document.getElementById("winnerScore");

const winnerClose =
    document.getElementById("winnerClose");


/* =========================
   DICE
========================= */

const dicePatterns = {

    1:[5],

    2:[1,9],

    3:[1,5,9],

    4:[1,3,7,9],

    5:[1,3,5,7,9],

    6:[1,3,4,6,7,9]

};


function drawDice(element,number){

    element.innerHTML = "";

    if(!number) return;

    dicePatterns[number].forEach(position => {

        const dot =
            document.createElement("span");

        dot.className =
            `dot pos${position}`;

        element.appendChild(dot);

    });
}

/* =========================
   SOUND
========================= */

function initAudio(){

    if(!soundEnabled) return;

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }
}


function playClick(
    frequency=520,
    duration=.045,
    volume=.035
){

    if(!soundEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.frequency.value =
        frequency;

    oscillator.type =
        "sine";

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );
}

/* =========================

========================= */

function resetRoundState(){

    hp1 = MAX_HP;

    hp2 = MAX_HP;

    stunned1 = false;

    stunned2 = false;

    gameStarted = false;

    roundFinished = false;

    currentPlayer = 1;

    );

/* =========================
   START ROUND
========================= */

function startRound(mode="manual"){

    clearTimers();

    resetRoundState();

    updateUI();


    addLog(
        `⚔️ Начинается раунд ${currentRound}. HP восстановлены до 1000.`
    );


    /* ROUND 1 */

    if(mode === "manual"){

        coinButton.disabled = false;

        coinResult.textContent =
            "ОРЕЛ / РЕШКА";

        status.textContent =
            "ВЫБЕРИТЕ ПЕРВОГО";

        arenaTurn.textContent =
            "ОЖИДАНИЕ";


        addLog(
            "🪙 Нажмите «ОРЕЛ / РЕШКА», чтобы определить первого игрока."
        );

        return;
    }


    /* ROUND 2 */

    if(mode === "loser"){

        coinButton.disabled = true;

        currentPlayer =
            previousRoundLoser;


        coinResult.textContent =
            "ПРАВО НЕУДАЧНИКА";


        status.textContent =
            `ПЕРВЫМ ХОДИТ ${getPlayerName(currentPlayer)}`;


        arenaTurn.textContent =
            "ПРАВО НЕУДАЧНИКА";


        addLog(
            `⚔️ Право неудачника: ${getPlayerName(currentPlayer)} проиграл прошлый раунд и начинает этот раунд.`
        );


        gameStarted = true;

        updateUI();


        battleTimer = setTimeout(() => {

            coinResult.textContent =
                "БОЙ ПРОДОЛЖАЕТСЯ";


            damageText.textContent =
                `Первым бросает ${getPlayerName(currentPlayer)}`;


            updateUI();


            battleTimer = setTimeout(() => {

                automaticTurn();

            },450);

        },1100);


        return;
    }


    /* ROUND 3 */

    if(mode === "autoCoin"){

        coinButton.disabled = true;

        coinResult.textContent =
            "КРУТИМ...";

        status.textContent =
            "ЖЕРЕБЬЁВКА";

        arenaTurn.textContent =
            "АВТОМАТИЧЕСКАЯ ЖЕРЕБЬЁВКА";


        addLog(
            "🎲 Счёт 1 : 1. Автоматическая жеребьёвка решит, кто начнёт третий раунд."
        );


        runAutomaticCoinToss();

    }

}


/* =========================
   ROUND 1 COIN
========================= */

function determineFirstPlayer(){

    if(
        gameStarted ||
        battleFinished ||
        roundFinished
    ) return;


    if(currentRound !== 1) return;


    initAudio();

    playButtonSound();


    const result =
        Math.random() < .5
            ? "ОРЕЛ"
            : "РЕШКА";


    currentPlayer =
        result === "ОРЕЛ"
            ? 1
            : 2;


    coinResult.textContent =
        result;


    gameStarted = true;

    coinButton.disabled = true;


    addLog(
        `🪙 Выпало ${result}. ${getPlayerName(currentPlayer)} получает право первого броска.`
    );


    updateUI();


    battleTimer = setTimeout(() => {

        automaticTurn();

    },TURN_DELAY);
}


/* =========================
   ROUND 3 COIN
========================= */

function runAutomaticCoinToss(){

    let flips = 0;

    const totalFlips = 12;


    coinTimer =
        setInterval(() => {

            const visualResult =
                flips % 2 === 0
                    ? "ОРЕЛ"
                    : "РЕШКА";


            coinResult.textContent =
                visualResult;


            playClick(
                visualResult === "ОРЕЛ"
                    ? 620
                    : 470,
                .035,
                .018
            );


            flips++;


            if(flips >= totalFlips){

                clearInterval(
                    coinTimer
                );

                coinTimer = null;


                const result =
                    Math.random() < .5
                        ? "ОРЕЛ"
                        : "РЕШКА";


                currentPlayer =
                    result === "ОРЕЛ"
                        ? 1
                        : 2;


                coinResult.textContent =
                    result;


                gameStarted = true;


                playOpenSound();


                addLog(
                    `🎲 Автоматическая жеребьёвка: выпало ${result}. ${getPlayerName(currentPlayer)} начинает решающий раунд.`
                );


                updateUI();


                battleTimer = setTimeout(() => {

                    automaticTurn();

                },TURN_DELAY);

            }

        },120);
}


/* =========================
   AUTOMATIC TURN
========================= */

function automaticTurn(){

    if(
        !gameStarted ||
        battleFinished ||
        roundFinished
    ) return;


    const stunned =
        currentPlayer === 1
            ? stunned1
            : stunned2;


    if(stunned){

        addLog(
            `💫 ${getPlayerName(currentPlayer)} оглушён и пропускает ход.`
        );


        if(currentPlayer === 1){

            stunned1 = false;

        }else{

            stunned2 = false;

        }


        updateUI();


        battleTimer = setTimeout(() => {

            currentPlayer =
                currentPlayer === 1
                    ? 2
                    : 1;


            updateUI();


            battleTimer = setTimeout(() => {

                automaticTurn();

            },450);

        },650);


        return;
    }


    rollDiceAutomatically();
}


/* =========================
   NORMAL DICE ANIMATION
========================= */

function rollDiceAutomatically(){

    if(
        !gameStarted ||
        battleFinished ||
        roundFinished
    ) return;


    const rollingPlayer =
        currentPlayer;


    let elapsed = 0;


    diceTimer =
        setInterval(() => {

            if(
                !gameStarted ||
                battleFinished ||
                roundFinished
            ){

                clearInterval(
                    diceTimer
                );

                diceTimer = null;

                return;
            }


            const temp1 =
                Math.floor(
                    Math.random()*6
                ) + 1;


            const temp2 =
                Math.floor(
                    Math.random()*6
                ) + 1;


            drawDice(
                dice1,
                temp1
            );


            drawDice(
                dice2,
                temp2
            );


            resultNumber.textContent =
                `${temp1}${temp2}`;


            elapsed += 90;


            if(
                elapsed >=
                DICE_ANIMATION_TIME
            ){

                clearInterval(
                    diceTimer
                );

                diceTimer = null;


                finishDiceRoll(
                    rollingPlayer,
                    "normal"
                );

            }

        },90);
}


/* =========================
   FINISH DICE ROLL
========================= */

function finishDiceRoll(
    rollingPlayer,
    rollType
){

    if(
        !gameStarted ||
        battleFinished ||
        roundFinished
    ) return;


    const die1 =
        Math.floor(
            Math.random()*6
        ) + 1;


    const die2 =
        Math.floor(
            Math.random()*6
        ) + 1;


    drawDice(
        dice1,
        die1
    );


    drawDice(
        dice2,
        die2
    );


    const result =
        die1 * 10 + die2;


    resultNumber.textContent =
        result;


    const isDouble =
        die1 === die2;


    /*
       =========================
       АССАСИН
       =========================

       Дубль не наносит урон.

       Вместо этого появляется крит,
       после чего идёт дополнительный
       бросок ×2.
    */

    if(
        rollType === "normal" &&
        isDouble &&
        getPlayerClass(rollingPlayer) === "assassin"
    ){

        specialText.textContent =
            "⚡ КРИТИЧЕСКИЙ УРОН!";

        specialText.className =
            "special-text critical visible";


        damageText.textContent =
            "КРИТ! НОВЫЙ БРОСОК ×2";


        playCriticalSound();


        addLog(
            `⚡ КРИТИЧЕСКИЙ УРОН! ${getPlayerName(rollingPlayer)} выбросил дубль ${result}. Обычный урон отменён. Следующий бросок будет ×2.`
        );


        updateUI();


        battleTimer =
            setTimeout(() => {

                criticalRollDice(
                    rollingPlayer
                );

            },750);


        return;
    }


    /*
       =========================
       ВАМПИР
       =========================

       Дубль не наносит обычный урон.

       Вместо этого активируется УКУС.
    */

    if(
        rollType === "normal" &&
        isDouble &&
        getPlayerClass(rollingPlayer) === "vampire"
    ){

        specialText.textContent =
            "🩸 УКУС!";

        specialText.className =
            "special-text bite visible";


        damageText.textContent =
            "УКУС! НОВЫЙ БРОСОК";


        playBiteSound();


        addLog(
            `🩸 УКУС! ${getPlayerName(rollingPlayer)} выбросил дубль ${result}. Дубль не наносит урон. Вампир получает новый бросок.`
        );


        updateUI();


        battleTimer =
            setTimeout(() => {

                vampireBiteRollDice(
                    rollingPlayer
                );

            },750);


        return;
    }


    /*
       =========================
       УРОН
       =========================
    */

    let damage =
        result;


    /*
       КРИТИЧЕСКИЙ БРОСОК АССАСИНА
    */

    if(
        rollType === "critical"
    ){

        damage =
            result * 2;


        addLog(
            `💥 КРИТИЧЕСКИЙ БРОСОК: ${result} × 2 = ${damage} урона!`
        );


        damageText.textContent =
            `КРИТ: ${result} × 2 = ${damage}`;


        playClick(
            780,
            .06,
            .03
        );

    }


    /*
       УКУС ВАМПИРА
    */

    if(
        rollType === "vampire"
    ){

        damage =
            result;


        damageText.textContent =
            `УКУС: ${damage} УРОНА / +${damage} HP`;


        playBiteSound();


        addLog(
            `🩸 УКУС: ${getPlayerName(rollingPlayer)} выбросил ${result} и наносит ${damage} урона, восстанавливая себе ${damage} HP.`
        );

    }


    /*
       Обычный бросок
    */

    if(
        rollType === "normal"
    ){

        damageText.textContent =
            `УРОН: ${damage}`;


        playClick(
            560,
            .06,
            .03
        );

    }


    const targetPlayer =
        rollingPlayer === 1
            ? 2
            : 1;


    /*
       Наносим урон противнику
    */

    if(targetPlayer === 1){

        hp1 =
            Math.max(
                0,
                hp1 - damage
            );

    }else{

        hp2 =
            Math.max(
                0,
                hp2 - damage
            );

    }


    /*
       Вампир восстанавливает
       столько же HP, сколько
       нанёс урона.
    */

    if(
        rollType === "vampire"
    ){

        if(rollingPlayer === 1){

            const oldHp =
                hp1;

            hp1 =
                Math.min(
                    MAX_HP,
                    hp1 + damage
                );

            const healed =
                hp1 - oldHp;


            addLog(
                `❤️‍🩹 ${getPlayerName(rollingPlayer)} восстановил ${healed} HP.`
            );

        }else{

            const oldHp =
                hp2;

            hp2 =
                Math.min(
                    MAX_HP,
                    hp2 + damage
                );

            const healed =
                hp2 - oldHp;


            addLog(
                `❤️‍🩹 ${getPlayerName(rollingPlayer)} восстановил ${healed} HP.`
            );

        }

    }


    /*
       Обычный лог
    */

    if(
        rollType !== "vampire" &&
        rollType !== "critical"
    ){

        addLog(
            `${getPlayerName(rollingPlayer)} выбросил ${result} и нанёс ${damage} урона ${getPlayerName(targetPlayer)}.`
        );

    }


    /*
       Критический лог
    */

    if(
        rollType === "critical"
    ){

        addLog(
            `${getPlayerName(rollingPlayer)} нанёс ${damage} урона ${getPlayerName(targetPlayer)}.`
        );

    }


    /*
       ВАМПИР:
       дополнительный бросок не может
       снова активировать укус.
    */

    /*
       ВАРВАР:
       дубль наносит обычный урон
       и оглушает.
    */

    if(
        rollType === "normal" &&
        isDouble &&
        getPlayerClass(rollingPlayer) === "barbar"
    ){

        if(targetPlayer === 1){

            stunned1 = true;

        }else{

            stunned2 = true;

        }


        addLog(
            `🔥 ДУБЛЬ ${result}! ${getPlayerName(rollingPlayer)} оглушил ${getPlayerName(targetPlayer)}. Следующий ход будет пропущен.`
        );

    }


    /*
       Убираем специальную надпись
    */

    specialText.classList.remove(
        "visible",
        "critical",
        "bite"
    );


    updateUI();


    /*
       Проверка смерти
    */

    if(
        hp1 <= 0 ||
        hp2 <= 0
    ){

        const winner =
            hp1 <= 0
                ? 2
                : 1;


        battleTimer =
            setTimeout(() => {

                finishRound(
                    winner
                );

            },700);


        return;
    }


    /*
       Следующий игрок
    */

    currentPlayer =
        currentPlayer === 1
            ? 2
            : 1;


    updateUI();


    battleTimer =
        setTimeout(() => {

            automaticTurn();

        },TURN_DELAY);
}

            ){

                clearInterval(
                    diceTimer
                );

                diceTimer = null;


                /*
                   Передаём "vampire".
                   Поэтому даже если здесь
                   выпадет дубль, новый укус
                   не активируется.
                */

                finishDiceRoll(
                    rollingPlayer,
                    "vampire"
                );

            }

        },90);
}


/* =========================
   FINISH ROUND
========================= */

function finishRound(
    roundWinner
){

    if(
        roundFinished ||
        battleFinished
    ) return;


    roundFinished = true;

    gameStarted = false;


    previousRoundWinner =
        roundWinner;


    previousRoundLoser =
        roundWinner === 1
            ? 2
            : 1;


    if(roundWinner === 1){

        score1++;

    }else{

        score2++;

    }


    addLog(
        `🏆 Раунд ${currentRound} завершён. Победил ${getPlayerName(roundWinner)}. Счёт серии: ${score1} : ${score2}.`
    );


    updateUI();


    /*
       ПОБЕДА В СЕРИИ
    */

    if(
        score1 >= 2 ||
        score2 >= 2
    ){

        battleFinished = true;


        winnerTitle.textContent =
            `ПОБЕДИТЕЛЬ: ${getPlayerName(roundWinner)}`;


        winnerScore.textContent =
            `СЧЁТ СЕРИИ ${score1} : ${score2}`;


        nextRoundTimer =
            setTimeout(() => {

                winnerOverlay.classList.add(
                    "visible"
                );

            },800);


        return;
    }


    currentRound++;


    /*
       РАУНД 2
    */

    if(currentRound === 2){

        addLog(
            `⚔️ Следующий раунд начнётся с права неудачника — ${getPlayerName(previousRoundLoser)} начнёт первым.`
        );


        nextRoundTimer =
            setTimeout(() => {

                startRound(
                    "loser"
                );

            },NEXT_ROUND_DELAY);


        return;
    }


    /*
       РАУНД 3
    */

    if(currentRound === 3){

        addLog(
            "🎲 Счёт 1 : 1. Начинается решающий третий раунд."
        );


        nextRoundTimer =
            setTimeout(() => {

                startRound(
                    "autoCoin"
                );

            },NEXT_ROUND_DELAY);

    }

}


/* =========================
   START NEW GAME
========================= */

function startNewGame(){

    const enteredName1 =
        name1Input.value.trim();


    const enteredName2 =
        name2Input.value.trim();


    playerName1 =
        enteredName1 ||
        "ИГРОК 1";


    playerName2 =
        enteredName2 ||
        "ИГРОК 2";


    playerClass1 =
        class1Select.value;


    playerClass2 =
        class2Select.value;


    player1Name.textContent =
        playerName1;


    player2Name.textContent =
        playerName2;


    class1Name.textContent =
        getClassName(1);


    class2Name.textContent =
        getClassName(2);


    class1Name.classList.toggle(
        "assassin",
        playerClass1 === "assassin"
    );


    class1Name.classList.toggle(
        "vampire",
        playerClass1 === "vampire"
    );


    class2Name.classList.toggle(
        "assassin",
        playerClass2 === "assassin"
    );


    class2Name.classList.toggle(
        "vampire",
        playerClass2 === "vampire"
    );


    namesPanel.style.display =
        "none";


    score1 = 0;

    score2 = 0;

    currentRound = 1;

    currentPlayer = 1;


    previousRoundWinner = null;

    previousRoundLoser = null;


    gameStarted = false;

    battleFinished = false;

    roundFinished = false;


    winnerOverlay.classList.remove(
        "visible"
    );


    log.innerHTML = "";


    addLog(
        `⚔️ ${playerName1} — ${getClassName(1)}.`
    );


    addLog(
        `⚔️ ${playerName2} — ${getClassName(2)}.`
    );


    coinButton.disabled =
        false;


    status.textContent =
        "ГОТОВНОСТЬ";


    startRound(
        "manual"
    );
}

   RESTART
========================= */

function restartGame(){

    clearTimers();


    winnerOverlay.classList.remove(
        "visible"
    );


    namesPanel.style.display =

    score1 = 0;

    score2 = 0;

    currentRound = 1;

    previousRoundLoser = null;
