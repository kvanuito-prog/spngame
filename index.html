<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: transparent; font-family: sans-serif; color: white; }
.widget { background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 10px; border-left: 5px solid #f59e0b; width: 300px; }
.row { display: flex; justify-content: space-between; margin-bottom: 5px; }
.tag { font-weight: bold; color: #f59e0b; }
</style>
</head>
<body>
<div class="widget" id="scoreboard"></div>
<script>
function update() {
const data = JSON.parse(localStorage.getItem('pubg_data') || '[]');
const container = document.getElementById('scoreboard');
container.innerHTML = data.map(t => `
<div class="row">
<span class="tag">${t.tag}</span>
<span>K: ${t.kills} | P: ${t.pts}</span>
</div>
`).join('');
}
window.addEventListener('storage', update);
update();
</script>
</body>
</html>
