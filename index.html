<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPN BATTLE</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    color: #f3f7fb;
    background:
        radial-gradient(circle at top, #122033 0%, #05070b 60%);
}

.game {
    width: min(1180px, 94vw);
    margin: 0 auto;
    padding: 20px 0 30px;
}

/* TITLE */

.title {
    text-align: center;
    font-size: clamp(30px, 4vw, 46px);
    font-weight: 900;
    letter-spacing: 4px;
    color: #24d8ff;
    margin-bottom: 18px;
    text-shadow: 0 0 20px rgba(36, 216, 255, .35);
}

/* COIN */

.coin-area {
    background: #0b1018;
    border: 1px solid #1c3145;
    border-radius: 18px;
    padding: 16px;
    text-align: center;
    margin-bottom: 18px;
}

.coin-title {
    font-size: 16px;
    font-weight: 900;
    color: #24d8ff;
}

.coin {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
}

.coin-result {
    min-height: 22px;
    margin: 5px 0 10px;
    color: #c9d6e2;
    font-size: 14px;
}

.coin-button,
.restart-button {
    min-height: 48px;
    padding: 0 25px;
    border: 0;
    border-radius: 10px;
    color: white;
    font-weight: 900;
    font-size: 14px;
    background: linear-gradient(135deg, #007fbd, #00c8ff);
    cursor: pointer;
}

.coin-button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

/* BATTLE */

.battle {
    display: grid;
    grid-template-columns: 1fr 1.25fr 1fr;
    gap: 16px;
    align-items: stretch;
}

/* PLAYERS */

.player,
.arena,
.log-container {
    background: #0b1018;
    border: 1px solid #1c3145;
    border-radius: 18px;
}

.player {
    padding: 22px 18px;
    text-align: center;
}

.player-name {
    font-size: clamp(20px, 2.5vw, 28px);
    font-weight: 900;
}

.class-name {
    margin-top: 6px;
    color: #ffb347;
    font-weight: 900;
}

.hp-label {
    margin-top: 25px;
    color: #8fa1b2;
    font-size: 13px;
}

.hp {
    margin-top: 4px;
    font-size: clamp(28px, 3vw, 40px);
    font-weight: 900;
    color: #4cff88;
}

.hp-bar {
    width: 100%;
    height: 13px;
    margin-top: 12px;
    background: #1a222c;
    border-radius: 20px;
    overflow: hidden;
}

.hp-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #20d66b, #4cff88);
    transition: width .35s ease;
}

.status {
    min-height: 24px;
    margin-top: 18px;
    font-size: 14px;
    font-weight: 900;
}

.stunned {
    color: #ffcf40;
}

/* ARENA */

.arena {
    padding: 20px;
    text-align: center;
}

.turn {
    min-height: 24px;
    color: #24d8ff;
    font-size: 15px;
    font-weight: 900;
}

.dice {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin: 24px 0 18px;
}

.die {
    width: clamp(75px, 9vw, 100px);
    height: clamp(75px, 9vw, 100px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f7fb;
    color: #111;
    border-radius: 16px;
    font-size: clamp(45px, 6vw, 60px);
    box-shadow: 0 0 25px rgba(255,255,255,.12);
}

.rolling {
    animation: shake .11s infinite;
}

@keyframes shake {
    0% {
        transform: rotate(-5deg) scale(1);
    }

    50% {
        transform: rotate(5deg) scale(1.04);
    }

    100% {
        transform: rotate(-5deg) scale(1);
    }
}

.result {
    min-height: 65px;
    font-size: clamp(45px, 6vw, 60px);
    font-weight: 900;
    color: #24d8ff;
}

.auto-text {
    min-height: 22px;
    color: #71879a;
    font-size: 12px;
}

/* LOG */

.log-container {
    margin-top: 18px;
    padding: 16px;
}

.log-title {
    color: #24d8ff;
    font-size: 15px;
    font-weight: 900;
    margin-bottom: 10px;
}

.log {
    max-height: 230px;
    overflow-y: auto;
}

.log-entry {
    padding: 9px 10px;
    margin-bottom: 6px;
    background: #0e141e;
    border-left: 3px solid #00a8ff;
    border-radius: 5px;
    font-size: 13px;
    line-height: 1.35;
}

.log-entry.special {
    border-left-color: #ffcf40;
}

.log-entry.win {
    border-left-color: #4cff88;
    color: #4cff88;
    font-weight: 900;
}

/* RESTART */

.restart {
    text-align: center;
    margin-top: 16px;
}

.restart-button {
    background: #182330;
    border: 1px solid #30485d;
}

/* TABLET */

@media (min-width: 700px) and (max-width: 1300px) {

    .game {
        width: 94vw;
        max-width: 1180px;
        padding-top: 16px;
    }

    .coin-area {
        padding: 13px;
    }

    .battle {
        gap: 12px;
    }

    .player {
        padding: 18px 14px;
    }

    .arena {
        padding: 18px 14px;
    }

    .log-container {
        margin-top: 14px;
    }
}

/* VERTICAL / NARROW */

@media (max-width: 699px) {

    .game {
        width: 94vw;
    }

    .battle {
        grid-template-columns: 1fr;
    }

    .arena {
        order: -1;
    }

    .player {
        min-height: 190px;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {

    .rolling {
        animation: none;
    }

    .hp-fill {
        transition: none;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="title">
        ⚔️ SPN BATTLE
    </div>

    <!-- ОРЕЛ / РЕШКА -->

    <div class="coin-area">

        <div class="coin-title">
            🪙 ОПРЕДЕЛЕНИЕ ПЕРВОГО ХОДА
        </div>

        <div class="coin" id="coin">
            🪙
        </div>

        <div class="coin-result" id="coinResult">
            Нажмите кнопку, чтобы начать бой
        </div>

        <button
            class="coin-button"
            id="coinButton"
            type="button">
            ОРЕЛ / РЕШКА
        </button>

    </div>

    <!-- БОЕВОЕ ПОЛЕ -->

    <div class="battle">

        <!-- ИГРОК 1 -->

        <div class="player">

            <div class="player-name">
                ИГРОК 1
            </div>

            <div class="class-name">
                🪓 ВАРВАР
            </div>

            <div class="hp-label">
                ЗДОРОВЬЕ
            </div>

            <div class="hp" id="hp1Text">
                1000 HP
            </div>

            <div class="hp-bar">
                <div
                    class="hp-fill"
                    id="hp1Fill">
                </div>
            </div>

            <div
                class="status"
                id="status1">
            </div>

        </div>

        <!-- ЦЕНТР -->

        <div class="arena">

            <div
                class="turn"
                id="turnText">
                Ожидание начала боя
            </div>

            <div class="dice">

                <div
                    class="die"
                    id="die1">
                    ⚄
                </div>

                <div
                    class="die"
                    id="die2">
                    ⚄
                </div>

            </div>

            <div
                class="result"
                id="result">
                —
            </div>

            <div class="auto-text">
                БОЙ ИДЁТ АВТОМАТИЧЕСКИ
            </div>

        </div>

        <!-- ИГРОК 2 -->

        <div class="player">

            <div class="player-name">
                ИГРОК 2
            </div>

            <div class="class-name">
                🪓 ВАРВАР
            </div>

            <div class="hp-label">
                ЗДОРОВЬЕ
            </div>

            <div class="hp" id="hp2Text">
                1000 HP
            </div>

            <div class="hp-bar">
                <div
                    class="hp-fill"
                    id="hp2Fill">
                </div>
            </div>

            <div
                class="status"
                id="status2">
            </div>

        </div>

    </div>

    <!-- ЛОГ -->

    <div class="log-container">

        <div class="log-title">
            📜 ИГРОВОЙ ЛОГ
        </div>

        <div
            class="log"
            id="gameLog">

            <div class="log-entry">
                Бой ещё не начался.
            </div>

        </div>

    </div>

    <!-- ПЕРЕЗАПУСК -->

    <div class="restart">

        <button
            class="restart-button"
            id="restartButton"
            type="button">
            🔄 НАЧАТЬ ЗАНОВО
        </button>

    </div>

</div>

<script>

/* ==============================
   НАСТРОЙКИ ИГРЫ
============================== */

const MAX_HP = 1000;

/*
 * Пауза между ходами.
 * 1000 = 1 секунда.
 */
const TURN_DELAY = 1000;


/* ==============================
   СОСТОЯНИЕ
============================== */

let hp1 = MAX_HP;
let hp2 = MAX_HP;

let currentPlayer = null;

let stunned1 = false;
let stunned2 = false;

let gameStarted = false;
let gameOver = false;

let battleTimer = null;


/* ==============================
   ЭЛЕМЕНТЫ
============================== */

const coin =
    document.getElementById("coin");

const coinResult =
    document.getElementById("coinResult");

const coinButton =
    document.getElementById("coinButton");

const turnText =
    document.getElementById("turnText");

const die1 =
    document.getElementById("die1");

const die2 =
    document.getElementById("die2");

const result =
    document.getElementById("result");

const hp1Text =
    document.getElementById("hp1Text");

const hp2Text =
    document.getElementById("hp2Text");

const hp1Fill =
    document.getElementById("hp1Fill");

const hp2Fill =
    document.getElementById("hp2Fill");

const status1 =
    document.getElementById("status1");

const status2 =
    document.getElementById("status2");

const gameLog =
    document.getElementById("gameLog");

const restartButton =
    document.getElementById("restartButton");


/* ==============================
   СИМВОЛЫ КУБИКОВ
============================== */

const diceSymbols = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];


/* ==============================
   СЛУЧАЙНЫЙ КУБИК
============================== */

function randomDice() {

    return Math.floor(
        Math.random() * 6
    ) + 1;

}


/* ==============================
   ЛОГ
============================== */

function addLog(message, type = "") {

    const entry =
        document.createElement("div");

    entry.className =
        "log-entry " + type;

    entry.textContent =
        message;

    gameLog.prepend(entry);

}


/* ==============================
   ОБНОВЛЕНИЕ ЭКРАНА
============================== */

function updateUI() {

    hp1Text.textContent =
        `${hp1} HP`;

    hp2Text.textContent =
        `${hp2} HP`;


    hp1Fill.style.width =
        `${(hp1 / MAX_HP) * 100}%`;

    hp2Fill.style.width =
        `${(hp2 / MAX_HP) * 100}%`;


    if (stunned1) {

        status1.textContent =
            "😵 ОГЛУШЁН";

        status1.className =
            "status stunned";

    } else {

        status1.textContent =
            "";

        status1.className =
            "status";

    }


    if (stunned2) {

        status2.textContent =
            "😵 ОГЛУШЁН";

        status2.className =
            "status stunned";

    } else {

        status2.textContent =
            "";

        status2.className =
            "status";

    }


    if (gameStarted && !gameOver) {

        turnText.textContent =
            `ХОД ИГРОКА ${currentPlayer}`;

    }

}


/* ==============================
   СЛЕДУЮЩИЙ АВТОМАТИЧЕСКИЙ ХОД
============================== */

function scheduleNextTurn(delay = TURN_DELAY) {

    clearTimeout(battleTimer);

    battleTimer =
        setTimeout(() => {

            automaticTurn();

        }, delay);

}


/* ==============================
   АВТОМАТИЧЕСКИЙ ХОД
============================== */

function automaticTurn() {

    if (!gameStarted || gameOver) {
        return;
    }


    /*
     * Если игрок оглушён,
     * автоматически пропускаем его ход.
     */

    if (
        currentPlayer === 1 &&
        stunned1
    ) {

        stunned1 = false;

        addLog(
            "😵 Игрок 1 оглушён и пропускает свой ход.",
            "special"
        );

        currentPlayer = 2;

        updateUI();

        scheduleNextTurn(700);

        return;
    }


    if (
        currentPlayer === 2 &&
        stunned2
    ) {

        stunned2 = false;

        addLog(
            "😵 Игрок 2 оглушён и пропускает свой ход.",
            "special"
        );

        currentPlayer = 1;

        updateUI();

        scheduleNextTurn(700);

        return;
    }


    rollDiceAutomatically();

}


/* ==============================
   БРОСОК
============================== */

function rollDiceAutomatically() {

    if (!gameStarted || gameOver) {
        return;
    }


    turnText.textContent =
        `ИГРОК ${currentPlayer} БРОСАЕТ...`;


    die1.classList.add("rolling");
    die2.classList.add("rolling");


    setTimeout(() => {

        die1.classList.remove("rolling");
        die2.classList.remove("rolling");


        const value1 =
            randomDice();

        const value2 =
            randomDice();


        /*
         * Первый кубик = десятки
         * Второй кубик = единицы
         */

        const damage =
            value1 * 10 + value2;


        die1.textContent =
            diceSymbols[value1 - 1];

        die2.textContent =
            diceSymbols[value2 - 1];

        result.textContent =
            damage;


        const attacker =
            currentPlayer;

        const defender =
            attacker === 1
                ? 2
                : 1;


        /* УРОН */

        if (defender === 1) {

            hp1 =
                Math.max(
                    0,
                    hp1 - damage
                );

        } else {

            hp2 =
                Math.max(
                    0,
                    hp2 - damage
                );

        }


        addLog(
            `Игрок ${attacker} выбросил ${damage} и нанёс ${damage} урона игроку ${defender}.`
        );


        /* ДУБЛЬ */

        if (value1 === value2) {

            if (defender === 1) {

                stunned1 = true;

            } else {

                stunned2 = true;

            }


            addLog(
                `🔥 ДУБЛЬ ${damage}! Варвар оглушил игрока ${defender}. Следующий ход игрока ${defender} будет пропущен.`,
                "special"
            );

        }


        updateUI();


        /* ПОБЕДА */

        if (
            hp1 <= 0 ||
            hp2 <= 0
        ) {

            gameOver = true;

            clearTimeout(battleTimer);


            const winner =
                hp1 <= 0
                    ? 2
                    : 1;


            turnText.textContent =
                `🏆 ИГРОК ${winner} ПОБЕДИЛ`;


            addLog(
                `🏆 ИГРОК ${winner} ПОБЕДИЛ!`,
                "win"
            );


            return;
        }


        /* ПЕРЕДАЁМ ХОД */

        currentPlayer =
            defender;


        updateUI();


        /*
         * Следующий бросок происходит
         * автоматически.
         */

        scheduleNextTurn();

    }, 450);

}


/* ==============================
   ОРЕЛ / РЕШКА
============================== */

function determineFirstPlayer() {

    if (gameStarted || gameOver) {
        return;
    }


    coinButton.disabled = true;

    coinResult.textContent =
        "Монетка подбрасывается...";

    coin.textContent =
        "🪙";


    setTimeout(() => {

        const coinValue =
            Math.random() < 0.5
                ? "ОРЕЛ"
                : "РЕШКА";


        if (coinValue === "ОРЕЛ") {

            coin.textContent =
                "🦅";

            currentPlayer = 1;

        } else {

            coin.textContent =
                "🪙";

            currentPlayer = 2;

        }


        coinResult.textContent =
            `${coinValue}! Первый бросок получает игрок ${currentPlayer}.`;


        addLog(
            `Выпало ${coinValue}. Игрок ${currentPlayer} получает право первого броска.`,
            "special"
        );


        gameStarted = true;

        updateUI();


        /*
         * Через небольшую паузу
         * начинается автоматический бой.
         */

        scheduleNextTurn(900);

    }, 700);

}


/* ==============================
   ПЕРЕЗАПУСК
============================== */

function restartGame() {

    clearTimeout(battleTimer);


    hp1 = MAX_HP;
    hp2 = MAX_HP;

    currentPlayer = null;

    stunned1 = false;
    stunned2 = false;

    gameStarted = false;
    gameOver = false;


    coin.textContent =
        "🪙";

    coinResult.textContent =
        "Нажмите кнопку, чтобы начать бой";

    coinButton.disabled =
        false;


    turnText.textContent =
        "Ожидание начала боя";


    die1.textContent =
        "⚄";

    die2.textContent =
        "⚄";

    result.textContent =
        "—";


    gameLog.innerHTML = `
        <div class="log-entry">
            Бой ещё не начался.
        </div>
    `;


    updateUI();

}


/* ==============================
   СОБЫТИЯ
============================== */

coinButton.addEventListener(
    "click",
    determineFirstPlayer
);

restartButton.addEventListener(
    "click",
    restartGame
);


/* ==============================
   ИНИЦИАЛИЗАЦИЯ
============================== */

updateUI();

</script>

</body>
</html>
