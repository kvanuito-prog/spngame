<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Кубики — Битва Варваров</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 30%, #1e2a4a 0%, #0a0f1e 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: 10px; gap: 10px;
  }

  /* --- Игроки --- */
  .players { display: flex; gap: 8px; flex-shrink: 0; }
  .player {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 8px 10px;
    transition: all 0.25s ease;
    min-width: 0; position: relative; overflow: hidden;
  }
  .player.active { border-color: #4ade80; box-shadow: 0 0 16px rgba(74,222,128,0.35); background: rgba(74,222,128,0.08); }
  .player.active.p2-active { border-color: #60a5fa; box-shadow: 0 0 16px rgba(96,165,250,0.35); background: rgba(96,165,250,0.08); }
  .player.stunned {
    border-color: #fbbf24 !important;
    background: rgba(251,191,36,0.12) !important;
    animation: stunPulse 0.7s infinite;
  }
  @keyframes stunPulse {
    0%,100% { box-shadow: 0 0 10px rgba(251,191,36,0.4); }
    50%     { box-shadow: 0 0 26px rgba(251,191,36,0.95); }
  }
  .player.dead { border-color: #ef4444; opacity: 0.5; filter: grayscale(0.7); }
  .pname {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #8892b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player.active .pname { color: #4ade80; }
  .player.active.p2-active .pname { color: #60a5fa; }
  .player.stunned .pname { color: #fbbf24 !important; }
  .pclass { font-size: 10px; color: #f59e0b; letter-spacing: 1px; margin: 2px 0 6px; font-weight: 700; opacity: 0.85; }
  .hp-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
  .hp-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    border-radius: 4px; transition: width 0.4s ease, background 0.4s ease;
  }
  .hp-fill.low { background: linear-gradient(90deg, #ef4444, #f87171); }
  .hp-val { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; color: #e0e6f0; }
  .stun-badge {
    position: absolute; top: 6px; right: 6px;
    background: #fbbf24; color: #1a1a1a;
    font-size: 10px; font-weight: 800;
    padding: 2px 6px; border-radius: 6px; letter-spacing: 1px;
    display: none;
  }
  .player.stunned .stun-badge { display: block; }

  /* --- Кубики --- */
  .dice-row { display: flex; gap: 16px; justify-content: center; flex-shrink: 0; margin: 4px 0; }
  .die {
    width: 80px; height: 80px;
    background: #ffffff; border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 -4px 8px rgba(0,0,0,0.15);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 10px;
  }
  .die.spinning { animation: shake 0.12s infinite; }
  @keyframes shake {
    0%   { transform: rotate(-5deg) scale(1.03); }
    50%  { transform: rotate(5deg) scale(0.97); }
    100% { transform: rotate(-5deg) scale(1.03); }
  }
  .pip { display: flex; align-items: center; justify-content: center; }
  .pip::after { content: ""; display: block; width: 14px; height: 14px; background: #1a1a1a; border-radius: 50%; }
  .pip.hidden-pip::after { display: none; }

  /* --- Результат --- */
  .result {
    text-align: center; font-size: 44px; font-weight: 800;
    letter-spacing: 6px; color: #4ade80;
    text-shadow: 0 0 25px rgba(74,222,128,0.5);
    font-variant-numeric: tabular-nums;
    min-height: 52px; line-height: 52px;
    transition: color 0.3s ease;
    flex-shrink: 0;
  }
  .result.p2 { color: #60a5fa; text-shadow: 0 0 25px rgba(96,165,250,0.5); }
  .result.double { color: #fbbf24; text-shadow: 0 0 25px rgba(251,191,36,0.7); }

  /* --- Лог --- */
  .log-wrap {
    flex: 1 1 auto; min-height: 80px;
    display: flex; flex-direction: column;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; overflow: hidden;
  }
  .log-title {
    padding: 6px 10px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: #8892b0; border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.15); flex-shrink: 0;
  }
  .log-list { flex: 1 1 auto; overflow-y: auto; padding: 2px 0; -webkit-overflow-scrolling: touch; min-height: 0; }
  .log-entry {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    animation: slideIn 0.25s ease;
    font-variant-numeric: tabular-nums;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .log-entry .idx { color: #6b7a99; font-size: 11px; min-width: 28px; }
  .log-entry .who { font-size: 12px; font-weight: 700; }
  .log-entry .who.p1 { color: #4ade80; }
  .log-entry .who.p2 { color: #60a5fa; }
  .log-entry .dmg { margin-left: auto; font-weight: 700; color: #f87171; }
  .log-entry.double .dmg { color: #fbbf24; }
  .log-entry.stun { background: rgba(251,191,36,0.10); }
  .log-entry.stun .who { color: #fbbf24; }
  .log-entry.stun .dmg { color: #fbbf24; letter-spacing: 2px; }

  /* --- Кнопки управления --- */
  .controls { display: flex; gap: 8px; flex-shrink: 0; }
  .control-btn {
    flex: 1;
    padding: 15px;
    font-size: 15px; font-weight: 800;
    border: none; border-radius: 12px;
    cursor: pointer; letter-spacing: 1.5px;
    font-family: inherit;
    color: #0a0f1e;
    transition: transform 0.1s ease;
  }
  .control-btn:active { transform: scale(0.97); }
  .control-btn.start { background: linear-gradient(145deg, #4ade80, #22c55e); }
  .control-btn.stop  { background: linear-gradient(145deg, #f87171, #ef4444); color: #fff; }
  .control-btn.hidden { display: none; }

  .hint {
    text-align: center; color: #8892b0; font-size: 11px;
    letter-spacing: 1px; flex-shrink: 0; min-height: 14px;
  }

  /* --- Game Over --- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    background: linear-gradient(160deg, #1e2a4a, #0f1729);
    border: 2px solid rgba(74,222,128,0.4);
    border-radius: 20px; padding: 28px 24px;
    text-align: center; max-width: 360px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .overlay-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #4ade80; }
  .overlay-sub { font-size: 13px; color: #8892b0; margin-bottom: 20px; }
  .btn {
    background: linear-gradient(145deg, #4ade80, #22c55e);
    color: #0a0f1e; border: none;
    padding: 14px 28px; font-size: 15px; font-weight: 800;
    border-radius: 12px; cursor: pointer; letter-spacing: 1px;
    width: 100%; font-family: inherit;
    transition: transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }

  /* --- Планшет --- */
  @media (min-width: 700px) {
    #app { max-width: 720px; margin: 0 auto; padding: 16px; gap: 14px; }
    .die { width: 100px; height: 100px; padding: 12px; }
    .pip::after { width: 18px; height: 18px; }
    .result { font-size: 56px; min-height: 66px; line-height: 66px; }
    .hp-val { font-size: 20px; }
    .pname { font-size: 13px; }
    .pclass { font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="players">
    <div class="player" id="p1">
      <div class="stun-badge">⚡ СТАН</div>
      <div class="pname">Игрок 1</div>
      <div class="pclass">⚔ Варвар</div>
      <div class="hp-bar"><div class="hp-fill" id="hpFill1"></div></div>
      <div class="hp-val" id="hpVal1">1000</div>
    </div>
    <div class="player" id="p2">
      <div class="stun-badge">⚡ СТАН</div>
      <div class="pname">Игрок 2</div>
      <div class="pclass">⚔ Варвар</div>
      <div class="hp-bar"><div class="hp-fill" id="hpFill2"></div></div>
      <div class="hp-val" id="hpVal2">1000</div>
    </div>
  </div>

  <div class="dice-row">
    <div class="die" id="die1"></div>
    <div class="die" id="die2"></div>
  </div>

  <div class="result" id="result">— —</div>

  <div class="log-wrap">
    <div class="log-title">История</div>
    <div class="log-list" id="logList"></div>
  </div>

  <div class="controls">
    <button class="control-btn start" id="battleBtn">▶ НАЧАТЬ БОЙ · 4×</button>
  </div>

  <div class="hint" id="hint">Нажми «Начать бой»</div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-title" id="overlayTitle">Победа!</div>
    <div class="overlay-sub" id="overlaySub"></div>
    <button class="btn" id="restartBtn">Играть снова</button>
  </div>
</div>

<script>
  var dieEls = [document.getElementById('die1'), document.getElementById('die2')];
  var resultEl = document.getElementById('result');
  var logList = document.getElementById('logList');
  var hintEl = document.getElementById('hint');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlaySub = document.getElementById('overlaySub');
  var battleBtn = document.getElementById('battleBtn');

  var MAX_HP = 1000;
  var MAX_LOG = 60;
  var SPEED = 4; // множитель скорости
  var SPIN_DURATION = 900 / SPEED;    // 225 мс
  var FRAME_INTERVAL = 40;            // кадры анимации
  var PAUSE_BETWEEN  = 30;            // пауза между бросками
  var STUN_PAUSE     = 1500 / SPEED;  // 375 мс

  var rolling = false;
  var rollNumber = 0;
  var turn = 1;
  var hp1 = MAX_HP;
  var hp2 = MAX_HP;
  var gameOver = false;
  var stunned = { 1: false, 2: false };
  var autoPlay = false;
  var autoTimer = null;

  var pipPositions = {
    1: [4], 2: [0, 8], 3: [0, 4, 8],
    4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
  };

  function renderDie(el, value) {
    el.innerHTML = '';
    var pips = pipPositions[value] || [];
    for (var i = 0; i < 9; i++) {
      var cell = document.createElement('div');
      cell.className = 'pip';
      var show = false;
      for (var j = 0; j < pips.length; j++) { if (pips[j] === i) { show = true; break; } }
      if (!show) cell.className += ' hidden-pip';
      el.appendChild(cell);
    }
  }

  function randomDie() { return Math.floor(Math.random() * 6) + 1; }

  function updatePlayersUI() {
    document.getElementById('hpVal1').textContent = hp1;
    document.getElementById('hpVal2').textContent = hp2;

    var fill1 = document.getElementById('hpFill1');
    var fill2 = document.getElementById('hpFill2');
    fill1.style.width = (hp1 / MAX_HP * 100) + '%';
    fill2.style.width = (hp2 / MAX_HP * 100) + '%';
    fill1.className = 'hp-fill' + (hp1 / MAX_HP < 0.3 ? ' low' : '');
    fill2.className = 'hp-fill' + (hp2 / MAX_HP < 0.3 ? ' low' : '');

    var p1 = document.getElementById('p1');
    var p2 = document.getElementById('p2');
    var cls1 = 'player';
    var cls2 = 'player';
    if (!gameOver) {
      if (turn === 1) cls1 += ' active';
      if (turn === 2) cls2 += ' active p2-active';
    }
    if (stunned[1]) cls1 += ' stunned';
    if (stunned[2]) cls2 += ' stunned';
    if (hp1 <= 0) cls1 += ' dead';
    if (hp2 <= 0) cls2 += ' dead';
    p1.className = cls1;
    p2.className = cls2;
  }

  function setHint(text) { hintEl.textContent = text; }

  function addLogEntry(number, attacker, dmg, isDouble, stunCaused) {
    var entry = document.createElement('div');
    entry.className = 'log-entry' + (isDouble ? ' double' : '');
    var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = '#' + number;
    var who = document.createElement('span'); who.className = 'who p' + attacker; who.textContent = 'Игрок ' + attacker;
    var dmgEl = document.createElement('span'); dmgEl.className = 'dmg';
    dmgEl.textContent = '−' + dmg + (isDouble ? ' ★' : '') + (stunCaused ? ' ⚡' : '');
    entry.appendChild(idx); entry.appendChild(who); entry.appendChild(dmgEl);
    logList.insertBefore(entry, logList.firstChild);
    trimLog();
  }

  function addStunSkipLog(playerNum) {
    var entry = document.createElement('div');
    entry.className = 'log-entry stun';
    var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = '⚡';
    var who = document.createElement('span'); who.className = 'who'; who.textContent = 'Игрок ' + playerNum + ' оглушён';
    var dmgEl = document.createElement('span'); dmgEl.className = 'dmg'; dmgEl.textContent = 'ПРОПУСК';
    entry.appendChild(idx); entry.appendChild(who); entry.appendChild(dmgEl);
    logList.insertBefore(entry, logList.firstChild);
    trimLog();
  }

  function trimLog() {
    while (logList.children.length > MAX_LOG) logList.removeChild(logList.lastChild);
  }

  function roll() {
    if (rolling || gameOver) return;
    rolling = true;

    dieEls.forEach(function(el) { el.classList.add('spinning'); });
    resultEl.textContent = '— —';
    resultEl.className = 'result';

    var start = performance.now();

    var timer = setInterval(function() {
      dieEls.forEach(function(el) { renderDie(el, randomDie()); });
      if (performance.now() - start >= SPIN_DURATION) {
        clearInterval(timer);
        finish();
      }
    }, FRAME_INTERVAL);

    function finish() {
      var v1 = randomDie();
      var v2 = randomDie();
      var dmg = v1 * 10 + v2;
      var isDouble = v1 === v2;

      renderDie(dieEls[0], v1);
      renderDie(dieEls[1], v2);
      dieEls.forEach(function(el) { el.classList.remove('spinning'); });

      rollNumber++;
      resultEl.textContent = String(dmg);
      resultEl.className = 'result' + (isDouble ? ' double' : (turn === 2 ? ' p2' : ''));

      var attacker = turn;
      var defender = turn === 1 ? 2 : 1;

      if (attacker === 1) hp2 = Math.max(0, hp2 - dmg);
      else hp1 = Math.max(0, hp1 - dmg);

      var stunCaused = false;
      if (isDouble && hp1 > 0 && hp2 > 0) {
        stunned[defender] = true;
        stunCaused = true;
      }

      addLogEntry(rollNumber, attacker, dmg, isDouble, stunCaused);

      // Конец игры
      if (hp1 <= 0 || hp2 <= 0) {
        gameOver = true;
        stunned[1] = false;
        stunned[2] = false;
        updatePlayersUI();
        showGameOver();
        rolling = false;
        return;
      }

      // Переход хода
      turn = defender;
      updatePlayersUI();

      var extraDelay = 0;

      if (stunned[turn]) {
        var skipPlayer = turn;
        setHint('⚡ Игрок ' + skipPlayer + ' оглушён!');
        addStunSkipLog(skipPlayer);
        extraDelay = STUN_PAUSE;

        setTimeout(function() {
          stunned[skipPlayer] = false;
          turn = skipPlayer === 1 ? 2 : 1;
          updatePlayersUI();
          if (!autoPlay) setHint('Тап — бросок Игрока ' + turn);
        }, STUN_PAUSE);
      } else if (!autoPlay) {
        setHint('Тап — бросок Игрока ' + turn);
      }

      rolling = false;

      // Автоследующий бросок
      if (autoPlay) {
        clearTimeout(autoTimer);
        autoTimer = setTimeout(function() {
          if (autoPlay && !gameOver) roll();
        }, PAUSE_BETWEEN + extraDelay);
      }
    }
  }

  function showGameOver() {
    var winner = hp1 <= 0 ? 2 : 1;
    overlayTitle.textContent = 'Игрок ' + winner + ' победил!';
    overlayTitle.style.color = winner === 1 ? '#4ade80' : '#60a5fa';
    overlaySub.textContent = 'Игрок 1: ' + hp1 + ' HP  ·  Игрок 2: ' + hp2 + ' HP';
    overlay.classList.add('show');
    setHint('Игра окончена');
    battleBtn.classList.add('hidden');
  }

  function startAuto() {
    if (gameOver) return;
    autoPlay = true;
    battleBtn.textContent = '⏸ СТОП';
    battleBtn.className = 'control-btn stop';
    setHint('⚔ Бой идёт...');
    roll();
  }

  function stopAuto() {
    autoPlay = false;
    clearTimeout(autoTimer);
    battleBtn.textContent = '▶ НАЧАТЬ БОЙ · 4×';
    battleBtn.className = 'control-btn start';
    if (!gameOver) setHint('Пауза. Нажми «Начать бой»');
  }

  function resetGame() {
    hp1 = MAX_HP; hp2 = MAX_HP;
    turn = 1; rollNumber = 0;
    gameOver = false; rolling = false;
    autoPlay = false;
    clearTimeout(autoTimer);
    stunned[1] = false; stunned[2] = false;
    logList.innerHTML = '';
    resultEl.textContent = '— —';
    resultEl.className = 'result';
    overlay.classList.remove('show');
    battleBtn.textContent = '▶ НАЧАТЬ БОЙ · 4×';
    battleBtn.className = 'control-btn start';
    battleBtn.classList.remove('hidden');
    dieEls.forEach(function(el) { renderDie(el, randomDie()); });
    updatePlayersUI();
    setHint('Нажми «Начать бой»');
  }

  // Управление: тап по экрану работает только вне автобоя
  document.body.addEventListener('click', function(e) {
    if (e.target.closest('.log-wrap')) return;
    if (e.target.closest('.controls')) return;
    if (e.target.closest('.overlay')) return;
    if (autoPlay || gameOver) return;
    roll();
  });
  document.body.addEventListener('touchstart', function(e) {
    if (e.target.closest('.log-wrap')) return;
    if (e.target.closest('.controls')) return;
    if (e.target.closest('.overlay')) return;
    e.preventDefault();
    if (autoPlay || gameOver) return;
    roll();
  }, { passive: false });

  battleBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (autoPlay) stopAuto();
    else startAuto();
  });

  document.getElementById('restartBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    resetGame();
  });

  dieEls.forEach(function(el) { renderDie(el, randomDie()); });
  updatePlayersUI();
</script>
</body>
</html>
