
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация на турнир PUBG</title>
    <style>
        :root {
            --primary: #ff9900;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --free: #2d5a27;   /* Зеленый */
            --busy: #1a4a8d;   /* Синий */
            --blocked: #ff4444; /* Красный */
        }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        
        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .slot { background: var(--card-bg); border: 1px solid #333; padding: 10px; border-radius: 4px; font-size: 0.8em; min-height: 80px; }
        
        .free { border-color: var(--free); color: #fff; background: #1a331a; }
        .busy { border-color: var(--busy); color: #fff; background: var(--busy); }
        .blocked { border-color: var(--blocked); color: var(--blocked); }
        
        form { background: var(--card-bg); padding: 20px; margin-top: 30px; border-radius: 8px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #333; border: none; color: white; box-sizing: border-box; }
        button { background: var(--primary); padding: 10px; width: 100%; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Список команд</h1>
        <div class="slots-grid" id="slots">
            <script>
                // Сюда вы будете вписывать занятые слоты вручную
                const bookedSlots = {
                    5: { team: "Team Alpha", p1: "Player1", p2: "Player2", sub: "Sub1" },
                    6: { team: "Bravo Squad", p1: "Ivan", p2: "Dmitry", sub: "Alex" }
                };

                for(let i = 1; i <= 50; i++) {
                    if (i <= 4) {
                        document.write('<div class="slot blocked">#' + i + '<br>БУФЕР</div>');
                    } else if (bookedSlots[i]) {
                        const data = bookedSlots[i];
                        document.write('<div class="slot busy">#' + i + '<br><b>' + data.team + '</b><br><small>' + data.p1 + ', ' + data.p2 + '<br>Зап: ' + data.sub + '</small></div>');
                    } else {
                        document.write('<div class="slot free">#' + i + '<br>Свободен</div>');
                    }
                }
            </script>
        </div>

        <section>
            <h2>Подать заявку</h2>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="text" name="team_name" placeholder="Название команды" required>
                <input type="text" name="slot_number" placeholder="Желаемый номер слота (5-50)" required>
                <input type="text" name="players" placeholder="Ники 2 игроков и 1 запасного" required>
                <button type="submit">Отправить заявку</button>
            </form>
        </section>
    </div>
</body>
</html>
