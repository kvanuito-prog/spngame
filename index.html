<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SPN BATTLE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070b;
    color: #f3f7fb;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

button {
    font: inherit;
}

.game {
    width: 100%;
    height: 100vh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 10px 14px;
    overflow: hidden;
}

/* ================= HEADER ================= */

.header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    height: 54px;
    padding: 0 18px;
    border: 1px solid #172231;
    border-radius: 14px;
    background: linear-gradient(135deg, #0c131d, #080d15);
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
}

.logo {
    font-size: clamp(22px, 2.2vw, 34px);
    font-weight: 900;
    letter-spacing: 2px;
    color: #24d8ff;
    text-shadow: 0 0 18px rgba(36,216,255,.25);
}

.round-info {
    text-align: center;
    line-height: 1.1;
}

.round-title {
    font-size: clamp(13px, 1.3vw, 19px);
    font-weight: 800;
    color: #8ea5bb;
}

.score {
    margin-top: 3px;
    font-size: clamp(18px, 1.8vw, 27px);
    font-weight: 900;
    color: #fff;
}

.status {
    min-width: 150px;
    text-align: right;
    font-size: clamp(11px, 1.1vw, 15px);
    font-weight: 800;
    color: #647b91;
}

/* ================= COIN ================= */

.coin-panel {
    flex: 0 0 auto;
    height: 82px;
    margin: 8px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: 1px solid #172231;
    border-radius: 14px;
    background: #080d15;
}

.coin-label {
    font-size: clamp(11px, 1.1vw, 15px);
    color: #7890a7;
    font-weight: 800;
    text-transform: uppercase;
}

.coin-button {
    min-width: 150px;
    height: 52px;
    padding: 0 24px;
    border: 1px solid #008acb;
    border-radius: 11px;
    background: linear-gradient(135deg, #008dcc, #006a9d);
    color: white;
    font-size: clamp(15px, 1.4vw, 20px);
    font-weight: 900;
    letter-spacing: .8px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,168,255,.16);
    transition: .15s ease;
}

.coin-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 26px rgba(0,168,255,.28);
}

.coin-button:active {
    transform: scale(.97);
}

.coin-button:disabled {
    opacity: .5;
    cursor: default;
    transform: none;
}

.coin-result {
    min-width: 110px;
    text-align: center;

}

/* ================= BATTLE ================= */

.battle {
    flex: 1 1 auto;

    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, .7fr) minmax(0, 1fr);
    gap: 10px;
}

.player {
    min-width: 0;
    min-height: 0;

    flex-direction: column;
    justify-content: center;

    border-radius: 16px;
    background:
        radial-gradient(circle at top, rgba(0,168,255,.07), transparent 50%),

    overflow: hidden;
}

.player.active {

}

.player-name {
    text-align: center;
    font-size: clamp(18px, 2vw, 29px);

    letter-spacing: 1px;
}

.class-name {
    margin-top: 3px;
    text-align: center;
    font-size: clamp(11px, 1vw, 15px);
    color: #778da4;
    font-weight: 800;

}

.hp-number {

    text-align: center;

    font-weight: 900;

}

.hp-label {

    font-size: 11px;
    color: #667c92;

}

.hp-bar {

}

.hp-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #00a8ff, #24d8ff);
    transition: width .25s ease;
}

.player-right .hp-fill {
    background: linear-gradient(90deg, #ff3d58, #ff7183);
}

.turn {
    min-height: 28px;
    margin-top: 12px;
    text-align: center;
    font-size: clamp(11px, 1.1vw, 15px);
    font-weight: 900;

}

.player-right .turn {
    color: #ff7183;
}

.stun-text {
    min-height: 20px;
    margin-top: 3px;

    font-size: 12px;
    font-weight: 900;
    color: #ffb02e;
}

/* ================= CENTER ================= */

.arena {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #172231;

        radial-gradient(circle, rgba(0,168,255,.08), transparent 65%),

}

/* Информация о том, чей ход — НАД КУБИКАМИ */

.arena-turn {
    min-height: 32px;
    margin-bottom: 12px;
    text-align: center;
    font-size: clamp(15px, 1.5vw, 22px);
    font-weight: 900;
    letter-spacing: .5px;

    text-transform: uppercase;
}

/* ================= CLASSIC DICE ================= */

.dice-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 1.4vw, 22px);
}

.dice {
    width: clamp(62px, 6.5vw, 94px);
    height: clamp(62px, 6.5vw, 94px);

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    padding: clamp(8px, .8vw, 12px);

    border: 2px solid #cfd5dc;
    border-radius: 13px;

    background: linear-gradient(
        145deg,
        #ffffff,
        #e9edf1
    );

    box-shadow:
        0 8px 20px rgba(0,0,0,.35),
        inset 0 1px 2px rgba(255,255,255,.9);

    transition: transform .12s ease;
}

.dice.rolling {
    animation: diceShake .16s linear infinite;
}

@keyframes diceShake {
    0% {
        transform: rotate(0deg) scale(1);
    }

    25% {
        transform: rotate(-5deg) scale(1.04);
    }

    50% {
        transform: rotate(5deg) scale(1.07);
    }

    75% {
        transform: rotate(-4deg) scale(1.04);
    }

    100% {
        transform: rotate(0deg) scale(1);
    }
}

/* Точки кубика */

.dot {

.pos7 {

.pos8 {

<script>

/* =========================================================
   SPN BATTLE
   BEST OF 3
   ========================================================= */

const MAX_HP = 1000;

const TURN_DELAY = 900;

const DICE_ANIMATION_TIME = 550;

const NEXT_ROUND_DELAY = 1800;


let hp1 = MAX_HP;
let hp2 = MAX_HP;

let score1 = 0;
let score2 = 0;

let currentRound = 1;

let currentPlayer = 1;

let stunned1 = false;
let stunned2 = false;

let gameStarted = false;

let battleFinished = false;

let roundFinished = false;

let battleTimer = null;

let diceTimer = null;

let nextRoundTimer = null;

let audioContext = null;

let soundEnabled = true;


/* =========================================================
   ELEMENTS
   ========================================================= */

const coinButton =
    document.getElementById("coinButton");

const coinResult =
    document.getElementById("coinResult");

const roundTitle =
    document.getElementById("roundTitle");

const score =
    document.getElementById("score");

const status =
    document.getElementById("status");

const arenaTurn =
    document.getElementById("arenaTurn");

const hp1Text =
    document.getElementById("hp1Text");

const hp2Text =
    document.getElementById("hp2Text");

const hp1Bar =
    document.getElementById("hp1Bar");

const hp2Bar =
    document.getElementById("hp2Bar");

const player1 =
    document.getElementById("player1");

const player2 =
    document.getElementById("player2");

const turn1 =
    document.getElementById("turn1");

const turn2 =
    document.getElementById("turn2");

const stun1 =
    document.getElementById("stun1");

const stun2 =
    document.getElementById("stun2");

const dice1 =
    document.getElementById("dice1");

const dice2 =
    document.getElementById("dice2");

const resultNumber =
    document.getElementById("resultNumber");

const damageText =
    document.getElementById("damageText");

const log =
    document.getElementById("log");

const restartButton =
    document.getElementById("restartButton");

const winnerOverlay =
    document.getElementById("winnerOverlay");

const winnerTitle =
    document.getElementById("winnerTitle");

const winnerScore =
    document.getElementById("winnerScore");

const winnerClose =
    document.getElementById("winnerClose");


/* =========================================================
   CLASSIC DICE
   ========================================================= */

const dicePatterns = {

    1: [5],

    2: [1, 9],

    3: [1, 5, 9],

    4: [1, 3, 7, 9],

    5: [1, 3, 5, 7, 9],

    6: [1, 3, 4, 6, 7, 9]

};


function drawDice(element, number) {

    element.innerHTML = "";

    if (!number) {
        return;
    }

    const positions =
        dicePatterns[number];

    positions.forEach(position => {

        const dot =
            document.createElement("span");

        dot.className =
            `dot pos${position}`;

        element.appendChild(dot);

    });
}


/* =========================================================
   SOUND
   ========================================================= */

function initAudio() {

    if (!soundEnabled) {
        return;
    }

    if (!audioContext) {

        try {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        } catch (error) {

            soundEnabled = false;

        }

    }

    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

}


function playClick(
    frequency = 520,
    duration = 0.045,
    volume = 0.035
) {

    if (
        !soundEnabled ||
        !audioContext
    ) {
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime
    );

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );

}


function playButtonSound() {

    playClick(
        520,
        0.045,
        0.035
    );

}


function playDiceSound() {

    playClick(
        300,
        0.035,
        0.018
    );

}


function playHitSound() {

    playClick(
        180,
        0.08,
        0.035
    );

}


function playStunSound() {

    playClick(
        720,
        0.08,
        0.035
    );

    setTimeout(() => {

        playClick(
            950,
            0.1,
            0.025
        );

    }, 70);

}


function playWinSound() {

    playClick(
        520,
        0.08,
        0.035
    );

    setTimeout(() => {

        playClick(
            720,
            0.1,
            0.035
        );

    }, 90);

    setTimeout(() => {

        playClick(
            950,
            0.15,
            0.04
        );

    }, 190);

}


/* =========================================================
   HELPERS
   ========================================================= */

function randomDice() {

    return Math.floor(
        Math.random() * 6
    ) + 1;

}


function isDouble(
    die1,
    die2
) {

    return die1 === die2;

}


function clearTimers() {

    clearTimeout(
        battleTimer
    );

    clearInterval(
        diceTimer
    );

    clearTimeout(
        nextRoundTimer
    );

    battleTimer = null;

    diceTimer = null;

    nextRoundTimer = null;

}


function addLog(message) {

    const entry =
        document.createElement("div");

    entry.className =
        "log-entry";

    entry.textContent =
        message;

    log.prepend(entry);

}


/* =========================================================
   UI
   ========================================================= */

function updateUI() {

    hp1 =
        Math.max(0, hp1);

    hp2 =
        Math.max(0, hp2);


    hp1Text.textContent =
        hp1;

    hp2Text.textContent =
        hp2;


    hp1Bar.style.width =
        `${(hp1 / MAX_HP) * 100}%`;

    hp2Bar.style.width =
        `${(hp2 / MAX_HP) * 100}%`;


    roundTitle.textContent =
        `РАУНД ${currentRound} / 3`;


    score.textContent =
        `${score1} : ${score2}`;


    player1.classList.toggle(
        "active",
        gameStarted &&
        currentPlayer === 1 &&
        !battleFinished &&
        !roundFinished
    );


    player2.classList.toggle(
        "active",
        gameStarted &&
        currentPlayer === 2 &&
        !battleFinished &&
        !roundFinished
    );


    player1.classList.toggle(
        "stunned",
        stunned1
    );


    player2.classList.toggle(
        "stunned",
        stunned2
    );


    if (
        gameStarted &&
        currentPlayer === 1 &&
        !battleFinished &&
        !roundFinished
    ) {

        turn1.textContent =
            "▶ ХОД ИГРОКА 1";

        turn2.textContent = "";

        arenaTurn.textContent =
            "ХОД ИГРОКА 1";

        arenaTurn.style.color =
            "#24d8ff";

    }

    else if (
        gameStarted &&
        currentPlayer === 2 &&
        !battleFinished &&
        !roundFinished
    ) {

        turn1.textContent = "";

        turn2.textContent =
            "◀ ХОД ИГРОКА 2";

        arenaTurn.textContent =
            "ХОД ИГРОКА 2";

        arenaTurn.style.color =
            "#ff7183";

    }

    else {

        turn1.textContent = "";

        turn2.textContent = "";

        if (!gameStarted) {

            arenaTurn.textContent =
                "ОЖИДАНИЕ";

            arenaTurn.style.color =
                "#647b91";

        }

    }


    stun1.textContent =
        stunned1
            ? "🔥 ОГЛУШЁН"
            : "";


    stun2.textContent =
        stunned2
            ? "🔥 ОГЛУШЁН"
            : "";

}


/* =========================================================
   START ROUND
   ========================================================= */

function startRound() {

    clearTimers();


    hp1 = MAX_HP;

    hp2 = MAX_HP;


    stunned1 = false;

    stunned2 = false;


    gameStarted = false;

    battleFinished = false;

    roundFinished = false;


    currentPlayer = 1;


    drawDice(
        dice1,
        null
    );

    drawDice(
        dice2,
        null
    );


    resultNumber.textContent =
        "—";


    damageText.textContent =
        "Кто начнёт раунд?";


    coinResult.textContent =
        "—";


    coinButton.disabled =
        false;


    status.textContent =
        "ОЖИДАНИЕ";


    arenaTurn.textContent =
        "ОЖИДАНИЕ";


    arenaTurn.style.color =
        "#647b91";


    updateUI();


    addLog(
        `⚔️ Начинается раунд ${currentRound}. HP восстановлены до 1000.`
    );

}


/* =========================================================
   COIN
   ========================================================= */

function determineFirstPlayer() {

    if (
        gameStarted ||
        roundFinished ||
        battleFinished
    ) {
        return;
    }


    initAudio();

    playButtonSound();


    const result =
        Math.random() < 0.5
            ? "ОРЕЛ"
            : "РЕШКА";


    if (result === "ОРЕЛ") {

        currentPlayer = 1;

    } else {

        currentPlayer = 2;

    }


    coinResult.textContent =
        result;


    gameStarted = true;


    coinButton.disabled =
        true;


    status.textContent =
        `ХОД ИГРОКА ${currentPlayer}`;


    addLog(
        `Выпало ${result}. Игрок ${currentPlayer} получает право первого броска.`
    );


    damageText.textContent =
        `Первым бросает игрок ${currentPlayer}`;


    updateUI();


    battleTimer =
        setTimeout(() => {

            automaticTurn();

        }, 800);

}


/* =========================================================
   AUTOMATIC TURN
   ========================================================= */

function automaticTurn() {

    if (
        !gameStarted ||
        battleFinished ||
        roundFinished
    ) {
        return;
    }


    /* Игрок 1 оглушён */

    if (
        currentPlayer === 1 &&
        stunned1
    ) {

        stunned1 = false;


        addLog(
            "Игрок 1 оглушён и пропускает этот ход."
        );


        damageText.textContent =
            "Игрок 1 пропускает ход";


        playStunSound();


        updateUI();


        currentPlayer = 2;


        battleTimer =
            setTimeout(() => {

                automaticTurn();

            }, TURN_DELAY);


        return;
    }


    /* Игрок 2 оглушён */

    if (
        currentPlayer === 2 &&
        stunned2
    ) {

        stunned2 = false;


        addLog(
            "Игрок 2 оглушён и пропускает этот ход."
        );


        damageText.textContent =
            "Игрок 2 пропускает ход";


        playStunSound();


        updateUI();


        currentPlayer = 1;


        battleTimer =
            setTimeout(() => {

                automaticTurn();

            }, TURN_DELAY);


        return;
    }


    rollDiceAutomatically();

}


/* =========================================================
   AUTOMATIC DICE
   ========================================================= */

function rollDiceAutomatically() {

    if (
        !gameStarted ||
        battleFinished ||
        roundFinished
    ) {
        return;
    }


    dice1.classList.add(
        "rolling"
    );

    dice2.classList.add(
        "rolling"
    );


    resultNumber.textContent =
        "••";


    damageText.textContent =
        "БРОСОК...";


    playDiceSound();


    const animationStart =
        Date.now();


    diceTimer =
        setInterval(() => {

            const temp1 =
                randomDice();

            const temp2 =
                randomDice();


            drawDice(
                dice1,
                temp1
            );

            drawDice(
                dice2,
                temp2
            );


            playDiceSound();


            if (
                Date.now() -
                animationStart >=
                DICE_ANIMATION_TIME
            ) {

                clearInterval(
                    diceTimer
                );

                diceTimer = null;


                finishDiceRoll();

            }

        }, 80);

}


/* =========================================================
   FINISH DICE
   ========================================================= */

function finishDiceRoll() {

    dice1.classList.remove(
        "rolling"
    );

    dice2.classList.remove(
        "rolling"
    );


    const die1 =
        randomDice();

    const die2 =
        randomDice();


    const number =
        die1 * 10 + die2;


    drawDice(
        dice1,
        die1
    );

    drawDice(
        dice2,
        die2
    );


    resultNumber.textContent =
        number;


    const attacker =
        currentPlayer;

    const defender =
        currentPlayer === 1
            ? 2
            : 1;


    if (attacker === 1) {

        hp2 -= number;

    } else {

        hp1 -= number;

    }


    hp1 =
        Math.max(
            0,
            hp1
        );

    hp2 =
        Math.max(
            0,
            hp2
        );


    damageText.textContent =
        `УРОН: ${number}`;


    playHitSound();


    addLog(
        `Игрок ${attacker} выбросил ${number} и нанёс ${number} урона игроку ${defender}.`
    );


    /* Дубль */

    if (
        isDouble(
            die1,
            die2
        )
    ) {

        if (defender === 1) {

            stunned1 = true;

        } else {

            stunned2 = true;

        }


        addLog(
            `🔥 ДУБЛЬ ${number}! Варвар оглушил игрока ${defender}. Следующий ход игрока ${defender} будет пропущен.`
        );


        playStunSound();

    }


    updateUI();


    /* Проверяем конец раунда */

    if (
        hp1 <= 0 ||
        hp2 <= 0
    ) {

        const roundWinner =
            hp1 <= 0
                ? 2
                : 1;


        finishRound(
            roundWinner
        );


        return;

    }


    /* Следующий игрок */

    currentPlayer =
        currentPlayer === 1
            ? 2
            : 1;


    status.textContent =
        `ХОД ИГРОКА ${currentPlayer}`;


    updateUI();


    battleTimer =
        setTimeout(() => {

            automaticTurn();

        }, TURN_DELAY);

}


/* =========================================================
   FINISH ROUND
   ========================================================= */

function finishRound(
    roundWinner
) {

    roundFinished = true;

    gameStarted = false;


    clearTimeout(
        battleTimer
    );

    battleTimer = null;


    if (
        roundWinner === 1
    ) {

        score1++;

    } else {

        score2++;

    }


    updateUI();


    addLog(
        `🏆 Игрок ${roundWinner} победил в раунде ${currentRound}! Счёт серии: ${score1} : ${score2}.`
    );


    status.textContent =
        `ПОБЕДА ИГРОКА ${roundWinner}`;


    arenaTurn.textContent =
        `РАУНД ${currentRound} ЗАВЕРШЁН`;


    damageText.textContent =
        `РАУНД ${currentRound} ЗАВЕРШЁН`;


    /* Кто-то выиграл два раунда */

    if (
        score1 >= 2 ||
        score2 >= 2
    ) {

        battleFinished = true;


        const overallWinner =
            score1 >= 2
                ? 1
                : 2;


        addLog(
            `👑 Игрок ${overallWinner} выиграл серию со счётом ${score1} : ${score2}!`
        );


        status.textContent =
            "СЕРИЯ ЗАВЕРШЕНА";


        playWinSound();


        nextRoundTimer =
            setTimeout(() => {

                winnerTitle.textContent =
                    `ИГРОК ${overallWinner}`;


                winnerScore.textContent =
                    `Счёт серии: ${score1} : ${score2}`;


                winnerOverlay.classList.add(
                    "show"
                );


            }, 1000);


        return;

    }


    /*
       Если 1 : 1 —
       автоматически начинается третий раунд.
    */

    currentRound++;


    nextRoundTimer =
        setTimeout(() => {

            startRound();


            addLog(
                `⚔️ Раунд ${currentRound}. Серия продолжается.`
            );


        }, NEXT_ROUND_DELAY);

}


/* =========================================================
   RESTART
   ========================================================= */

function restartGame() {

    initAudio();

    playButtonSound();


    clearTimers();


    hp1 = MAX_HP;

    hp2 = MAX_HP;


    score1 = 0;

    score2 = 0;


    currentRound = 1;

    currentPlayer = 1;


    stunned1 = false;

    stunned2 = false;


    gameStarted = false;

    battleFinished = false;

    roundFinished = false;


    winnerOverlay.classList.remove(
        "show"
    );


    log.innerHTML = "";


    addLog(
        "⚔️ Новая серия best-of-3 готова."
    );


    drawDice(
        dice1,
        null
    );

    drawDice(
        dice2,
        null
    );


    resultNumber.textContent =
        "—";


    damageText.textContent =
        "Ожидание начала";


    coinResult.textContent =
        "—";


    coinButton.disabled =
        false;


    status.textContent =
        "ОЖИДАНИЕ";


    arenaTurn.textContent =
        "ОЖИДАНИЕ";


    arenaTurn.style.color =
        "#647b91";


    updateUI();

}


/* =========================================================
   EVENTS
   ========================================================= */

coinButton.addEventListener(
    "click",
    determineFirstPlayer
);


restartButton.addEventListener(
    "click",
    restartGame
);


winnerClose.addEventListener(
    "click",
    restartGame
);


/* =========================================================
   INITIAL
   ========================================================= */

startRound();

</script>
