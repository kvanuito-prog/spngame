<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG TOURNAMENT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>PUBG TOURNAMENT</h1>
    <p>Список слотов и участников</p>
</header>

<section class="stats">
    <div class="stat">
        <span class="stat-number" id="teamCount">0</span>
        <span class="stat-label">Команд</span>
    </div>

    <div class="stat">
        <span class="stat-number">50</span>
        <span class="stat-label">Слотов</span>
    </div>
</section>

<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="Поиск по нику или ID..."
    >
</div>

<div class="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="buffer">1–6</button>
    <button class="filter-btn" data-filter="teams">7–50</button>
</div>

<main>
    <div class="slots" id="slots"></div>

    <div class="no-results" id="noResults">
        Ничего не найдено
    </div>
</main>

<footer>
    PUBG TOURNAMENT
</footer>

<script src="script.js"></script>

</body>
</html>
