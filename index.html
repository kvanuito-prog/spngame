<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Кубики — Битва</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 30%, #1e2a4a 0%, #0a0f1e 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: 10px; gap: 8px;
  }

  /* --- Игроки --- */
  .players { display: flex; gap: 8px; flex-shrink: 0; }
  .player {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 8px 10px;
    transition: all 0.25s ease;
    min-width: 0; position: relative; overflow: hidden;
  }
  .player.active { border-color: #4ade80; box-shadow: 0 0 16px rgba(74,222,128,0.35); background: rgba(74,222,128,0.08); }
  .player.active.p2-active { border-color: #60a5fa; box-shadow: 0 0 16px rgba(96,165,250,0.35); background: rgba(96,165,250,0.08); }
  .player.stunned {
    border-color: #fbbf24 !important;
    background: rgba(251,191,36,0.12) !important;
    animation: stunPulse 0.7s infinite;
  }
  @keyframes stunPulse {
    0%,100% { box-shadow: 0 0 10px rgba(251,191,36,0.4); }
    50%     { box-shadow: 0 0 26px rgba(251,191,36,0.95); }
  }
  .player.dead { border-color: #ef4444; opacity: 0.5; filter: grayscale(0.7); }
  .pname {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: #8892b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player.active .pname { color: #4ade80; }
  .player.active.p2-active .pname { color: #60a5fa; }
  .player.stunned .pname { color: #fbbf24 !important; }
  .pclass { font-size: 10px; letter-spacing: 1px; margin: 2px 0 6px; font-weight: 700; opacity: 0.9; }
  .pclass.assassin { color: #ef4444; }
  .pclass.barbarian { color: #f59e0b; }
  .hp-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; margin-bottom: 4px; }
  .hp-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    border-radius: 4px; transition: width 0.4s ease, background 0.4s ease;
  }
  .hp-fill.low { background: linear-gradient(90deg, #ef4444, #f87171); }
  .hp-val { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; color: #e0e6f0; }
  .stun-badge {
    position: absolute; top: 6px; right: 6px;
    background: #fbbf24; color: #1a1a1a;
    font-size: 10px; font-weight: 800;
    padding: 2px 6px; border-radius: 6px; letter-spacing: 1px;
    display: none;
  }
  .player.stunned .stun-badge { display: block; }

  /* --- Кубики --- */
  .dice-row { display: flex; gap: 16px; justify-content: center; flex-shrink: 0; margin: 2px 0; }
  .die {
    width: 76px; height: 76px;
    background: #ffffff; border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 -4px 8px rgba(0,0,0,0.15);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 10px;
    transition: box-shadow 0.2s ease;
  }
  .die.spinning { animation: shake 0.12s infinite; }
  .die.crit-glow {
    box-shadow: 0 0 30px rgba(239,68,68,0.9), 0 0 60px rgba(251,191,36,0.5), inset 0 -4px 8px rgba(0,0,0,0.15);
    background: #fff2e6;
  }
  @keyframes shake {
    0%   { transform: rotate(-5deg) scale(1.03); }
    50%  { transform: rotate(5deg) scale(0.97); }
    100% { transform: rotate(-5deg) scale(1.03); }
  }
  .pip { display: flex; align-items: center; justify-content: center; }
  .pip::after { content: ""; display: block; width: 14px; height: 14px; background: #1a1a1a; border-radius: 50%; }
  .pip.hidden-pip::after { display: none; }

  /* --- Результат --- */
  .result {
    text-align: center; font-size: 40px; font-weight: 800;
    letter-spacing: 6px; color: #4ade80;
    text-shadow: 0 0 25px rgba(74,222,128,0.5);
    font-variant-numeric: tabular-nums;
    min-height: 48px; line-height: 48px;
    transition: color 0.3s ease;
    flex-shrink: 0;
  }
  .result.p2 { color: #60a5fa; text-shadow: 0 0 25px rgba(96,165,250,0.5); }
  .result.double { color: #fbbf24; text-shadow: 0 0 25px rgba(251,191,36,0.7); }
  .result.crit {
    color: #ef4444;
    text-shadow: 0 0 40px rgba(239,68,68,0.95), 0 0 20px rgba(251,191,36,0.7);
    animation: critFlash 0.45s ease-out;
  }
  @keyframes critFlash {
    0%   { transform: scale(1.7); }
    50%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* --- Лог --- */
  .log-wrap {
    flex: 1 1 auto; min-height: 60px;
    display: flex; flex-direction: column;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; overflow: hidden;
  }
  .log-title {
    padding: 6px 10px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: #8892b0; border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.15); flex-shrink: 0;
  }
  .log-list { flex: 1 1 auto; overflow-y: auto; padding: 2px 0; -webkit-overflow-scrolling: touch; min-height: 0; }
  .log-entry {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    animation: slideIn 0.25s ease;
    font-variant-numeric: tabular-nums;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .log-entry .idx { color: #6b7a99; font-size: 11px; min-width: 28px; }
  .log-entry .who { font-size: 12px; font-weight: 700; }
  .log-entry .who.p1 { color: #4ade80; }
  .log-entry .who.p2 { color: #60a5fa; }
  .log-entry .dmg { margin-left: auto; font-weight: 700; color: #f87171; }
  .log-entry.double .dmg { color: #fbbf24; }
  .log-entry.crit {
    background: rgba(239,68,68,0.14);
    border-left: 3px solid #ef4444;
  }
  .log-entry.crit .dmg {
    color: #ef4444;
    text-shadow: 0 0 8px rgba(239,68,68,0.9);
    font-size: 14px;
  }
  .log-entry.stun { background: rgba(251,191,36,0.10); }
  .log-entry.stun .who { color: #fbbf24; }
  .log-entry.stun .dmg { color: #fbbf24; letter-spacing: 2px; }

  /* --- Регулятор скорости --- */
  .speed-box {
    flex-shrink: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 14px 10px;
  }
  .speed-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .speed-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #8892b0; }
  .speed-value {
    font-size: 18px; font-weight: 800; color: #4ade80;
    letter-spacing: 1px; font-variant-numeric: tabular-nums;
  }
  .speed-value::after { content: "×"; font-size: 13px; margin-left: 1px; opacity: 0.7; }

  input[type="range"].speed-slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px; outline: none;
    margin: 6px 0 0;
    touch-action: manipulation;
  }
  input[type="range"].speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #6ee7a3, #4ade80);
    cursor: pointer;
    box-shadow: 0 0 12px rgba(74,222,128,0.6), 0 2px 6px rgba(0,0,0,0.5);
    border: 2px solid #0a0f1e;
  }
  input[type="range"].speed-slider::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    background: #4ade80; cursor: pointer;
    border: 2px solid #0a0f1e;
    box-shadow: 0 0 12px rgba(74,222,128,0.6);
  }

  /* --- Кнопки --- */
  .controls { display: flex; gap: 8px; flex-shrink: 0; }
  .control-btn {
    flex: 1; padding: 15px;
    font-size: 15px; font-weight: 800;
    border: none; border-radius: 12px;
    cursor: pointer; letter-spacing: 1.5px;
    font-family: inherit;
    color: #0a0f1e;
    transition: transform 0.1s ease;
  }
  .control-btn:active { transform: scale(0.97); }
  .control-btn.start { background: linear-gradient(145deg, #4ade80, #22c55e); }
  .control-btn.stop  { background: linear-gradient(145deg, #f87171, #ef4444); color: #fff; }
  .control-btn.hidden { display: none; }

  .hint {
    text-align: center; color: #8892b0; font-size: 11px;
    letter-spacing: 1px; flex-shrink: 0; min-height: 14px;
  }

  /* --- Overlays --- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
    overflow-y: auto;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    background: linear-gradient(160deg, #1e2a4a, #0f1729);
    border: 2px solid rgba(74,222,128,0.4);
    border-radius: 20px; padding: 24px 20px;
    text-align: center; max-width: 420px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    margin: auto;
  }
  .overlay-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #4ade80; }
  .overlay-sub { font-size: 13px; color: #8892b0; margin-bottom: 20px; }
  .btn {
    background: linear-gradient(145deg, #4ade80, #22c55e);
    color: #0a0f1e; border: none;
    padding: 14px 28px; font-size: 15px; font-weight: 800;
    border-radius: 12px; cursor: pointer; letter-spacing: 1px;
    width: 100%; font-family: inherit;
    transition: transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-secondary {
    background: transparent;
    border: 2px solid rgba(74,222,128,0.45);
    color: #4ade80;
    margin-top: 10px;
  }
  .btn-secondary:active { transform: scale(0.97); }

  /* --- Экран выбора классов --- */
  .select-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 4px;
    color: #fff;
  }
  .select-subtitle {
    font-size: 12px;
    color: #8892b0;
    margin-bottom: 18px;
    letter-spacing: 1px;
  }
  .select-row {
    margin-bottom: 14px;
    text-align: left;
  }
  .select-pname {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .select-pname.p1 { color: #4ade80; }
  .select-pname.p2 { color: #60a5fa; }
  .select-list {
    display: flex;
    gap: 8px;
  }
  .class-card {
    flex: 1;
    padding: 10px 8px;
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(255,255,255,0.03);
    min-width: 0;
  }
  .class-card.selected {
    border-color: #4ade80;
    background: rgba(74,222,128,0.12);
    box-shadow: 0 0 16px rgba(74,222,128,0.35);
  }
  .class-card .icon {
    font-size: 26px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .class-card .cname {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .class-card.selected .cname { color: #4ade80; }
  .class-card .cdesc {
    font-size: 9.5px;
    line-height: 1.3;
    color: #8892b0;
  }

  /* --- Планшет --- */
  @media (min-width: 700px) {
    #app { max-width: 720px; margin: 0 auto; padding: 16px; gap: 12px; }
    .die { width: 100px; height: 100px; padding: 12px; }
    .pip::after { width: 18px; height: 18px; }
    .result { font-size: 56px; min-height: 66px; line-height: 66px; }
    .hp-val { font-size: 20px; }
    .pname { font-size: 13px; }
    .pclass { font-size: 11px; }
    .class-card .icon { font-size: 32px; }
    .class-card .cname { font-size: 14px; }
    .class-card .cdesc { font-size: 11px; }
  }
</style>
</head>
<body>

<!-- ЭКРАН ВЫБОРА КЛАССОВ -->
<div class="overlay show" id="selectOverlay">
  <div class="overlay-card">
    <div class="select-title">Выбор классов</div>
    <div class="select-subtitle">Тапни по классу для каждого игрока</div>

    <div class="select-row">
      <div class="select-pname p1">Игрок 1</div>
      <div class="select-list" data-player="1"></div>
    </div>

    <div class="select-row">
      <div class="select-pname p2">Игрок 2</div>
      <div class="select-list" data-player="2"></div>
    </div>

    <button class="btn" id="startGameBtn">НАЧАТЬ БОЙ</button>
  </div>
</div>

<!-- ОСНОВНОЙ ЭКРАН ИГРЫ -->
<div id="app">
  <div class="players">
    <div class="player" id="p1">
      <div class="stun-badge">⚡ СТАН</div>
      <div class="pname">Игрок 1</div>
      <div class="pclass" id="pclass1">—</div>
      <div class="hp-bar"><div class="hp-fill" id="hpFill1"></div></div>
      <div class="hp-val" id="hpVal1">1000</div>
    </div>
    <div class="player" id="p2">
      <div class="stun-badge">⚡ СТАН</div>
      <div class="pname">Игрок 2</div>
      <div class="pclass" id="pclass2">—</div>
      <div class="hp-bar"><div class="hp-fill" id="hpFill2"></div></div>
      <div class="hp-val" id="hpVal2">1000</div>
    </div>
  </div>

  <div class="dice-row">
    <div class="die" id="die1"></div>
    <div class="die" id="die2"></div>
  </div>

  <div class="result" id="result">— —</div>

  <div class="log-wrap">
    <div class="log-title">История</div>
    <div class="log-list" id="logList"></div>
  </div>

  <div class="speed-box">
    <div class="speed-header">
      <span class="speed-label">Скорость</span>
      <span class="speed-value" id="speedValue">4</span>
    </div>
    <input type="range" min="1" max="20" value="4" step="1" class="speed-slider" id="speedSlider">
  </div>

  <div class="controls">
    <button class="control-btn start" id="battleBtn">▶ НАЧАТЬ БОЙ</button>
  </div>

  <div class="hint" id="hint">Выбери классы и начни бой</div>
</div>

<!-- ОКНО ПОБЕДЫ -->
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-title" id="overlayTitle">Победа!</div>
    <div class="overlay-sub" id="overlaySub"></div>
    <button class="btn" id="restartBtn">Играть снова</button>
    <button class="btn btn-secondary" id="changeClassesBtn">Сменить классы</button>
  </div>
</div>

<script>
  // ============ КЛАССЫ ============
  var CLASSES = {
    assassin: {
      icon: '🗡',
      short: 'Ассасин',
      label: '🗡 Ассасин',
      css: 'assassin',
      desc: 'Дубль → реролл ×2 крит. Без стана.'
    },
    barbarian: {
      icon: '⚔',
      short: 'Варвар',
      label: '⚔ Варвар',
      css: 'barbarian',
      desc: 'Дубль → стан + обычный урон.'
    }
  };

  // Текущие классы в бою
  var classes = { 1: 'assassin', 2: 'barbarian' };
  // Временный выбор в экране
  var pendingClasses = { 1: 'assassin', 2: 'barbarian' };

  // ============ ЭЛЕМЕНТЫ ============
  var dieEls = [document.getElementById('die1'), document.getElementById('die2')];
  var resultEl = document.getElementById('result');
  var logList = document.getElementById('logList');
  var hintEl = document.getElementById('hint');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlaySub = document.getElementById('overlaySub');
  var battleBtn = document.getElementById('battleBtn');
  var speedSlider = document.getElementById('speedSlider');
  var speedValue = document.getElementById('speedValue');
  var selectOverlay = document.getElementById('selectOverlay');

  var MAX_HP = 1000;
  var MAX_LOG = 60;
  var speed = 4;

  function getSpinDuration()  { return Math.max(70, 900 / speed); }
  function getPauseBetween()  { return Math.max(8,  120 / speed); }
  function getStunPause()     { return Math.max(150, 1200 / speed); }
  function getCritPause()     { return Math.max(80, 500 / speed); }
  function getFrameInterval() { return Math.max(16, getSpinDuration() / 5); }

  var rolling = false;
  var rollNumber = 0;
  var turn = 1;
  var hp1 = MAX_HP;
  var hp2 = MAX_HP;
  var gameOver = false;
  var stunned = { 1: false, 2: false };
  var autoPlay = false;
  var autoTimer = null;

  var pipPositions = {
    1: [4], 2: [0, 8], 3: [0, 4, 8],
    4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
  };

  // ============ РЕНДЕР КУБИКОВ ============
  function renderDie(el, value) {
    el.innerHTML = '';
    var pips = pipPositions[value] || [];
    for (var i = 0; i < 9; i++) {
      var cell = document.createElement('div');
      cell.className = 'pip';
      var show = false;
      for (var j = 0; j < pips.length; j++) { if (pips[j] === i) { show = true; break; } }
      if (!show) cell.className += ' hidden-pip';
      el.appendChild(cell);
    }
  }
  function randomDie() { return Math.floor(Math.random() * 6) + 1; }
  function setDieCritGlow(on) {
    dieEls.forEach(function(el) {
      if (on) el.classList.add('crit-glow');
      else el.classList.remove('crit-glow');
    });
  }

  // ============ ЭКРАН ВЫБОРА КЛАССОВ ============
  function renderSelectionUI() {
    ['1', '2'].forEach(function(p) {
      var container = document.querySelector('.select-list[data-player="' + p + '"]');
      container.innerHTML = '';
      Object.keys(CLASSES).forEach(function(key) {
        var c = CLASSES[key];
        var card = document.createElement('div');
        card.className = 'class-card' + (pendingClasses[p] === key ? ' selected' : '');
        card.innerHTML =
          '<div class="icon">' + c.icon + '</div>' +
          '<div class="cname">' + c.short + '</div>' +
          '<div class="cdesc">' + c.desc + '</div>';
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          pendingClasses[p] = key;
          renderSelectionUI();
        });
        card.addEventListener('touchstart', function(e) {
          e.stopPropagation();
        }, { passive: true });
        container.appendChild(card);
      });
    });
  }

  function openSelection() {
    pendingClasses[1] = classes[1];
    pendingClasses[2] = classes[2];
    renderSelectionUI();
    selectOverlay.classList.add('show');
  }

  function startGameFromSelection() {
    classes[1] = pendingClasses[1];
    classes[2] = pendingClasses[2];
    selectOverlay.classList.remove('show');
    resetGame();
  }

  // ============ UI ИГРОКОВ ============
  function updatePlayersUI() {
    document.getElementById('hpVal1').textContent = hp1;
    document.getElementById('hpVal2').textContent = hp2;

    var fill1 = document.getElementById('hpFill1');
    var fill2 = document.getElementById('hpFill2');
    fill1.style.width = (hp1 / MAX_HP * 100) + '%';
    fill2.style.width = (hp2 / MAX_HP * 100) + '%';
    fill1.className = 'hp-fill' + (hp1 / MAX_HP < 0.3 ? ' low' : '');
    fill2.className = 'hp-fill' + (hp2 / MAX_HP < 0.3 ? ' low' : '');

    var pc1 = document.getElementById('pclass1');
    var pc2 = document.getElementById('pclass2');
    var c1 = CLASSES[classes[1]];
    var c2 = CLASSES[classes[2]];
    pc1.textContent = c1 ? c1.label : '—';
    pc1.className = 'pclass ' + (c1 ? c1.css : '');
    pc2.textContent = c2 ? c2.label : '—';
    pc2.className = 'pclass ' + (c2 ? c2.css : '');

    var p1 = document.getElementById('p1');
    var p2 = document.getElementById('p2');
    var cls1 = 'player';
    var cls2 = 'player';
    if (!gameOver) {
      if (turn === 1) cls1 += ' active';
      if (turn === 2) cls2 += ' active p2-active';
    }
    if (stunned[1]) cls1 += ' stunned';
    if (stunned[2]) cls2 += ' stunned';
    if (hp1 <= 0) cls1 += ' dead';
    if (hp2 <= 0) cls2 += ' dead';
    p1.className = cls1;
    p2.className = cls2;
  }

  function setHint(text) { hintEl.textContent = text; }

  // ============ ЛОГ ============
  function addLogEntry(number, attacker, dmg, isDouble, stunCaused, isCrit) {
    var entry = document.createElement('div');
    entry.className = 'log-entry' + (isDouble ? ' double' : '') + (isCrit ? ' crit' : '');
    var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = '#' + number;
    var who = document.createElement('span'); who.className = 'who p' + attacker; who.textContent = 'Игрок ' + attacker;
    var dmgEl = document.createElement('span'); dmgEl.className = 'dmg';
    var suffix = '';
    if (isCrit) suffix = ' 💥 КРИТ×2';
    else if (isDouble) suffix = ' ★';
    if (stunCaused) suffix += ' ⚡';
    dmgEl.textContent = '−' + dmg + suffix;
    entry.appendChild(idx); entry.appendChild(who); entry.appendChild(dmgEl);
    logList.insertBefore(entry, logList.firstChild);
    trimLog();
  }

  function addStunSkipLog(playerNum) {
    var entry = document.createElement('div');
    entry.className = 'log-entry stun';
    var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = '⚡';
    var who = document.createElement('span'); who.className = 'who'; who.textContent = 'Игрок ' + playerNum + ' оглушён';
    var dmgEl = document.createElement('span'); dmgEl.className = 'dmg'; dmgEl.textContent = 'ПРОПУСК';
    entry.appendChild(idx); entry.appendChild(who); entry.appendChild(dmgEl);
    logList.insertBefore(entry, logList.firstChild);
    trimLog();
  }

  function trimLog() {
    while (logList.children.length > MAX_LOG) logList.removeChild(logList.lastChild);
  }

  // ============ СПИН КУБИКОВ ============
  function spinDice(callback) {
    dieEls.forEach(function(el) { el.classList.add('spinning'); });
    resultEl.textContent = '— —';
    resultEl.className = 'result';
    setDieCritGlow(false);

    var spinDuration = getSpinDuration();
    var frameInterval = getFrameInterval();
    var start = performance.now();

    var timer = setInterval(function() {
      dieEls.forEach(function(el) { renderDie(el, randomDie()); });
      if (performance.now() - start >= spinDuration) {
        clearInterval(timer);
        var v1 = randomDie();
        var v2 = randomDie();
        renderDie(dieEls[0], v1);
        renderDie(dieEls[1], v2);
        dieEls.forEach(function(el) { el.classList.remove('spinning'); });
        callback(v1, v2);
      }
    }, frameInterval);
  }

  // ============ ОСНОВНОЙ БРОСОК ============
  function roll() {
    if (rolling || gameOver) return;
    rolling = true;

    spinDice(function(v1, v2) {
      var attacker = turn;
      var defender = attacker === 1 ? 2 : 1;
      var cls = classes[attacker];
      var isDouble = v1 === v2;
      var dmg = v1 * 10 + v2;

      resultEl.textContent = String(dmg);
      resultEl.className = 'result' + (isDouble ? ' double' : (attacker === 2 ? ' p2' : ''));

      // === Ассасин ===
      if (cls === 'assassin' && isDouble) {
        setHint('🗡 Дубль! Переброс на крит...');
        setTimeout(function() {
          spinDice(function(r1, r2) {
            var critDmg = (r1 * 10 + r2) * 2;
            resultEl.textContent = critDmg + '';
            resultEl.className = 'result crit';
            setDieCritGlow(true);
            setTimeout(function() { setDieCritGlow(false); }, 600);
            applyHit(attacker, defender, critDmg, false, false, true);
          });
        }, getCritPause());
        return;
      }

      // === Варвар ===
      var stunCaused = false;
      if (cls === 'barbarian' && isDouble && hp1 > 0 && hp2 > 0) {
        stunned[defender] = true;
        stunCaused = true;
      }

      applyHit(attacker, defender, dmg, isDouble, stunCaused, false);
    });
  }

  // ============ УРОН И ПЕРЕХОД ХОДА ============
  function applyHit(attacker, defender, dmg, isDouble, stunCaused, isCrit) {
    rollNumber++;

    if (attacker === 1) hp2 = Math.max(0, hp2 - dmg);
    else hp1 = Math.max(0, hp1 - dmg);

    addLogEntry(rollNumber, attacker, dmg, isDouble, stunCaused, isCrit);

    if (hp1 <= 0 || hp2 <= 0) {
      gameOver = true;
      stunned[1] = false;
      stunned[2] = false;
      updatePlayersUI();
      showGameOver();
      rolling = false;
      return;
    }

    turn = defender;
    updatePlayersUI();

    var extraDelay = 0;

    if (stunned[turn]) {
      var skipPlayer = turn;
      var stunPause = getStunPause();
      setHint('⚡ Игрок ' + skipPlayer + ' оглушён!');
      addStunSkipLog(skipPlayer);
      extraDelay = stunPause;

      setTimeout(function() {
        stunned[skipPlayer] = false;
        turn = skipPlayer === 1 ? 2 : 1;
        updatePlayersUI();
        if (!autoPlay) setHint('Тап — бросок Игрока ' + turn);
      }, stunPause);
    } else if (!autoPlay) {
      setHint('Тап — бросок Игрока ' + turn);
    }

    rolling = false;

    if (autoPlay) {
      clearTimeout(autoTimer);
      autoTimer = setTimeout(function() {
        if (autoPlay && !gameOver) roll();
      }, getPauseBetween() + extraDelay);
    }
  }

  // ============ КОНЕЦ ИГРЫ ============
  function showGameOver() {
    var winner = hp1 <= 0 ? 2 : 1;
    overlayTitle.textContent = 'Игрок ' + winner + ' победил!';
    overlayTitle.style.color = winner === 1 ? '#4ade80' : '#60a5fa';
    var c1 = CLASSES[classes[1]].label;
    var c2 = CLASSES[classes[2]].label;
    overlaySub.textContent = c1 + ': ' + hp1 + ' HP  ·  ' + c2 + ': ' + hp2 + ' HP  ·  ' + speed + '×';
    overlay.classList.add('show');
    setHint('Игра окончена');
    battleBtn.classList.add('hidden');
  }

  function startAuto() {
    if (gameOver) return;
    autoPlay = true;
    battleBtn.textContent = '⏸ СТОП';
    battleBtn.className = 'control-btn stop';
    setHint('⚔ Бой идёт... (' + speed + '×)');
    roll();
  }

  function stopAuto() {
    autoPlay = false;
    clearTimeout(autoTimer);
    battleBtn.textContent = '▶ НАЧАТЬ БОЙ';
    battleBtn.className = 'control-btn start';
    if (!gameOver) setHint('Пауза. Нажми «Начать бой»');
  }

  function resetGame() {
    hp1 = MAX_HP; hp2 = MAX_HP;
    turn = 1; rollNumber = 0;
    gameOver = false; rolling = false;
    autoPlay = false;
    clearTimeout(autoTimer);
    stunned[1] = false; stunned[2] = false;
    logList.innerHTML = '';
    resultEl.textContent = '— —';
    resultEl.className = 'result';
    overlay.classList.remove('show');
    battleBtn.textContent = '▶ НАЧАТЬ БОЙ';
    battleBtn.className = 'control-btn start';
    battleBtn.classList.remove('hidden');
    setDieCritGlow(false);
    dieEls.forEach(function(el) { renderDie(el, randomDie()); });
    updatePlayersUI();
    setHint('Нажми «Начать бой»');
  }

  // ============ ОБРАБОТЧИКИ ============
  document.body.addEventListener('click', function(e) {
    if (e.target.closest('.log-wrap')) return;
    if (e.target.closest('.controls')) return;
    if (e.target.closest('.speed-box')) return;
    if (e.target.closest('.overlay')) return;
    if (autoPlay || gameOver) return;
    roll();
  });
  document.body.addEventListener('touchstart', function(e) {
    if (e.target.closest('.log-wrap')) return;
    if (e.target.closest('.controls')) return;
    if (e.target.closest('.speed-box')) return;
    if (e.target.closest('.overlay')) return;
    e.preventDefault();
    if (autoPlay || gameOver) return;
    roll();
  }, { passive: false });

  battleBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (autoPlay) stopAuto();
    else startAuto();
  });

  speedSlider.addEventListener('input', function(e) {
    e.stopPropagation();
    speed = parseInt(speedSlider.value, 10);
    speedValue.textContent = speed;
    if (autoPlay) setHint('⚔ Бой идёт... (' + speed + '×)');
  });
  speedSlider.addEventListener('click', function(e) { e.stopPropagation(); });
  speedSlider.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });
  speedSlider.addEventListener('touchend', function(e) { e.stopPropagation(); });

  document.getElementById('restartBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    resetGame();
  });

  document.getElementById('changeClassesBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    overlay.classList.remove('show');
    openSelection();
  });

  document.getElementById('startGameBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    startGameFromSelection();
  });

  // ============ СТАРТ ============
  renderSelectionUI();
  dieEls.forEach(function(el) { renderDie(el, randomDie()); });
  updatePlayersUI();
</script>
</body>
</html>
