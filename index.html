<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>WORLD 10×10</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;

    background: #02050a;
    color: white;

    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
}


/* ==================================================
   GAME
================================================== */

.game {
    width: 100%;
    max-width: 1100px;

    margin: auto;

    padding: 15px;
}


/* ==================================================
   HEADER
================================================== */

.header {
    text-align: center;

    margin-bottom: 12px;
}

.header h1 {
    margin: 0;

    font-size: clamp(
        25px,
        5vw,
        42px
    );

    letter-spacing: 2px;
}

.header p {
    margin: 6px 0 0;

    color: #7f8da0;

    font-size: 14px;
}


/* ==================================================
   SCENE
================================================== */

.scene {

    width: 100%;

    height: min(
        72vh,
        680px
    );

    min-height: 400px;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;

    overflow: hidden;

    border-radius: 20px;

    background:
        radial-gradient(
            circle at center,
            #102334,
            #07111b 45%,
            #020407 100%
        );

    border: 1px solid #172536;

    touch-action: none;
}


/* ==================================================
   SPHERE CONTAINER
================================================== */

.world {

    width: min(
        78vw,
        520px
    );

    aspect-ratio: 1 / 1;

    position: relative;

    transform-style: preserve-3d;

    perspective: 1000px;

}


/* ==================================================
   EARTH
================================================== */

.earth {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 35% 30%,
            #62b4d6 0%,
            #2c7898 28%,
            #0c405b 62%,
            #031624 100%
        );

    box-shadow:

        inset -60px -25px 90px
        rgba(0,0,0,.75),

        inset 20px 15px 45px
        rgba(255,255,255,.12),

        0 0 70px
        rgba(0,150,255,.28);

}


/* ==================================================
   REALISTIC LIGHT
================================================== */

.earth::after {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: 50%;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 28% 25%,
            rgba(255,255,255,.15),
            transparent 28%
        ),

        radial-gradient(
            circle at 70% 70%,
            rgba(0,0,0,.55),
            transparent 65%
        );

    z-index: 30;
}


/* ==================================================
   LAND
================================================== */

.land {

    position: absolute;

    inset: 6%;

    background:

        radial-gradient(
            ellipse at 28% 28%,
            #71845d 0 12%,
            transparent 13%
        ),

        radial-gradient(
            ellipse at 53% 28%,
            #8c875d 0 14%,
            transparent 15%
        ),

        radial-gradient(
            ellipse at 70% 50%,
            #58764f 0 16%,
            transparent 17%
        ),

        radial-gradient(
            ellipse at 45% 70%,
            #6c8058 0 13%,
            transparent 14%
        );

    clip-path:

        polygon(

            5% 31%,
            13% 20%,
            25% 21%,
            34% 10%,
            48% 15%,
            58% 28%,
            72% 25%,
            85% 35%,
            96% 49%,
            82% 57%,
            87% 70%,
            70% 75%,
            58% 91%,
            43% 77%,
            29% 84%,
            20% 67%,
            7% 57%

        );

    opacity: .95;

    z-index: 2;
}


/* ==================================================
   GLOBAL GRID
================================================== */

.grid {

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(255,255,255,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.12) 1px,
            transparent 1px
        );

    background-size: 18px 18px;

    opacity: .35;

    z-index: 10;

    pointer-events: none;
}


/* ==================================================
   ATMOSPHERE
================================================== */

.atmosphere {

    position: absolute;

    inset: -2px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 40;

    box-shadow:

        inset 0 0 35px
        rgba(70,200,255,.25),

        inset -50px -15px 70px
        rgba(0,0,0,.5);
}


/* ==================================================
   INFO
================================================== */

.info {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;

    margin-top: 12px;
}

.box {

    background: #0b1018;

    border: 1px solid #182433;

    border-radius: 10px;

    padding: 10px;
}

.label {

    color: #718095;

    font-size: 11px;
}

.value {

    margin-top: 4px;

    color: #24d8ff;

    font-size: 17px;

    font-weight: bold;
}


.selected {

    margin-top: 10px;

    padding: 12px;

    text-align: center;

    background: #0b1018;

    border: 1px solid #182433;

    border-radius: 10px;

    color: #8795a7;
}

.selected span {

    color: #24d8ff;

    font-weight: bold;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:700px) {

    .game {
        padding: 8px;
    }

    .scene {

        height: 62vh;

        min-height: 330px;
    }

    .info {

        grid-template-columns:
            repeat(2, 1fr);
    }

}

</style>
</head>


<body>


<div class="game">


    <div class="header">

        <h1>
            🌍 WORLD 10×10
        </h1>

        <p>
            Глобальная карта Земли
        </p>

    </div>


    <div
        class="scene"
        id="scene"
    >

        <div
            class="world"
            id="world"
        >

            <div
                class="earth"
                id="earth"
            >

                <div class="land"></div>

                <div class="grid"></div>

                <div class="atmosphere"></div>

            </div>

        </div>

    </div>


    <div class="info">

        <div class="box">

            <div class="label">
                РАЗМЕР КЛЕТКИ
            </div>

            <div class="value">
                10 × 10 м
            </div>

        </div>


        <div class="box">

            <div class="label">
                ПЛОЩАДЬ
            </div>

            <div class="value">
                100 м²
            </div>

        </div>


        <div class="box">

            <div class="label">
                СУША
            </div>

            <div class="value">
                ≈ 1,49 трлн
            </div>

        </div>


        <div class="box">

            <div class="label">
                ВЫБРАНО
            </div>

            <div
                class="value"
                id="selected">
                0
            </div>

        </div>

    </div>


</div>


<script>

/* ==================================================
   НАСТРОЙКИ
================================================== */

const scene =
    document.getElementById("scene");

const world =
    document.getElementById("world");


/* ==================================================
   СОСТОЯНИЕ
================================================== */

let dragging = false;

let lastX = 0;
let lastY = 0;

let rotationY = 0;
let rotationX = 0;


/* ==================================================
   НАЧАЛО ПОВОРОТА
================================================== */

scene.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        scene.setPointerCapture(
            event.pointerId
        );

    }
);


/* ==================================================
   ВРАЩЕНИЕ
================================================== */

scene.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }


        const dx =
            event.clientX -
            lastX;


        const dy =
            event.clientY -
            lastY;


        lastX =
            event.clientX;

        lastY =
            event.clientY;


        rotationY +=
            dx * 0.5;


        rotationX -=
            dy * 0.25;


        /*
            Ограничиваем вертикальный наклон
        */

        rotationX =
            Math.max(
                -25,
                Math.min(
                    25,
                    rotationX
                )
            );


        /*
            ВАЖНО:

            Мы НЕ наклоняем саму сферу.

            Мы вращаем контейнер
            в 3D-пространстве.
        */

        world.style.transform =
            "rotateX(" +
            rotationX +
            "deg) " +

            "rotateY(" +
            rotationY +
            "deg)";

    }
);


/* ==================================================
   ОКОНЧАНИЕ
================================================== */

function stopDrag() {

    dragging = false;

}


scene.addEventListener(
    "pointerup",
    stopDrag
);

scene.addEventListener(
    "pointercancel",
    stopDrag
);


/* ==================================================
   АВТОМАТИЧЕСКОЕ ВРАЩЕНИЕ
================================================== */

let autoRotate = true;


function animate() {

    /*
        Если пользователь не трогает Землю,
        она медленно вращается.
    */

    if (!dragging && autoRotate) {

        rotationY += 0.08;


        world.style.transform =
            "rotateX(" +
            rotationX +
            "deg) " +

            "rotateY(" +
            rotationY +
            "deg)";

    }


    requestAnimationFrame(
        animate
    );

}


animate();

</script>


</body>
</html>
