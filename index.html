<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPN BATTLE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #f3f7fb;
    background:
        radial-gradient(circle at top, #111c2d 0%, #05070b 55%),
        #05070b;
}

.game {
    width: min(1200px, 95%);
    margin: 0 auto;
    padding: 25px 0 40px;
}

.title {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 25px;
    color: #24d8ff;
    text-shadow: 0 0 20px rgba(36,216,255,.45);
}

/* COIN */

.coin-area {
    background: #0b1018;
    border: 1px solid #1c3145;
    border-radius: 18px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,168,255,.08);
    margin-bottom: 25px;
}

.coin-title {
    font-size: 18px;
    font-weight: 800;
    color: #24d8ff;
    margin-bottom: 15px;
}

.coin {
    font-size: 65px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.coin-result {
    min-height: 25px;
    margin: 10px 0 15px;
    color: #c9d6e2;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    font-weight: 900;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none;
}

.coin-button {
    padding: 14px 28px;
    border-radius: 10px;
    background: linear-gradient(135deg, #008ed6, #00c8ff);
    box-shadow: 0 0 18px rgba(0,168,255,.25);
}

/* BATTLE */

.battle {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    gap: 20px;
    align-items: stretch;
}

.player {
    background: #0b1018;
    border: 1px solid #1c3145;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    min-height: 300px;
}

.player-name {
    font-size: 25px;
    font-weight: 900;
    margin-bottom: 8px;
}

.class-name {
    color: #ffb347;
    font-weight: 800;
    margin-bottom: 25px;
}

.hp-label {
    font-size: 16px;
    color: #9eafbf;
    margin-bottom: 8px;
}

.hp {
    font-size: 38px;
    font-weight: 900;
    color: #4cff88;
}

.hp-bar {
    width: 100%;
    height: 14px;
    background: #1b222c;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}

.hp-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #20d66b, #4cff88);
    transition: width .35s;
}

.status {
    margin-top: 25px;
    min-height: 25px;
    font-weight: 900;
}

.stunned {
    color: #ffcf40;
}

/* ARENA */

.arena {
    background: #0e141e;
    border: 1px solid #1c3145;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 0 30px rgba(0,168,255,.08);
}

.turn {
    min-height: 25px;
    color: #24d8ff;
    font-weight: 900;
    margin-bottom: 25px;
}

.dice {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin: 20px 0;
}

.die {
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f7fb;
    color: #111;
    border-radius: 16px;
    font-size: 55px;
    box-shadow: 0 0 25px rgba(255,255,255,.15);
}

.rolling {
    animation: shake .12s infinite;
}

@keyframes shake {
    0% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
    100% { transform: rotate(-5deg); }
}

.result {
    font-size: 55px;
    font-weight: 900;
    color: #24d8ff;
    min-height: 70px;
    text-shadow: 0 0 20px rgba(36,216,255,.35);
}

.roll-button {
    margin-top: 10px;
    padding: 15px 25px;
    border-radius: 10px;
    background: linear-gradient(135deg, #0075b5, #00a8ff);
}

/* LOG */

.log-container {
    margin-top: 25px;
    background: #0b1018;
    border: 1px solid #1c3145;
    border-radius: 18px;
    padding: 20px;
}

.log-title {
    color: #24d8ff;
    font-weight: 900;
    margin-bottom: 15px;
}

.log {
    max-height: 280px;
    overflow-y: auto;
}

.log-entry {
    padding: 10px 12px;
    margin-bottom: 7px;
    background: #0e141e;
    border-left: 3px solid #00a8ff;
    border-radius: 5px;
    font-size: 14px;
}

.log-entry.special {
    border-left-color: #ffcf40;
}

.log-entry.win {
    border-left-color: #4cff88;
    color: #4cff88;
    font-weight: 900;
}

/* RESTART */

.restart {
    text-align: center;
    margin-top: 20px;
}

.restart button {
    padding: 12px 24px;
    border-radius: 10px;
    background: #182330;
    border: 1px solid #30485d;
}

/* MOBILE */

@media (max-width: 800px) {
    .title {
        font-size: 30px;
    }

    .battle {
        grid-template-columns: 1fr;
    }

    .player {
        min-height: auto;
    }

    .arena {
        order: -1;
    }

    .die {
        width: 75px;
        height: 75px;
        font-size: 45px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="title">⚔️ SPN BATTLE</div>

    <!-- ОРЕЛ / РЕШКА -->

    <div class="coin-area">

        <div class="coin-title">
            🪙 ОПРЕДЕЛЕНИЕ ПЕРВОГО ХОДА
        </div>

        <div class="coin" id="coin">🪙</div>

        <div class="coin-result" id="coinResult">
            Нажмите кнопку, чтобы определить право первого броска
        </div>

        <button class="coin-button" id="coinButton">
            ОРЕЛ / РЕШКА
        </button>

    </div>

    <!-- БОЙ -->

    <div class="battle">

        <!-- ИГРОК 1 -->

        <div class="player">

            <div class="player-name">
                ИГРОК 1
            </div>

            <div class="class-name">
                🪓 ВАРВАР
            </div>

            <div class="hp-label">
                ЗДОРОВЬЕ
            </div>

            <div class="hp" id="hp1Text">
                1000 HP
            </div>

            <div class="hp-bar">
                <div class="hp-fill" id="hp1Fill"></div>
            </div>

            <div class="status" id="status1"></div>

        </div>

        <!-- АРЕНА -->

        <div class="arena">

            <div class="turn" id="turnText">
                Сначала определите первый ход
            </div>

            <div class="dice">

                <div class="die" id="die1">
                    ⚄
                </div>

                <div class="die" id="die2">
                    ⚄
                </div>

            </div>

            <div class="result" id="result">
                —
            </div>

            <button class="roll-button" id="rollButton" disabled>
                🎲 БРОСИТЬ КУБИКИ
            </button>

        </div>

        <!-- ИГРОК 2 -->

        <div class="player">

            <div class="player-name">
                ИГРОК 2
            </div>

            <div class="class-name">
                🪓 ВАРВАР
            </div>

            <div class="hp-label">
                ЗДОРОВЬЕ
            </div>

            <div class="hp" id="hp2Text">
                1000 HP
            </div>

            <div class="hp-bar">
                <div class="hp-fill" id="hp2Fill"></div>
            </div>

            <div class="status" id="status2"></div>

        </div>

    </div>

    <!-- ЛОГ -->

    <div class="log-container">

        <div class="log-title">
            📜 ИГРОВОЙ ЛОГ
        </div>

        <div class="log" id="gameLog">

            <div class="log-entry">
                Бой ещё не начался.
            </div>

        </div>

    </div>

    <!-- RESTART -->

    <div class="restart">

        <button id="restartButton">
            🔄 НАЧАТЬ ЗАНОВО
        </button>

    </div>

</div>

<script>

/* =========================
   НАСТРОЙКИ
========================= */

const maxHp = 1000;

let hp1 = maxHp;
let hp2 = maxHp;

let currentPlayer = null;

let stunned1 = false;
let stunned2 = false;

let gameStarted = false;
let gameOver = false;


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const coin = document.getElementById("coin");
const coinResult = document.getElementById("coinResult");
const coinButton = document.getElementById("coinButton");

const rollButton = document.getElementById("rollButton");

const die1 = document.getElementById("die1");
const die2 = document.getElementById("die2");

const result = document.getElementById("result");

const turnText = document.getElementById("turnText");

const hp1Text = document.getElementById("hp1Text");
const hp2Text = document.getElementById("hp2Text");

const hp1Fill = document.getElementById("hp1Fill");
const hp2Fill = document.getElementById("hp2Fill");

const status1 = document.getElementById("status1");
const status2 = document.getElementById("status2");

const gameLog = document.getElementById("gameLog");

const restartButton = document.getElementById("restartButton");


/* =========================
   КУБИКИ
========================= */

const diceSymbols = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];

function randomDice() {

    return Math.floor(Math.random() * 6) + 1;

}


/* =========================
   ЛОГ
========================= */

function addLog(message, type = "") {

    const entry = document.createElement("div");

    entry.className = "log-entry " + type;

    entry.textContent = message;

    gameLog.prepend(entry);

}


/* =========================
   ОБНОВЛЕНИЕ UI
========================= */

function updateUI() {

    hp1Text.textContent = `${hp1} HP`;
    hp2Text.textContent = `${hp2} HP`;

    hp1Fill.style.width = `${(hp1 / maxHp) * 100}%`;
    hp2Fill.style.width = `${(hp2 / maxHp) * 100}%`;


    status1.textContent = stunned1
        ? "😵 ОГЛУШЁН"
        : "";

    status1.className = stunned1
        ? "status stunned"
        : "status";


    status2.textContent = stunned2
        ? "😵 ОГЛУШЁН"
        : "";

    status2.className = stunned2
        ? "status stunned"
        : "status";


    if (!gameStarted) {

        turnText.textContent =
            "Сначала определите первый ход";

    } else if (!gameOver) {

        turnText.textContent =
            `ХОД ИГРОКА ${currentPlayer}`;

    }

}


/* =========================
   ОРЕЛ / РЕШКА
========================= */

function determineFirstPlayer() {

    if (gameStarted || gameOver) {
        return;
    }

    coinButton.disabled = true;

    coinResult.textContent =
        "Монетка подбрасывается...";

    coin.textContent = "🪙";


    setTimeout(() => {

        const coinResultValue =
            Math.random() < 0.5
                ? "ОРЕЛ"
                : "РЕШКА";


        if (coinResultValue === "ОРЕЛ") {

            coin.textContent = "🦅";

        } else {

            coin.textContent = "🪙";

        }


        /*
         * Орел = игрок 1
         * Решка = игрок 2
         */

        currentPlayer =
            coinResultValue === "ОРЕЛ"
                ? 1
                : 2;


        coinResult.textContent =
            `${coinResultValue}! Первый бросок получает игрок ${currentPlayer}.`;


        addLog(
            `Выпало ${coinResultValue}. Игрок ${currentPlayer} получает право первого броска.`,
            "special"
        );


        gameStarted = true;

        rollButton.disabled = false;

        updateUI();


        /*
         * БОЙ НАЧИНАЕТСЯ АВТОМАТИЧЕСКИ
         */

        setTimeout(() => {

            rollDice();

        }, 800);


    }, 700);

}


/* =========================
   БРОСОК КУБИКОВ
========================= */

function rollDice() {

    if (!gameStarted || gameOver) {
        return;
    }


    /*
     * Если игрок оглушён,
     * он пропускает ход.
     */

    if (currentPlayer === 1 && stunned1) {

        stunned1 = false;

        addLog(
            "😵 Игрок 1 был оглушён и пропускает свой ход.",
            "special"
        );

        currentPlayer = 2;

        updateUI();

        setTimeout(() => {

            rollDice();

        }, 500);

        return;
    }


    if (currentPlayer === 2 && stunned2) {

        stunned2 = false;

        addLog(
            "😵 Игрок 2 был оглушён и пропускает свой ход.",
            "special"
        );

        currentPlayer = 1;

        updateUI();

        setTimeout(() => {

            rollDice();

        }, 500);

        return;
    }


    rollButton.disabled = true;


    die1.classList.add("rolling");
    die2.classList.add("rolling");


    setTimeout(() => {

        die1.classList.remove("rolling");
        die2.classList.remove("rolling");


        const dice1 = randomDice();
        const dice2 = randomDice();


        /*
         * Первый кубик = десятки
         * Второй кубик = единицы
         */

        const total =
            dice1 * 10 + dice2;


        die1.textContent =
            diceSymbols[dice1 - 1];

        die2.textContent =
            diceSymbols[dice2 - 1];


        result.textContent = total;


        const attacker =
            currentPlayer;

        const defender =
            attacker === 1
                ? 2
                : 1;


        /*
         * Наносим урон
         */

        if (defender === 1) {

            hp1 = Math.max(
                0,
                hp1 - total
            );

        } else {

            hp2 = Math.max(
                0,
                hp2 - total
            );

        }


        addLog(
            `Игрок ${attacker} выбросил ${total} и нанёс ${total} урона игроку ${defender}.`
        );


        /*
         * ДУБЛЬ
         *
         * 11, 22, 33, 44, 55, 66
         */

        if (dice1 === dice2) {

            if (defender === 1) {

                stunned1 = true;

            } else {

                stunned2 = true;

            }


            addLog(
                `🔥 ДУБЛЬ ${total}! Варвар оглушил игрока ${defender}. Следующий ход игрок ${defender} будет пропущен.`,
                "special"
            );

        }


        updateUI();


        /*
         * ПРОВЕРКА ПОБЕДЫ
         */

        if (hp1 <= 0 || hp2 <= 0) {

            gameOver = true;

            rollButton.disabled = true;


            const winner =
                hp1 <= 0
                    ? 2
                    : 1;


            addLog(
                `🏆 ИГРОК ${winner} ПОБЕДИЛ!`,
                "win"
            );


            turnText.textContent =
                `🏆 ПОБЕДИЛ ИГРОК ${winner}`;


            updateUI();

            return;

        }


        /*
         * ПЕРЕДАЁМ ХОД
         */

        currentPlayer = defender;


        updateUI();


        /*
         * Если новый игрок оглушён,
         * автоматически пропускаем его ход.
         */

        if (
            (currentPlayer === 1 && stunned1) ||
            (currentPlayer === 2 && stunned2)
        ) {

            setTimeout(() => {

                rollDice();

            }, 600);

            return;

        }


        /*
         * Обычный следующий ход
         */

        rollButton.disabled = false;

        updateUI();

    }, 450);

}


/* =========================
   RESTART
========================= */

function restartGame() {

    hp1 = maxHp;
    hp2 = maxHp;

    currentPlayer = null;

    stunned1 = false;
    stunned2 = false;

    gameStarted = false;
    gameOver = false;


    coin.textContent = "🪙";

    coinResult.textContent =
        "Нажмите кнопку, чтобы определить право первого броска";


    coinButton.disabled = false;

    rollButton.disabled = true;


    die1.textContent = "⚄";
    die2.textContent = "⚄";

    result.textContent = "—";


    gameLog.innerHTML = `
        <div class="log-entry">
            Бой ещё не начался.
        </div>
    `;


    updateUI();

}


/* =========================
   КНОПКИ
========================= */

coinButton.addEventListener(
    "click",
    determineFirstPlayer
);

rollButton.addEventListener(
    "click",
    rollDice
);

restartButton.addEventListener(
    "click",
    restartGame
);


/* =========================
   СТАРТ
========================= */

updateUI();

</script>

</body>
</html>
