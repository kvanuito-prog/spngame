<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дуэль Классов: Битва на Кубиках</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --success-hover: #16a34a;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .game-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        min-width: 768px {
            .game-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-success:disabled, .btn-primary:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .log-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            height: 320px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-box {
            margin-top: 15px;
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;


margin-bottom: 5px;
        }

        .health-bar-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
            margin-top: 5px;
        }

        .health-bar {
            height: 100%;
            background-color: var(--success);
            width: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <h1>Дуэль Классов</h1>
    <div class="subtitle">Тактическая пошаговая игра на двузначных кубиках (11–66)</div>

    <div class="game-container">
        <!-- Настройки -->
        <div class="panel">
            <h2>Настройки боя</h2>
            <div class="form-group">
                <label for="p1-class">Боец 1 (Игрок):</label>
                <select id="p1-class"></select>
            </div>
            <div class="form-group">
                <label for="p2-class">Боец 2 (ИИ / Соперник):</label>
                <select id="p2-class"></select>
            </div>
            
            <button class="btn-primary" id="btn-start" onclick="startBattle()">Начать новую битву</button>
            <button class="btn-success" id="btn-turn" onclick="makeTurn()" disabled>Сделать ход</button>

            <div class="status-box">
                <div class="stats-grid">
                    <span id="p1-name-ui">Игрок 1</span>
                    <span id="p1-hp-text">Здоровье: 1000 / 1000</span>
                </div>
                <div class="health-bar-container">
                    <div class="health-bar" id="p1-hp-bar"></div>
                </div>
            </div>

            <div class="status-box" style="margin-top: 10px;">
                <div class="stats-grid">
                    <span id="p2-name-ui">Игрок 2</span>
                    <span id="p2-hp-text">Здоровье: 1000 / 1000</span>
                </div>
                <div class="health-bar-container">
                    <div class="health-bar" id="p2-hp-bar" style="background-color: #ef4444;"></div>
                </div>
            </div>
        </div>

        <!-- Лог -->
        <div class="panel">
            <h2>Ход сражения</h2>
            <div class="log-box" id="log-box">
                <span style="color: #fbbf24;">⚡ Выберите бойцов и нажмите «Начать новую битву».</span>
            </div>
        </div>
    </div>

    <script>
        const CLASSES = {
            barbarian: { name: "🪓 Варвар", hp: 1000 },
            knight: { name: "🛡️ Рыцарь", hp: 1000 },
            vampire: { name: "🧛‍♂️ Вампир", hp: 1000 },
            elf: { name: "🏹 Эльф-Лучник", hp: 1000 },
            archmage: { name: "🧙‍♂️ Архимаг", hp: 1000 },
            joker: { name: "🃏 Джокер", hp: 1000 },
            assassin: { name: "👤 Ассасин", hp: 1000 },
            druid: { name: "🐻 Друид", hp: 1000 },
            berserk: { name: "🪓 Берсерк", hp: 1000 },
            undead: { name: "💀 Нежить", hp: 100 }
        };

        let game = null;

        window.onload = () => {
            const p1Sel = document.getElementById('p1-class');
            const p2Sel = document.getElementById('p2-class');
            for (let key in CLASSES) {
                p1Sel.add(new Option(CLASSES[key].name, key));
                p2Sel.add(new Option(CLASSES[key].name, key));
            }
            p2Sel.selectedIndex = 1;
        };

        function initFighter(type) {
            const base = CLASSES[type];
            return {
                type: type,
                name: base.name,
                hp: base.hp,
                maxHp: base.hp,
                stunned: false,
                isAssassinReady: false,
                isVampireReady: false,
                archmageBuffer: [],
                archmageStep: 0,
                elfPhase: 0
            };
        }

        function startBattle() {
            let p1Type = document.getElementById('p1-class').value;
            let p2Type = do


cument.getElementById('p2-class').value;

            game = {
                p1: initFighter(p1Type),
                p2: initFighter(p2Type),
                turn: 1,
                activePlayer: 1, // 1 - ходит Игрок, 2 - ходит ИИ
                over: false
            };

            document.getElementById('log-box').innerHTML = '';
            log(`Битва началась между ${game.p1.name} и ${game.p2.name}!`, "system");

            updateUI();
            document.getElementById('btn-turn').disabled = false;
        }

        function log(text, type = "") {
            const box = document.getElementById('log-box');
            const entry = document.createElement('div');
            entry.innerHTML = text;
            box.appendChild(entry);
            box.scrollTop = box.scrollHeight;
        }

        function rollDice() {
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            return d1 * 10 + d2;
        }

        function isDubl(roll) {
            return Math.floor(roll / 10) === (roll % 10);
        }

        function makeTurn() {
            if (game.over) return;

            // Определяем кто атакует, а кто защищается
            let attacker = game.activePlayer === 1 ? game.p1 : game.p2;
            let defender = game.activePlayer === 1 ? game.p2 : game.p1;

            log(`<b>--- Раунд ${game.turn} (${attacker.name} атакует) ---</b>`, "system");

            if (attacker.stunned) {
                log(`${attacker.name} оглушен и пропускает ход!`, "danger");
                attacker.stunned = false;
                endTurnRoutine();
                return;
            }

            let roll = rollDice();
            let dubl = isDubl(roll);
            log(`${attacker.name} бросает кубики: <b>${roll}</b> ${dubl ? '(ДУБЛЬ!)' : ''}`);

            // Джокер Джекпот
            if (attacker.type === 'joker' && isSameDigits(attacker.hp)) {
                roll = Math.floor(roll * 3.5);
                log(`🃏 Джокер активировал Джекпот! Урон повышен до ${roll}`, "success");
            }

            // Берсерк Ярость боли
            if (attacker.type === 'berserk' && attacker.hp < 500) {
                let bonus = Math.floor((500 - attacker.hp) * 0.14);
                roll += bonus;
                log(`🪓 Берсерк в ярости! +${bonus} к урону (всего: ${roll})`, "danger");
            }

            if (dubl) {
                handleDubl(attacker, defender, roll);
            } else {
                if (attacker.isAssassinReady) {
                    let dmg = Math.floor(roll * 1.7);
                    log(`👤 Ассасин наносит смертельный удар скрытым клинком: ${dmg} урона!`, "danger");
                    applyDamage(attacker, defender, dmg);
                    attacker.isAssassinReady = false;
                } else if (attacker.isVampireReady) {
                    let dmg = Math.floor(roll * 1.7);
                    log(`🧛‍♂️ Вампир совершает Кровавый укус на ${dmg} урона!`, "danger");
                    applyDamage(attacker, defender, dmg);
                    let healed = Math.min(dmg, attacker.maxHp - attacker.hp);
                    attacker.hp += healed;
                    log(`🧛‍♂️ Вампир восстанавливает ${healed} HP за счет крови!`, "success");
                    attacker.isVampireReady = false;
                } else {
                    if (attacker.type === 'archmage' && attacker.archmageStep > 0) {
                        attacker.archmageBuffer.push(roll);
                        attacker.archmageStep++;
                        log(`🧙‍♂️ Архимаг копит буфер заклинания (Шаг ${attacker.archmageStep}/3: +${roll})`);
                        if (attacker.archmageStep === 3) {
                            let sum = attacker.archmageBuffer.reduce((a,b)=>a+b, 0);
                            let finalDmg = Math.floor(sum * 2.5);
                            log(`🧙‍♂️ КАСТ ВЕЛИКОГО ЗАКЛИНАНИЯ! Сумма ${sum} x 2.5 = ${


finalDmg} урона!`, "danger");
                            applyDamage(attacker, defender, finalDmg);
                            attacker.archmageStep = 0;
                            attacker.archmageBuffer = [];
                        }
                    } else {
                        applyDamage(attacker, defender, roll);
                    }
                }
            }

            if (!game.over) {
                endTurnRoutine();
            }
        }

        function handleDubl(attacker, defender, roll) {
            log(`⚡ Сработал дубль класса ${attacker.name}!`, "system");

            if (attacker.type === 'barbarian') {
                applyDamage(attacker, defender, roll);
                log(`🪓 Варвар оглушает врага (${defender.name})! Соперник пропустит следующий ход.`, "danger");
                defender.stunned = true;
            } 
            else if (attacker.type === 'vampire') {
                attacker.isVampireReady = true;
                log(`🧛‍♂️ Следующий удар Вампира станет Кровавым укусом (x1.7)!`, "success");
            }
            else if (attacker.type === 'elf') {
                let count = Math.floor(roll / 10);
                log(`🏹 Эльф отбегает и делает ${count} бонусных выстрелов!`);
                applyDamage(attacker, defender, roll);
                for (let i = 0; i < count; i++) {
                    if (game.over) break;
                    let bRoll = rollDice();
                    log(`🏹 Бонусная стрела наносит ${bRoll} урона`);
                    applyDamage(attacker, defender, bRoll);
                }
            }
            else if (attacker.type === 'archmage') {
                attacker.archmageStep = 1;
                attacker.archmageBuffer = [roll];
                log(`🧙‍♂️ Архимаг начал каст заклинания (Шаг 1/3). В буфере: ${roll}`);
            }
            else if (attacker.type === 'assassin') {
                attacker.isAssassinReady = true;
                log(`👤 Ассасин заряжает скрытый клинок (x1.7)!`, "danger");
            }
            else if (attacker.type === 'druid') {
                applyDamage(attacker, defender, roll);
                let summonType = roll <= 22 ? 'Кабан (40 HP)' : (roll <= 44 ? 'Волк (70 HP)' : 'Медведь (140 HP)');
                log(`🐻 Друид призывает зверя: ${summonType}!`, "success");
            }
            else {
                applyDamage(attacker, defender, roll);
            }
        }

        function applyDamage(attacker, defender, amount) {
            if (game.over) return;

            // Проверка страха Нежити на 11
            if (defender.type === 'undead' && amount === 11) {
                log(`💀 Враг выбросил фатальные 11! Нежить охвачена паническим страхом и мгновенно уничтожена!`, "danger");
                defender.hp = 0;
                endGame(attacker);
                return;
            }

            applyDirectDamage(defender, amount);

            // Пассивка Нежити: Зловоние разложения
            if (defender.type === 'undead' && defender.hp > 0 && !game.over) {
                let poison = Math.floor(Math.random() * 15) + 1;
                attacker.hp -= poison;
                log(`💀 Зловоние Нежити отравляет атакующего! ${attacker.name} получает ${poison} урона ядом.`, "danger");
                if (attacker.hp <= 0) {
                    attacker.hp = 0;
                    endGame(defender);
                }
            }
        }

        function applyDirectDamage(target, amount) {
            if (target.type === 'undead') {
                let newHp = target.hp - amount;
                if (newHp === 0) {
                    target.hp = 0;
                    log(`💀 Нежить получила удар ровно в 0 HP и пала!`, "danger");
                    endGame(game.activePlayer === 1 ? game.p2 : game.p1);
                } else if (newHp < 0) {
                    let healed = Math.abs(newHp);
                    target.hp = healed;
                    log(`💀


Удар ушел в овер-хил! Нежить поглотила излишек урона и исцелилась до ${target.hp} HP!`, "success");
                } else {
                    target.hp = newHp;
                    log(`💀 Нежить теряет ${amount} HP (осталось ${target.hp} HP).`, "danger");
                }
            } else {
                target.hp -= amount;
                log(`${target.name} получает ${amount} урона (осталось: ${Math.max(0, target.hp)} HP)`, "danger");
                if (target.hp <= 0) {
                    target.hp = 0;
                    endGame(game.activePlayer === 1 ? game.p1 : game.p2);
                }
            }
        }

        function isSameDigits(num) {
            let s = num.toString();
            return s.split('').every(char => char === s[0]);
        }

        function endTurnRoutine() {
            if (game.over) return;
            // Переключаем ход на другого игрока
            game.activePlayer = game.activePlayer === 1 ? 2 : 1;
            game.turn++;
            updateUI();
        }

        function endGame(winner) {
            game.over = true;
            log(`🏆 ПОБЕДИТЕЛЬ: ${winner.name}!`, "success");
            document.getElementById('btn-turn').disabled = true;
            updateUI();
        }

        function updateUI() {
            document.getElementById('p1-name-ui').innerText = game.p1.name;
            document.getElementById('p1-hp-text').innerText = `Здоровье: ${game.p1.hp} / ${game.p1.maxHp}`;
            document.getElementById('p1-hp-bar').style.width = Math.max(0, (game.p1.hp / game.p1.maxHp) * 100) + '%';

            document.getElementById('p2-name-ui').innerText = game.p2.name;
            document.getElementById('p2-hp-text').innerText = `Здоровье: ${game.p2.hp} / ${game.p2.maxHp}`;
            document.getElementById('p2-hp-bar').style.width = Math.max(0, (game.p2.hp / game.p2.maxHp) * 100) + '%';
        }
    </script>
</body>
</html>
