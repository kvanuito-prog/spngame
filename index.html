<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>WORLD 10×10</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;

    background: #05070b;
    color: #fff;

    font-family: Arial, sans-serif;

    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
}

.game {
    width: 100%;
    max-width: 1100px;
    padding: 15px;
}

.header {
    text-align: center;
    margin-bottom: 12px;
}

.header h1 {
    margin: 0;
    font-size: clamp(24px, 5vw, 42px);
}

.header p {
    margin: 5px 0 0;
    color: #8290a0;
}


/* ==================================================
   СЦЕНА
================================================== */

.scene {
    position: relative;

    width: 100%;
    height: min(75vh, 680px);

    min-height: 420px;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    border-radius: 20px;

    background:
        radial-gradient(
            circle,
            #102334 0%,
            #07111b 40%,
            #020407 100%
        );

    border: 1px solid #182636;

    touch-action: none;

    user-select: none;
}


/* ==================================================
   ЗЕМЛЯ
================================================== */

.earth {
    position: relative;

    width: min(78vw, 560px);
    height: min(78vw, 560px);

    max-width: 560px;
    max-height: 560px;

    border-radius: 50%;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 32% 27%,
            #4d9fc3 0%,
            #236e8d 30%,
            #0b3d55 62%,
            #031522 100%
        );

    box-shadow:
        inset -70px -25px 100px rgba(0,0,0,.7),
        inset 25px 15px 60px rgba(255,255,255,.1),
        0 0 70px rgba(0,150,255,.25);

    /*
        Очень важно:
        Земля сама не имеет pointer-events.
        Управляет сценой.
    */

    pointer-events: none;
}


/* ==================================================
   МАТЕРИКИ
================================================== */

.land {
    position: absolute;

    inset: 7%;

    background:
        radial-gradient(
            ellipse at 25% 30%,
            #73835a 0 13%,
            transparent 14%
        ),
        radial-gradient(
            ellipse at 55% 35%,
            #8c875b 0 14%,
            transparent 15%
        ),
        radial-gradient(
            ellipse at 70% 60%,
            #59724e 0 18%,
            transparent 19%
        ),
        radial-gradient(
            ellipse at 40% 70%,
            #71815b 0 15%,
            transparent 16%
        );

    opacity: .95;

    clip-path: polygon(
        4% 32%,
        13% 20%,
        27% 22%,
        36% 10%,
        49% 16%,
        59% 29%,
        72% 25%,
        86% 36%,
        96% 49%,
        82% 57%,
        88% 70%,
        70% 75%,
        58% 91%,
        43% 77%,
        29% 84%,
        20% 67%,
        7% 57%
    );
}


/* ==================================================
   СЕТКА
================================================== */

.grid {
    position: absolute;

    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.16) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.16) 1px,
            transparent 1px
        );

    background-size: 18px 18px;

    opacity: .38;
}


/* ==================================================
   КЛЕТКИ
================================================== */

.cells {
    position: absolute;

    inset: 0;

    z-index: 5;
}

.cell {
    position: absolute;

    width: 34px;
    height: 34px;

    padding: 0;

    border-radius: 3px;

    border: 1px solid rgba(255,255,255,.3);

    background: rgba(0,0,0,.04);

    pointer-events: auto;

    cursor: pointer;

    transition:
        background .1s,
        border-color .1s,
        transform .1s;
}

.cell:hover {
    background: rgba(0,168,255,.4);

    border-color: #24d8ff;
}

.cell.selected {
    background: rgba(0,168,255,.75);

    border-color: white;

    box-shadow:
        0 0 15px
        rgba(36,216,255,.8);
}


/* ==================================================
   АТМОСФЕРА
================================================== */

.atmosphere {
    position: absolute;

    inset: 0;

    border-radius: 50%;

    z-index: 20;

    pointer-events: none;

    box-shadow:
        inset -50px -20px 80px
        rgba(0,0,0,.55),

        inset 0 0 35px
        rgba(80,200,255,.25);
}


/* ==================================================
   ИНФОРМАЦИЯ
================================================== */

.info {
    margin-top: 12px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.box {
    padding: 10px;

    border-radius: 10px;

    background: #0b1018;

    border: 1px solid #182433;
}

.label {
    color: #718095;

    font-size: 11px;
}

.value {
    margin-top: 4px;

    color: #24d8ff;

    font-size: 17px;

    font-weight: bold;
}

.selected {
    margin-top: 10px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    background: #0b1018;

    border: 1px solid #182433;

    color: #8d9aaa;
}

.selected span {
    color: #24d8ff;

    font-weight: bold;
}


/* ==================================================
   МОБИЛЬНЫЕ
================================================== */

@media(max-width:700px) {

    .game {
        padding: 8px;
    }

    .scene {
        height: 62vh;
        min-height: 330px;
    }

    .earth {
        width: 78vw;
        height: 78vw;
    }

    .cell {
        width: 25px;
        height: 25px;
    }

    .info {
        grid-template-columns:
            repeat(2, 1fr);
    }
}

</style>
</head>


<body>

<div class="game">

    <div class="header">

        <h1>🌍 WORLD 10×10</h1>

        <p>
            Потяни Землю пальцем, чтобы вращать
        </p>

    </div>


    <div class="scene" id="scene">

        <div class="earth" id="earth">

            <div class="land"></div>

            <div class="grid"></div>

            <div class="cells" id="cells"></div>

            <div class="atmosphere"></div>

        </div>

    </div>


    <div class="info">

        <div class="box">

            <div class="label">
                РАЗМЕР
            </div>

            <div class="value">
                10 × 10 м
            </div>

        </div>


        <div class="box">

            <div class="label">
                ПЛОЩАДЬ
            </div>

            <div class="value">
                100 м²
            </div>

        </div>


        <div class="box">

            <div class="label">
                КЛЕТОК СУШИ
            </div>

            <div class="value">
                ≈ 1,49 трлн
            </div>

        </div>


        <div class="box">

            <div class="label">
                ВЫБРАНО
            </div>

            <div
                class="value"
                id="counter">
                0
            </div>

        </div>

    </div>


    <div
        class="selected"
        id="selected">

        Выбери квадрат на Земле

    </div>

</div>


<script>

/* ==================================================
   WORLD 10×10
================================================== */

const scene =
    document.getElementById("scene");

const earth =
    document.getElementById("earth");

const cells =
    document.getElementById("cells");

const selected =
    document.getElementById("selected");

const counter =
    document.getElementById("counter");


/* ==================================================
   СОЗДАЁМ ДЕМОНСТРАЦИОННЫЕ КЛЕТКИ
================================================== */

const size = 8;

let number = 0;


for (let y = 0; y < size; y++) {

    for (let x = 0; x < size; x++) {

        number++;


        const cell =
            document.createElement("button");

        cell.type = "button";

        cell.className = "cell";


        /*
            Позиция
        */

        cell.style.left =
            (20 + x * 7.5) + "%";

        cell.style.top =
            (20 + y * 7.5) + "%";


        /*
            ID клетки
        */

        const id =
            "CELL-" +
            String(number)
                .padStart(6, "0");


        cell.dataset.id = id;

        cell.dataset.x = x;

        cell.dataset.y = y;


        /*
            Выбор клетки
        */

        cell.addEventListener(
            "pointerdown",
            function(event) {

                event.stopPropagation();

            }
        );


        cell.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                document
                    .querySelectorAll(
                        ".cell.selected"
                    )
                    .forEach(function(c) {

                        c.classList.remove(
                            "selected"
                        );

                    });


                cell.classList.add(
                    "selected"
                );


                selected.innerHTML =
                    "Выбрана клетка " +

                    "<span>" +
                    id +
                    "</span>" +

                    " • X: " +
                    x +

                    " • Y: " +
                    y;


                counter.textContent =
                    number;

            }
        );


        cells.appendChild(cell);

    }

}


/* ==================================================
   ВРАЩЕНИЕ
================================================== */

let dragging = false;

let lastX = 0;
let lastY = 0;

let rotationX = 0;
let rotationY = 0;


/*
    Начало движения
*/

scene.addEventListener(
    "pointerdown",
    function(event) {

        /*
            Если нажата клетка —
            не вращаем.
        */

        if (
            event.target.closest(".cell")
        ) {
            return;
        }


        dragging = true;


        lastX = event.clientX;

        lastY = event.clientY;


        scene.setPointerCapture(
            event.pointerId
        );

    }
);


/*
    Движение пальца / мыши
*/

scene.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }


        const dx =
            event.clientX - lastX;


        const dy =
            event.clientY - lastY;


        lastX =
            event.clientX;


        lastY =
            event.clientY;


        rotationY +=
            dx * 0.45;


        rotationX -=
            dy * 0.25;


        /*
            Ограничиваем наклон
        */

        rotationX =
            Math.max(
                -45,
                Math.min(
                    45,
                    rotationX
                )
            );


        /*
            ВАЖНО:
            используем transform
            только здесь
        */

        earth.style.transform =
            "perspective(900px) " +

            "rotateX(" +
            rotationX +
            "deg) " +

            "rotateY(" +
            rotationY +
            "deg)";

    }
);


/*
    Конец движения
*/

function stopDragging() {

    dragging = false;

}


scene.addEventListener(
    "pointerup",
    stopDragging
);

scene.addEventListener(
    "pointercancel",
    stopDragging
);

scene.addEventListener(
    "pointerleave",
    stopDragging
);


/* ==================================================
   МАСШТАБ КОЛЕСОМ
================================================== */

let scale = 1;


scene.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();


        scale +=
            event.deltaY > 0
                ? -0.08
                : 0.08;


        scale =
            Math.max(
                0.65,
                Math.min(
                    1.8,
                    scale
                )
            );


        earth.style.width =
            `min(78vw, 560px)`;

        earth.style.height =
            `min(78vw, 560px)`;

        earth.style.scale =
            scale;

    },
    {
        passive: false
    }
);

</script>

</body>
</html>
