<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дуэль Классов на Кубиках</title>
<style>
body { background-color: #1a1a1a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; color: white; padding: 20px; }

.game-wrapper { display: flex; align-items: center; gap: 30px; margin-top: 20px; }

.player-panel { width: 220px; background: #2d3748; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.player-panel select { width: 100%; padding: 8px; margin-bottom: 15px; background: #1a202c; color: white; border: 1px solid #4a5568; border-radius: 6px; }

.hp-bar { width: 100%; height: 15px; background: #4a5568; border-radius: 8px; margin: 10px 0; overflow: hidden; }
.hp-fill { height: 100%; background: #48bb78; width: 100%; transition: width 0.3s; }

.game-field { width: 300px; height: 200px; background-color: #2e7d32; border: 8px solid #1b5e20; border-radius: 20px; display: flex; justify-content: center; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

.die { width: 60px; height: 60px; background-color: white; border-radius: 10px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 5px; }
.dot { width: 12px; height: 12px; background-color: black; border-radius: 50%; align-self: center; justify-self: center; }
.hidden { visibility: hidden; }

.controls { margin-top: 20px; text-align: center; }
button { padding: 15px 40px; font-size: 20px; background: #f59e0b; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
button:disabled { background: #4a5568; cursor: not-allowed; }

.log-box { width: 660px; height: 160px; background: #0f172a; margin-top: 20px; border-radius: 10px; padding: 15px; overflow-y: auto; border: 1px solid #334155; font-size: 14px; line-height: 1.5; color: #94a3b8; }
.log-highlight { color: #facc15; font-weight: bold; }
.log-ability { color: #38bdf8; font-weight: bold; }
.log-berserk { color: #f87171; font-weight: bold; }
.log-mage { color: #c084fc; font-weight: bold; }
</style>
</head>
<body>

<div class="game-wrapper">
<!— Игрок 1 —>
<div class="player-panel">
<select id="class1">
<option value="barbarian">🪓 Варвар</option>
<option value="assassin">👤 Ассасин</option>
<option value="vampire">🧛‍♂️ Вампир</option>
<option value="berserk">🪓 Берсерк</option>
<option value="archmage">🧙‍♂️ Архимаг</option>
</select>
<h3>Игрок 1 (Орел)</h3>
<div class="hp-bar"><div class="hp-fill" id="hp1" style="width: 100%;"></div></div>
<span id="hp-text1">1000 / 1000</span>
</div>

<!— Поле кубиков —>
<div class="game-field">
<div class="die" id="die1"></div>
<div class="die" id="die2"></div>
</div>

<!— Игрок 2 —>
<div class="player-panel">
<select id="class2">
<option value="barbarian">🪓 Варвар</option>
<option value="assassin">👤 Ассасин</option>
<option value="vampire">🧛‍♂️ Вампир</option>
<option value="berserk">🪓 Берсерк</option>
<option value="archmage" selected>🧙‍♂️ Архимаг</option>
</select>
<h3>Игрок 2 (Решка)</h3>
<div class="hp-bar"><div class="hp-fill" id="hp2" style="width: 100%;"></div></div>
<span id="hp-text2">1000 / 1000</span>
</div>
</div>

<div class="controls">
<button id="btn-turn" onclick="makeTurn()">НАЧАТЬ БИТВУ / ХОД</button>
</div>

<div class="log-box" id="log"><div» Настройте героев и нажмите кнопку, чтобы подбросить монетку и начать битву!</div></div>

<script>
const CLASSES = {
barbarian: { name: "🪓 Варвар" },
assassin: { name: "👤 Ассасин" },
vampire: { name: "🧛‍♂️ Вампир" },
berserk: { name: "🪓 Берсерк" },
archmage: { name: "🧙‍♂️ Архимаг" }
};

let game = {
p1: { hp: 1000, maxHp: 1000, stunned: false, assassinReady: false, vampireReady: false, archmageCasting: false, archmageTurnsLeft: 0, archmageAccumulated: 0 },
p2: { hp: 1000, maxHp: 1000, stunned: false, assassinReady: false, vampireReady: false, archmageCasting: false, archmageTurnsLeft: 0, archmageAccumulated: 0 },
activePlayer: 1,
started: false,
over: false
};

const layouts = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };

function renderDie(id, val) {
const el = document.getElementById(id);
el.innerHTML = '';
for(let i=0; i<9; i++) {
const dot = document.createElement('div');
dot.className = 'dot' + (layouts[val].includes(i) ? '' : ' hidden');
el.appendChild(dot);
}
}

function log(msg) {
const box = document.getElementById('log');
box.innerHTML = `<div» ${msg}</div>` + box.innerHTML;
box.scrollTop = 0;
}

function getBerserkBonus(hp) {
if (hp < 5) return { bonus: 80, tier: "критический (<5 HP: +80 урон)" };
if (hp < 50) return { bonus: 40, tier: "высокий (<50 HP: +40 урон)" };
if (hp < 100) return { bonus: 20, tier: "средний (<100 HP: +20 урон)" };
if (hp < 150) return { bonus: 5, tier: "слабый (<150 HP: +5 урон)" };
return { bonus: 0, tier: null };
}

function makeTurn() {
if (game.over) return;

if (!game.started) {
game.started = true;
document.getElementById('class1').disabled = true;
document.getElementById('class2').disabled = true;

let coin = Math.random() < 0.5 ? 'орел' : 'решка';
if (coin === 'орел') {
game.activePlayer = 1;
log(`🪙 Подброшена монетка: <span class="log-highlight">Орел!</span> Игрок 1 ходит первым.`);
} else {
game.activePlayer = 2;
log(`🪙 Подброшена монетка: <span class="log-highlight">Решка!</span> Игрок 2 ходит первым.`);
}
log("Битва началась!");
return;
}

let attacker = game.activePlayer === 1 ? game.p1 : game.p2;
let defender = game.activePlayer === 1 ? game.p2 : game.p1;
let attClass = document.getElementById(`class${game.activePlayer}`).value;
let attName = CLASSES[attClass].name;
let defName = CLASSES[document.getElementById(`class${game.activePlayer === 1 ? 2 : 1}`).value].name;

let berserkData = { bonus: 0, tier: null };
if (attClass === 'berserk') {
berserkData = getBerserkBonus(attacker.hp);
if (berserkData.bonus > 0) {
log(`<span class="log-berserk">⚠️ Пассивка Берсерка активна!</span> Уровень ярости: ${berserkData.tier}`);
}
}

if (attacker.stunned) {
log(`<b>${attName} (Игрок ${game.activePlayer})</b> <span class="log-highlight">оглушен</span> и пропускает ход!`);
attacker.stunned = false;
switchTurn();
return;
}

let d1 = Math.floor(Math.random() * 6) + 1;
let d2 = Math.floor(Math.random() * 6) + 1;
renderDie('die1', d1);
renderDie('die2', d2);

let roll = d1 * 10 + d2;
let isDubl = (d1 === d2);

log(`<b>${attName} (Игрок ${game.activePlayer})</b> бросает кубики: <span class="log-highlight">${roll}</span> ${isDubl ? '<span class="log-ability">(ДУБЛЬ!)</span>' : ''}`);

if (attacker.assassinReady) {
let dmg = Math.round(roll * 1.7);
defender.hp = Math.max(0, defender.hp - dmg);
log(`<span class="log-ability">👤 Способность "Скрытый клинок" (Ассасин):</span> Удар из тени! Базовый бросок ${roll} умножен на 1.7. Нанесено урона: <span class="log-highlight">${dmg}</span>.`);
attacker.assassinReady = false;
updateUI();
checkWin(defender, defName);
if (!game.over) switchTurn();
return;
}

if (attacker.vampireReady) {
let finalDmg = roll;
let heal = Math.round(finalDmg * 1.7);

defender.hp = Math.max(0, defender.hp - finalDmg);
attacker.hp = Math.min(attacker.maxHp, attacker.hp + heal);

log(`<span class="log-ability">🧛‍♂️ Способность "Кровавый укус" (Вампир):</span> Успешно совершен вампирский рывок! Нанесено урона: <span class="log-highlight">${finalDmg}</span>, восполнено здоровья: <span class="log-highlight">+${heal} HP</span>.`);
attacker.vampireReady = false;
updateUI();
checkWin(defender, defName);
if (!game.over) switchTurn();
return;
}

if (attacker.archmageCasting) {
attacker.archmageAccumulated += roll;
attacker.archmageTurnsLeft--;
log(`<span class="log-mage">🧙‍♂️ Архимаг читает заклинание:</span> Добавлено бросков: ${roll}. Осталось ходов каста: ${attacker.archmageTurnsLeft}. Накопленная база: ${attacker.archmageAccumulated}.`);

if (attacker.archmageTurnsLeft === 0) {
// Изменено умножение с 2.5 на 2
let finalDmg = Math.round(attacker.archmageAccumulated * 2);
defender.hp = Math.max(0, defender.hp - finalDmg);
log(`<span class="log-mage">✨ Заклинание Архимага завершено!</span> Сумма трех ходов (${attacker.archmageAccumulated}) умножена на 2. Врагу нанесено урона: <span class="log-highlight">${finalDmg}</span>!`);
attacker.archmageCasting = false;
attacker.archmageAccumulated = 0;
}

updateUI();
checkWin(defender, defName);
if (!game.over) switchTurn();
return;
}

if (isDubl) {
if (attClass === 'barbarian') {
let finalDmg = roll + berserkData.bonus;
defender.hp = Math.max(0, defender.hp - finalDmg);
defender.stunned = true;
log(`<span class="log-ability">🪓 Способность "Ярость Варвара" (Дубль ${roll}):</span> Нанесено <span class="log-highlight">${finalDmg}</span> урона и наложено <span class="log-highlight">ОГЛУШЕНИЕ</span>! Соперник пропустит следующий ход.`);
} else if (attClass === 'assassin') {
attacker.assassinReady = true;
log(`<span class="log-ability">👤 Способность "Теневой шаг" (Дубль ${roll}):</span> Урон текущего броска аннулирован, клинок заряжен. Следующий удар будет усилен на <span class="log-highlight">x1.7</span>!`);
updateUI();
return;
} else if (attClass === 'vampire') {
attacker.vampireReady = true;
log(`<span class="log-ability">🧛‍♂️ Способность "Жажда крови" (Дубль ${roll}):</span> Урон текущего броска аннулирован. Вампир готовится к "Кровавому укусу" на следующий ход!`);
updateUI();
return;
} else if (attClass === 'archmage') {
attacker.archmageCasting = true;
attacker.archmageTurnsLeft = 3;
attacker.archmageAccumulated = roll;
log(`<span class="log-mage">🧙‍♂️ Архимаг выбросил дубль (${roll})!</span> Заклинание начинает формироваться. Урон отложен на 3 хода (этот бросок учтен). Противник продолжает ходить!`);
updateUI();
if (!game.over) switchTurn();
return;
} else {
let finalDmg = roll + berserkData.bonus;
defender.hp = Math.max(0, defender.hp - finalDmg);
log(`Выпал дубль ${roll}, нанесено <span class="log-highlight">${finalDmg}</span> урона.`);
}
} else {
let finalDmg = roll + berserkData.bonus;
defender.hp = Math.max(0, defender.hp - finalDmg);

if (berserkData.bonus > 0) {
log(`${attName} атакует: базовый бросок ${roll} + ярость берсерка <span class="log-berserk">+${berserkData.bonus}</span> = нанесено <span class="log-highlight">${finalDmg}</span> урона.`);
} else {
log(`${attName} наносит <span class="log-highlight">${finalDmg}</span> урона.`);
}
}

updateUI();
checkWin(defender, defName);
if (!game.over) switchTurn();
}

function switchTurn() {
game.activePlayer = game.activePlayer === 1 ? 2 : 1;
log(`-— Ход переходит к Игроку ${game.activePlayer} —-`);
}

function updateUI() {
document.getElementById('hp1').style.width = (game.p1.hp / game.p1.maxHp) * 100 + '%';
document.getElementById('hp-text1').innerText = `${game.p1.hp} / 1000`;

document.getElementById('hp2').style.width = (game.p2.hp / game.p2.maxHp) * 100 + '%';
document.getElementById('hp-text2').innerText = `${game.p2.hp} / 1000`;
}

function checkWin(def, defName) {
if (def.hp <= 0) {
game.over = true;
log(`🏆 <span class="log-highlight"><b>${defName} повержен! Игра окончена.</b></span>`);
document.getElementById('btn-turn').disabled = true;
}
}
</script>
</body>
</html>
