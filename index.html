<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кубики</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, #1e2a4a 0%, #0a0f1e 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    padding: 20px;
    gap: 40px;
  }
  .dice-row {
    display: flex;
    gap: 30px;
  }
  .die {
    width: min(35vw, 140px);
    height: min(35vw, 140px);
    background: linear-gradient(145deg, #ffffff, #d8d8d8);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 -6px 12px rgba(0,0,0,0.15);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 12%;
    transition: transform 0.15s ease;
  }
  .die.spinning {
    animation: shake 0.12s infinite;
  }
  @keyframes shake {
    0%   { transform: rotate(-5deg) scale(1.03); }
    50%  { transform: rotate(5deg) scale(0.97); }
    100% { transform: rotate(-5deg) scale(1.03); }
  }
  .pip {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pip::after {
    content: "";
    width: 62%;
    height: 62%;
    background: #1a1a1a;
    border-radius: 50%;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
  }
  .result {
    font-size: clamp(48px, 14vw, 96px);
    font-weight: 800;
    letter-spacing: 6px;
    color: #4ade80;
    text-shadow: 0 0 30px rgba(74,222,128,0.6);
    font-variant-numeric: tabular-nums;
    min-height: 1.1em;
    transition: color 0.3s ease;
  }
  .hint {
    position: fixed;
    bottom: 30px;
    left: 0; right: 0;
    text-align: center;
    color: #8892b0;
    font-size: 14px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="dice-row">
    <div class="die" id="die1"></div>
    <div class="die" id="die2"></div>
  </div>
  <div class="result" id="result">— —</div>
</div>
<div class="hint">Тап по экрану — бросок</div>

<script>
  const dieEls = [document.getElementById('die1'), document.getElementById('die2')];
  const resultEl = document.getElementById('result');

  let rolling = false;

  // Позиции точек в сетке 3x3 (индексы 0-8)
  const pipPositions = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
  };

  function renderDie(el, value) {
    el.innerHTML = '';
    const pips = pipPositions[value];
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'pip';
      if (!pips.includes(i)) cell.style.visibility = 'hidden';
      el.appendChild(cell);
    }
  }

  function randomDie() {
    return Math.floor(Math.random() * 6) + 1;
  }

  function roll() {
    if (rolling) return;
    rolling = true;

    dieEls.forEach(el => el.classList.add('spinning'));
    resultEl.textContent = '— —';
    resultEl.style.color = '#4ade80';

    const spinDuration = 900;
    const interval = 70;
    const start = performance.now();

    const timer = setInterval(() => {
      dieEls.forEach(el => renderDie(el, randomDie()));
      if (performance.now() - start >= spinDuration) {
        clearInterval(timer);
        finish();
      }
    }, interval);

    function finish() {
      const v1 = randomDie();
      const v2 = randomDie();
      renderDie(dieEls[0], v1);
      renderDie(dieEls[1], v2);
      dieEls.forEach(el => el.classList.remove('spinning'));

      resultEl.textContent = `${v1}${v2}`;
      resultEl.style.color = (v1 === v2) ? '#fbbf24' : '#4ade80'; // дубль — золотой
      rolling = false;
    }
  }

  // Стартовый вид
  dieEls.forEach(el => renderDie(el, randomDie()));

  document.body.addEventListener('click', roll);
  document.body.addEventListener('touchstart', (e) => {
    e.preventDefault();
    roll();
  }, { passive: false });
</script>
</body>
</html>
