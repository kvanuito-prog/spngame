<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ядерный Шторм: Баллистический Симулятор</title>
<style>
body {
font-family: 'Courier New', Courier, monospace;
background-color: #0d1117;
color: #c9d1d9;
margin: 0;
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
}
h1 { color: #58a6ff; text-shadow: 0 0 10px rgba(88, 166, 255, 0.3); }
.container {
display: flex;
gap: 20px;
max-width: 900px;
width: 100%;
flex-wrap: wrap;
}
.panel {
background-color: #161b22;
border: 1px solid #30363d;
border-radius: 6px;
padding: 20px;
flex: 1;
min-width: 300px;
}
.form-group {
margin-bottom: 15px;
}
label {
display: block;
margin-bottom: 5px;
font-size: 14px;
color: #8b949e;
}
input {
width: 100%;
padding: 8px;
background-color: #0d1117;
border: 1px solid #30363d;
border-radius: 4px;
color: #c9d1d9;
box-sizing: border-box;
}
button {
background-color: #238636;
color: white;
border: none;
padding: 10px 15px;
border-radius: 4px;
cursor: pointer;
width: 100%;
font-weight: bold;
font-size: 16px;
}
button:hover { background-color: #2ea043; }
.log-box {
background-color: #010409;
border: 1px solid #30363d;
border-radius: 4px;
padding: 15px;
height: 250px;
overflow-y: auto;
font-size: 13px;
line-height: 1.4;
}
.target-info {
border-left: 3px solid #f85149;
padding-left: 10px;
margin-bottom: 15px;
}
</style>
</head>
<body>

<h1>🚀 БАЛЛИСТИЧЕСКАЯ ШАХТА</h1>

<div class="container">
<!— Панель управления —>
<div class="panel">
<h3>Параметры пуска</h3>
<div class="target-info">
<strong>Цель:</strong> Вражеская шахта

<strong>Расстояние:</strong> ~7 500 км

<strong>Требуемый азимут:</strong> ~74.5°

<strong>Оптимальное топливо:</strong> ~42 000 кг (при боеголовке 1000 кг)
</div>

<div class="form-group">
<label for="warhead">Масса боеголовки (кг):</label>
<input type="text" id="warhead" value="1000">
</div>

<div class="form-group">
<label for="fuel">Масса твердого топлива (кг):</label>
<input type="text" id="fuel" value="42000">
</div>

<div class="form-group">
<label for="azimuth">Азимут запуска (градусы 0–360):</label>
<input type="text" id="azimuth" value="74.5">
</div>

<button onclick="launchMissile()">ЗАПУСК РАКЕТЫ</button>
</div>

<!— Лог полета —>
<div class="panel">
<h3>Телеметрия и лог полета</h3>
<div id="log" class="log-box">
Система инициализирована. Ожидание параметров пуска...

</div>
</div>
</div>

<script>
function log(message) {
const logBox = document.getElementById('log');
logBox.innerHTML += message + '
';
logBox.scrollTop = logBox.scrollHeight;
}

function launchMissile() {
try {
// Безопасное чтение полей с заменой запятой на точку
const warheadStr = document.getElementById('warhead').value.replace(',', '.');
const fuelStr = document.getElementById('fuel').value.replace(',', '.');
const azimuthStr = document.getElementById('azimuth').value.replace(',', '.');

const warhead = parseFloat(warheadStr);
const fuel = parseFloat(fuelStr);
const azimuth = parseFloat(azimuthStr);

if (isNaN(warhead) || isNaN(fuel) || isNaN(azimuth)) {
log('❌ ОШИБКА: Проверьте правильность введенных чисел!');
return;
}

log('-----------------------------------');
log('⚡ Произведено зажигание двигателей!');

// 1. Расчет массы и уравнения Циолковского
const dryMass = 3000;
const totalMass = dryMass + warhead + fuel;
const Isp = 280;
const g0 = 9.81;

const burnoutMass = dryMass + warhead;
const deltaV = Isp * g0 * Math.log(totalMass / burnoutMass);

log(`> Стартовая масса: ${totalMass} кг`);
log(`> Конечная скорость (Δv): ${deltaV.toFixed(1)} м/с`);

// 2. Расчет дальности полета
const calculatedDistance = (deltaV * deltaV) / 6000;
const targetDistance = 7500;
const distanceError = calculatedDistance - targetDistance;

log(`> Расчетная дальность: ${calculatedDistance.toFixed(1)} км (Цель: ${targetDistance} км)`);

// 3. Расчет ошибки по азимуту
const flightTime = (targetDistance / 7500) * 1200;
const optimalAzimuth = 74.5;
const azimuthError = Math.abs(azimuth - optimalAzimuth);
const lateralError = azimuthError * 111;

log(`> Полетное время: ${(flightTime / 60).toFixed(1)} мин.`);
log(`> Учет вращения Земли (Кориолис): учтен.`);

// 4. Оценка результатов падения с задержкой
setTimeout(() => {
log('🎯 РАКЕТА ПОДХОДИТ К ЦЕЛИ...');

setTimeout(() => {
const totalMissDistance = Math.sqrt((distanceError * distanceError) + (lateralError * lateralError));

log(`> Ошибка по дальности: ${Math.abs(distanceError).toFixed(2)} км`);
log(`> Боковое отклонение: ${lateralError.toFixed(2)} км`);
log(`> Общее отклонение: ${totalMissDistance.toFixed(2)} км`);

// Проверка попадания в ячейку 100х100 метров (0.1 км)
if (totalMissDistance <= 0.1) {
log('🎉 <strong>ПРЯМОЕ ПОПАДАНИЕ!</strong> Шахта противника уничтожена!');
} else if (totalMissDistance <= 2.0 && warhead >= 5000) {
log('💥 <strong>УСПЕХ БОЕГОЛОВКИ!</strong> Близкий разрыв мощного заряда уничтожил шахту!');
} else {
log('❌ <strong>ПРОМАХ!</strong> Ракета упала в стороне от цели.');
}
log('-----------------------------------');
}, 1000);
}, 1000);

} catch (err) {
log('❌ СИСТЕМНЫЙ СБОЙ: ' + err.message);
}
}
</script>
</body>
</html>
