<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05070c"
    >

    <meta
        name="description"
        content="SPN CUSTOM ROOM — PUBG ESPORTS CUSTOM ROOM"
    >

    <title>SPN CUSTOM ROOM</title>

    <link rel="stylesheet" href="style.css?v=10">
</head>

<body>

<div class="page-bg"></div>

<header class="site-header">

    <div class="header-glow"></div>

    <div class="header-content">

        <div class="brand-mark">
            <span>SPN</span>
        </div>

        <div class="brand-text">

            <h1>SPN CUSTOM ROOM</h1>

            <p>
                PUBG ESPORTS • CUSTOM ROOM
            </p>

        </div>

        <div class="live-status">
            <span class="live-dot"></span>
            LIVE
        </div>

    </div>

</header>


<section class="stats-section">

    <div class="stat-card">

        <div class="stat-icon">
            TEAM
        </div>

        <div class="stat-content">

            <span
                class="stat-number"
                id="teamCount"
            >
                44
            </span>

            <span class="stat-label">
                КОМАНД
            </span>

        </div>

    </div>


    <div class="stat-card">

        <div class="stat-icon">
            SLOT
        </div>

        <div class="stat-content">

            <span
                class="stat-number"
                id="slotCount"
            >
                50
            </span>

            <span class="stat-label">
                СЛОТОВ
            </span>

        </div>

    </div>


    <div class="stat-card">

        <div class="stat-icon">
            DB
        </div>

        <div class="stat-content">

            <span
                class="stat-number"
                id="databaseStatus"
            >
                —
            </span>

            <span class="stat-label">
                DATABASE
            </span>

        </div>

    </div>

</section>


<section class="control-panel">

    <div class="search-box">

        <span class="search-icon">
           ⌕
        </span>

        <input
            type="text"
            id="searchInput"
            placeholder="Поиск по нику или ID..."
            autocomplete="off"
        >

        <button
            type="button"
            id="clearSearch"
            class="clear-search"
            aria-label="Очистить поиск"
        >
            ×
        </button>

    </div>


    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
            type="button"
        >
            ВСЕ
        </button>

        <button
            class="filter-btn"
            data-filter="buffer"
            type="button"
        >
            БУФЕР 1–6
        </button>

        <button
            class="filter-btn"
            data-filter="teams"
            type="button"
        >
            КОМАНДЫ 7–50
        </button>

    </div>

</section>


<div class="database-message" id="databaseMessage">
    <span class="database-message-dot"></span>
    <span id="databaseMessageText">
        Подключение к базе данных...
    </span>
</div>


<main class="main-content">

    <div
        class="slots-grid"
        id="slots"
    ></div>


    <div
        class="no-results"
        id="noResults"
    >

        <div class="no-results-icon">
            ×
        </div>

        <strong>
            НИЧЕГО НЕ НАЙДЕНО
        </strong>

        <span>
            Попробуйте изменить поисковый запрос
        </span>

    </div>

</main>


<footer class="site-footer">

    <div class="footer-line"></div>

    <div class="footer-content">

        <span>
            SPN CUSTOM ROOM
        </span>

        <span>
            PUBG ESPORTS
        </span>

    </div>

</footer>


<!-- SCREENSHOT MODAL -->

<div
    class="screenshot-backdrop"
    id="screenshotModal"
    aria-hidden="true"
>

    <div
        class="screenshot-window"
        role="dialog"
        aria-modal="true"
    >

        <button
            type="button"
            class="screenshot-close"
            id="screenshotClose"
            aria-label="Закрыть"
        >
            ×
        </button>

        <div class="screenshot-header">

            <span class="modal-label">
                PLAYER SCREENSHOT
            </span>

            <h3 id="screenshotTitle">
                Скриншот
            </h3>

        </div>

        <div class="screenshot-image-wrap">

            <img
                id="screenshotImage"
                src=""
                alt="Скриншот игрока"
            >

            <div
                class="screenshot-error"
                id="screenshotError"
            >
                Скриншот не найден
            </div>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- MAIN SCRIPT -->

<script src="script.js?v=10"></script>

</body>
</html>
