<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPN CUSTOM ROOM - Регистрация</title>
    <style>
        :root {
            --primary: #ff9900;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --free: #2d5a27;
            --busy: #1a4a8d;
            --blocked: #ff4444;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        h1 { text-align: center; color: var(--primary); font-size: 1.8em; margin-bottom: 20px; }
        
        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        .slot { background: var(--card-bg); border: 1px solid #333; padding: 6px; border-radius: 4px; font-size: 0.75em; min-height: 90px; text-align: center; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
        
        .slot.free { border-color: var(--free); background: #1a331a; }
        .slot.busy { border-color: var(--busy); background: var(--busy); color: #fff; }
        .slot.blocked { border-color: var(--blocked); color: var(--blocked); cursor: default; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; align-items: center; justify-content: center; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 8px; width: 90%; max-width: 380px; border: 1px solid #444; text-align: center; box-sizing: border-box; }
        
        form input { width: 100%; padding: 8px; margin: 5px 0; background: #333; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .player-group { background: #252525; padding: 8px; margin-bottom: 8px; border-radius: 4px; text-align: left; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .player-group:hover { border-color: var(--primary); background: #2a2a2a; }
        .player-group label { font-size: 0.8em; color: var(--primary); font-weight: bold; display: block; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 12px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; flex: 1; font-size: 1em; }
        .btn-submit { background: var(--primary); color: black; }
        .btn-back { background: #555; color: white; }
        .btn-yes { background: #2d5a27; color: white; }
        .btn-info { background: #1a4a8d; color: white; }
        
        .tg-link { display: inline-block; margin-top: 15px; background: #0088cc; color: white; padding: 10px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .tg-link:hover { background: #0077b3; }
        .hint-text { font-size: 0.7em; color: #888; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SPN CUSTOM ROOM</h1>
        <div class="slots-grid" id="slots">
            <!-- Сетка загружается динамически -->
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="regModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--primary); margin-top:0;">Регистрация</h3>
            
            <!-- Форма регистрации свободного слота -->
            <form id="freeForm" action="https://formspree.io/f/moeabknb" method="POST" style="display:none;">
                <input type="hidden" name="slot_number" id="formSlotInput">
                <input type="text" name="team_name" placeholder="Название команды" required>
                <div class="player-group" style="cursor:default;"><label>Капитан (Ник + ID)</label><input type="text" name="p1" required style="margin-top:5px;"></div>
                <div class="player-group" style="cursor:default;"><label>Игрок 2 (Ник + ID)</label><input type="text" name="p2" required style="margin-top:5px;"></div>
                <div class="player-group" style="cursor:default;"><label>Запасной (Ник + ID)</label><input type="text" name="sub" required style="margin-top:5px;"></div>
                <div class="btn-group">
                    <button type="button" class="btn-back" onclick="closeModal()">Назад</button>
                    <button type="submit" class="btn-submit">Отправить</button>
                </div>
            </form>

            <!-- Меню выбора для занятого слота -->
            <div id="busyChoice" style="display:none;">
                <p>Что вы хотите сделать?</p>
                <div class="btn-group" style="flex-direction: column;">
                    <button type="button" class="btn-info" onclick="showTeamInfo()">Просмотр команды</button>
                    <button type="button" class="btn-yes" onclick="showBuyoutInfo()">Выкупить слот</button>
                </div>
                <div style="margin-top: 15px;">
                    <button type="button" class="btn-back" onclick="closeModal()" style="width:100%;">Отмена</button>
                </div>
            </div>

            <!-- Просмотр информации о команде и скриншотов при клике -->
            <div id="teamInfoView" style="display:none; text-align: left;">
                <p style="font-size: 0.75em; color: #888; text-align: center; margin-bottom: 10px;">Нажмите на игрока, чтобы открыть его скриншот</p>
                
                <div class="player-group" onclick="openPlayerScreen('p1')">
                    <label>Капитан</label>
                    <div id="infoP1" style="font-size: 0.9em; margin-top: 2px;"></div>
                    <div class="hint-text">Нажмите для просмотра скриншота ↗</div>
                </div>
                <div class="player-group" onclick="openPlayerScreen('p2')">
                    <label>Игрок 2</label>
                    <div id="infoP2" style="font-size: 0.9em; margin-top: 2px;"></div>
                    <div class="hint-text">Нажмите для просмотра скриншота ↗</div>
                </div>
                <div class="player-group" onclick="openPlayerScreen('sub')">
                    <label>Запасной</label>
                    <div id="infoSub" style="font-size: 0.9em; margin-top: 2px;"></div>
                    <div class="hint-text">Нажмите для просмотра скриншота ↗</div>
                </div>
                
                <div style="margin-top: 15px;">
                    <button type="button" class="btn-back" onclick="openBusyChoice()" style="width:100%;">Назад</button>
                </div>
            </div>

            <!-- Контакты администратора для выкупа -->
            <div id="buyoutInfo" style="display:none;">
                <p style="font-size: 0.9em; line-height: 1.4;">Для выкупа слота обратитесь в Telegram к администратору:</p>
                <a href="https://t.me/VankKingX" target="_blank" class="tg-link">@VankKingX</a>
                <div style="margin-top: 15px;">
                    <button type="button" class="btn-back" onclick="openBusyChoice()" style="width:100%;">Назад</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_API = 'https://sheetdb.io/api/v1/9mfn5f1lr1hu2';
        let currentSlotData = null;

        async function loadSlots() {
            let bookedSlots = {};
            try {
                let response = await fetch(SHEET_API);
                let data = await response.json();
                data.forEach(row => {
                    if(row.slot_number) bookedSlots[row.slot_number] = row;
                });
            } catch (e) { console.log('Ошибка загрузки'); }

            let grid = document.getElementById('slots');
            grid.innerHTML = '';

            for(let i = 1; i <= 50; i++) {
                if (i <= 4) {
                    grid.innerHTML += '<div class="slot blocked">#'+i+'<br>БУФЕР</div>';
                } else if (bookedSlots[i]) {
                    let d = bookedSlots[i];
                    let price = d.price ? d.price + ' ₽' : '100 ₽'; 
                    window['slotData_' + i] = d;
                    grid.innerHTML += '<div class="slot busy" onclick="openBusyModal('+i+')">#'+i+'<br><b>'+(d.team_name || 'Занято')+'</b><span style="font-size:0.8em; opacity:0.9; display:block; margin-top:2px;">1: '+(d.p1||'')+'<br>2: '+(d.p2||'')+'<br>Зап: '+(d.sub||'-')+'</span><span style="color:#ffcc00; font-weight:bold; font-size:0.85em; margin-top:2px;">Выкуп: '+price+'</span></div>';
                } else {
                    grid.innerHTML += '<div class="slot free" onclick="openFreeModal('+i+')">#'+i+'<br>Свободен</div>';
                }
            }
        }

        const modal = document.getElementById('regModal');
        const freeForm = document.getElementById('freeForm');
        const busyChoice = document.getElementById('busyChoice');
        const teamInfoView = document.getElementById('teamInfoView');
        const buyoutInfo = document.getElementById('buyoutInfo');
        const modalTitle = document.getElementById('modalTitle');

        function openFreeModal(n) {
            modal.style.display = 'flex';
            modalTitle.innerText = 'Регистрация: Слот #' + n;
            document.getElementById('formSlotInput').value = n;
            freeForm.style.display = 'block';
            busyChoice.style.display = 'none';
            teamInfoView.style.display = 'none';
            buyoutInfo.style.display = 'none';
        }

        function openBusyModal(n) {
            currentSlotData = window['slotData_' + n] || {};
            modal.style.display = 'flex';
            modalTitle.innerText = 'Слот #' + n + ' (' + (currentSlotData.team_name || 'Занято') + ')';
            openBusyChoice();
        }

        function openBusyChoice() {
            freeForm.style.display = 'none';
            teamInfoView.style.display = 'none';
            buyoutInfo.style.display = 'none';
            busyChoice.style.display = 'block';
            modalTitle.innerText = 'Управление слотом';
        }

        function showTeamInfo() {
            busyChoice.style.display = 'none';
            teamInfoView.style.display = 'block';
            modalTitle.innerText = 'Состав команды';

            document.getElementById('infoP1').innerText = currentSlotData.p1 || 'Не указан';
            document.getElementById('infoP2').innerText = currentSlotData.p2 || 'Не указан';
            document.getElementById('infoSub').innerText = currentSlotData.sub || 'Не указан';
        }

        function openPlayerScreen(role) {
            let screenUrl = currentSlotData[role + '_screen'];
            
            if (screenUrl) {
                window.open(screenUrl, '_blank');
            } else {
                alert('Скриншот для этого игрока еще не загружен.');
            }
        }

        function showBuyoutInfo() {
            busyChoice.style.display = 'none';
            buyoutInfo.style.display = 'block';
            modalTitle.innerText = 'Выкуп слота';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        loadSlots();
    </script>
</body>
</html>
