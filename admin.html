<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05070c"
    >

    <title>SPN ADMIN</title>

    <link rel="stylesheet" href="admin.css?v=1">
</head>

<body>

<div class="admin-bg"></div>

<header class="admin-header">

    <div>
        <div class="admin-logo">SPN</div>

        <div class="admin-title">
            CUSTOM ROOM ADMIN
        </div>

        <div class="admin-subtitle">
            УПРАВЛЕНИЕ СЛОТАМИ
        </div>
    </div>

    <button
        type="button"
        id="logoutButton"
        class="logout-button"
    >
        ВЫЙТИ
    </button>

</header>


<main class="admin-main">

    <!-- LOGIN -->

    <section
        id="loginSection"
        class="login-section"
    >

        <div class="login-card">

            <div class="login-label">
                ADMIN ACCESS
            </div>

            <h1>
                Вход
            </h1>

            <p class="login-description">
                Войдите в панель управления SPN CUSTOM ROOM
            </p>


            <form id="loginForm">

                <label>
                    EMAIL

                    <input
                        type="email"
                        id="emailInput"
                        autocomplete="email"
                        required
                    >
                </label>


                <label>
                    ПАРОЛЬ

                    <input
                        type="password"
                        id="passwordInput"
                        autocomplete="current-password"
                        required
                    >
                </label>


                <button
                    type="submit"
                    class="primary-button"
                >
                    ВОЙТИ
                </button>

            </form>


            <div
                id="loginMessage"
                class="message"
            ></div>

        </div>

    </section>


    <!-- ADMIN PANEL -->

    <section
        id="panelSection"
        class="panel-section"
        hidden
    >

        <div class="panel-top">

            <div>
                <div class="panel-label">
                    DATABASE
                </div>

                <h1>
                    Слоты
                </h1>

                <p id="userEmail"></p>
            </div>

            <div
                id="databaseMessage"
                class="database-message"
            >
                Загрузка...
            </div>

        </div>


        <div
            id="slotsList"
            class="slots-list"
        ></div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin.js?v=1"></script>

</body>
                  </html>
