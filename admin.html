<!DOCTYPE html>
<html>
<body>
<h2>Админка турнира</h2>
<div id="controls"></div>
<script>
let data = JSON.parse(localStorage.getItem('pubg_data') || '[{"tag":"TEAM1","kills":0,"pts":0}]');

function render() {
const cont = document.getElementById('controls');
cont.innerHTML = data.map((t, i) => `
<div>${t.tag}:
<button onclick="change(${i}, 'kills', 1)">K+1</button>
<button onclick="change(${i}, 'pts', 1)">P+1</button>
<button onclick="save()">Сохранить</button>
</div>
`).join('');
}
function change(i, field, val) { data[i][field] += val; render(); }
function save() { localStorage.setItem('pubg_data', JSON.stringify(data)); window.dispatchEvent(new Event('storage')); }
render();
</script>
</body>
</html>
